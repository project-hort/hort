version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    reviewers:
      - "hort/maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"

  # B10/INFRA-8: the dev/E2E compose stack — its Dockerfile (digest-pinned
  # base images) and the docker-compose.yml service image tags.
  - package-ecosystem: "docker"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
    reviewers:
      - "hort/maintainers"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "hort/maintainers"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"

  # No cargo ecosystem here: cargo bumps flow exclusively through the GitLab
  # Renovate warm -> quarantine -> regen choreography. A standalone dependabot
  # cargo PR structurally cannot pass either of the two gates that choreography
  # satisfies together: `hort-deps-gate` (a version the vetted index hasn't
  # served yet is red by design -- quarantine never yields a green gate) and
  # attribution-sync (a Cargo.lock bump without a THIRD-PARTY-LICENSES regen in
  # the same change fails the release-scoped attribution gate). GitHub security
  # alerts are config-independent and stay active regardless of this ecosystem
  # list.
