name: Installer

# Lints + fixture-functional-tests the hort.rs installer scripts.
#
# Deployment is NOT GitHub Pages (issue #77 retired that gated-but-never-enabled path — see
# git history for the old `deploy-pages` job if you need it). hort.rs is served by the
# `website` ansible role (deploy/ansible/roles/website/, deploy/ansible/site-website.yml),
# which builds install/{install-cli.sh,install-cli.ps1,cosign.pin} verbatim into the site at
# their exact published apex paths via scripts/build-site.sh --site hort.rs (see
# scripts/site/generate.py::copy_hort_rs_apex_files). This workflow's jobs below still gate
# the scripts themselves on every push/PR — they are the source of truth this repo tests
# regardless of how the built result gets deployed.
#
# STILL DEFERRED (need real release assets): a "real release end-to-end" verify job + a
# wrong-identity (_HORT_INTERNAL_TEST_BAD_IDENTITY=1) fail-closed check.
on:
  push:
    branches: [main]
    paths: ['install/**', '.github/workflows/install.yml']
  pull_request:
    paths: ['install/**', '.github/workflows/install.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Shell lint + drift guard
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck dash
          shellcheck install/install-cli.sh install/tests/*.sh
          sh -n install/install-cli.sh
          dash -n install/install-cli.sh
          sh install/tests/test_pin_consistency.sh
      - name: PSScriptAnalyzer (install-cli.ps1)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path install/install-cli.ps1 -Severity Warning,Error
          if ($r) { $r | Format-Table -AutoSize; exit 1 }
          Write-Host 'PSScriptAnalyzer clean'

  functional-unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fixture functional test (stubbed cosign)
        run: sh install/tests/test_install_sh.sh

  functional-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Fixture functional test (stubbed cosign)
        shell: pwsh
        run: pwsh -File install/tests/test_install_ps1.ps1
