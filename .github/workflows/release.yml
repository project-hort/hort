name: Release

on:
  push:
    tags: ['v*']
  # A manual dispatch picks its OWN ref, and dispatching a workflow needs only
  # Actions write access — so the ref a dispatch carries is not a release
  # decision and must not be read as one. Every job below that signs an asset,
  # publishes a crate or creates the GitHub Release therefore requires
  # `startsWith(github.ref, 'refs/tags/v')` in its own `if:`: a dispatch
  # against `develop`, or any other writable ref, signs nothing, publishes
  # nothing and creates no tag. `ci-gate` and `e2e-gate` carry the same
  # condition, so such a dispatch is a complete no-op rather than a full ci.yml
  # run plus the compose E2E suite for a workflow that could then produce
  # nothing. Branch and PR coverage does not depend on those two edges: ci.yml
  # and e2e.yml both run on branch pushes themselves.
  #
  # Why that matters more here than anywhere else in the repo: the `release`
  # job holds `contents: write` and `softprops/action-gh-release` CREATES the
  # tag it is handed. Before the conditions below, a dispatch from a branch
  # with `version: 2.0.0` minted a real `v2.0.0` git tag pointing at that
  # branch commit and hung cosign-signed assets off it. The release itself
  # stayed a draft — but only as a side effect of `verify-images-published`
  # being ref-gated and therefore `skipped`, and a git tag is not a draft: it
  # is visible in every clone, to `git describe`, and to anything that reads
  # the tag list.
  #
  # With the ref pinned to a release tag, `GITHUB_REF` already carries the
  # version, so the input below cannot be a second source of truth. It is a
  # statement of intent: `release` derives the version from the ref on every
  # path and rejects a dispatch whose input disagrees with it.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version of the dispatched tag (e.g. 1.0.0) — must equal the version carried by the ref; any other value is rejected. The ref must be a refs/tags/v* release tag.'
        required: true

# No workflow-level permissions block: each job below declares the minimal
# permission set it actually needs (default for an undeclared scope is `none`).
# This prevents low-trust jobs (e.g. the compose `e2e-gate`) from inheriting
# `id-token: write` / `packages: write` and being able to mint an OIDC token or
# push images.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # CI GATE — the advisory and attribution checks run BEFORE anything ships
  # ════════════════════════════════════════════════════════════════════════════
  #
  # A `v*` tag starts this workflow, ci.yml and docker-publish.yml
  # independently, and GitHub Actions has no `needs:` across workflow
  # boundaries. So ci.yml's `security-audit` (`cargo audit --deny warnings`),
  # `cargo-deny` and `attribution-sync` (`scripts/check-attribution.sh`) jobs
  # could be RED while this workflow signed and uploaded release binaries,
  # published crates to registry.hort.rs and published the GitHub Release —
  # a tagged commit with a fresh advisory, a banned dependency or stale
  # THIRD-PARTY-LICENSES shipping anyway, which is the opposite of what
  # ADR 0047 / ADR 0049 promise. Calling ci.yml as a reusable workflow puts
  # those checks inside THIS run's dependency graph, where `needs:` can hold
  # the release — the same mechanism `e2e-gate` below already uses for e2e.yml.
  #
  # The gate is the WHOLE ci.yml run, not only those three jobs: a `uses:`
  # caller waits on every job the callee defines, so clippy, the unit and
  # integration suites and coverage hold the release too. That is stricter than
  # ci.yml's own `ci-complete` roll-up, which lets a red `coverage` through, and
  # stricter in the fail-closed direction — the one this gate exists for.
  #
  # `uses:` rather than `workflow_run:` deliberately: a `workflow_run`-triggered
  # run executes in the default branch's context, not the tag's, which is the
  # wrong commit for a gate whose whole claim is "these checks passed for THIS
  # artifact".
  #
  # Cost, named rather than hidden: on a non-alpha tag ci.yml runs three times —
  # once standalone, once per calling publish workflow. That is accepted;
  # extracting the three security jobs into their own reusable workflow so only
  # the cheap part repeats is a restructuring of ci.yml for a cost nobody has
  # measured.
  #
  # No `-alpha.` guard here, matching the rest of this workflow: its alpha
  # safety is indirect and already works (no images are published for an alpha,
  # so `verify-images-published` fails, the gate step reports not-all-passed and
  # the GitHub Release stays a draft; `build-binaries` only ever uploads
  # workflow artifacts).
  ci-gate:
    name: 🔐 CI Gate (audit / deny / attribution)
    # Ref-gated for the same reason docker-publish.yml's `ci-gate` is: without
    # it a branch dispatch runs a full CI pass for a workflow that can then
    # produce nothing, because every job that signs or publishes below requires
    # a release ref. Branch and PR coverage does not depend on this edge —
    # ci.yml runs on its own for those, and has its own `workflow_dispatch`.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # A called workflow cannot request more than its caller grants — Actions
    # fails the run outright on an escalation — so this is the UNION of the
    # job-level requests inside ci.yml, not what the gate itself uses:
    #   contents: read       every job checks out;
    #   id-token: write      hort-deps-gate / check-rust / test-backend-unit /
    #                        coverage mint the hort OIDC token (a no-op unless
    #                        HORT_PROXY_ACTIVE, which is false off a same-repo
    #                        PR — so nothing mints anything on a tag);
    #   pull-requests: write hort-deps-gate's quarantine-triage comment.
    # This is a ceiling for the callee, not a grant to anything else here; each
    # ci.yml job still narrows to its own declared set, and these are exactly
    # the permissions ci.yml already has when it runs standalone on this tag.
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    with:
      gate_for: release

  # ════════════════════════════════════════════════════════════════════════════
  # E2E GATE - Must pass before release proceeds
  # ════════════════════════════════════════════════════════════════════════════

  e2e-gate:
    name: 🚦 E2E Gate
    # Ref-gated with `ci-gate`, and this one also removes a live collision: a
    # called workflow evaluates `github.ref` as the CALLER's, so a branch
    # dispatch of this workflow landed in `e2e-${{ github.ref }}` — the same
    # concurrency group as that branch's own push-triggered E2E run, with
    # `cancel-in-progress: true`. Dispatching from `develop` therefore killed
    # `develop`'s E2E. A tag push was never affected (different group), so the
    # release gate was never at risk; the branch case simply has no reason to
    # exist, since e2e.yml runs on branch pushes by itself.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    # e2e.yml runs the full native-tests compose suite across both posture
    # lanes (base + native-tokens overlay) as two jobs (no input knobs); it is
    # reusable via its `workflow_call:` trigger, and a `uses:` caller waits on
    # every job the callee defines — so this single dependency already covers
    # both lanes with no extra job listed here. It only checks out the repo
    # and runs docker compose — no OIDC, no registry writes.
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  # ════════════════════════════════════════════════════════════════════════════
  # BUILD BINARIES
  # ════════════════════════════════════════════════════════════════════════════

  build-binaries:
    name: Build binaries
    # Both gates. A failed or cancelled `ci-gate` or `e2e-gate` skips this job
    # through Actions' default behaviour, and the `if:` below carries NO
    # `always()`, so that default survives it — the two edges keep gating.
    # Everything that publishes downstream (`verify-images-published`,
    # `hort-publish`, `release`) requires
    # `needs.build-binaries.result == 'success'`, so a skip here is the
    # fail-closed stop for the whole workflow — nothing is signed, no crate is
    # published, and no GitHub Release is created at all.
    needs: [e2e-gate, ci-gate]
    # `publish: true` below is what makes this the SIGNING build:
    # build-binaries.yml stamps the workspace version from the ref and
    # `cosign sign-blob`s every asset under hort's release identity. A dispatch
    # picks its own ref, so without this test a dispatch from any writable
    # branch produced real Sigstore signatures over branch content carrying a
    # release version number.
    #
    # Stated here on the job rather than inherited, for two reasons. Neither
    # gate above helps — a branch passes CI and the E2E suite perfectly well —
    # and a skip cascade is only as strong as the `if:` of the job inheriting
    # it, which an `always()` anywhere downstream silently voids.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      id-token: write   # keyless cosign signing inside the reusable workflow
    uses: ./.github/workflows/build-binaries.yml
    with:
      publish: true

  # ════════════════════════════════════════════════════════════════════════════
  # VERIFY REQUIRED IMAGES PUBLISHED ON GHCR.IO
  #
  # Cross-repo image-publish gate. v1.1.8 shipped with no
  # ghcr.io/.../hort-web:1.1.8 published, breaking every fresh
  # helm install. This job polls ghcr.io for every image the chart
  # references at the release version tag, and fails if any is missing
  # after the docker-publish workflows have had time to complete.
  #
  # When this gate fails, the GitHub Release stays a draft (see Check
  # gate status step in the release job below).
  #
  # Tracks Hardening Core issue
  # https://github.com/project-hort/hort/issues/882
  # ════════════════════════════════════════════════════════════════════════════

  verify-images-published:
    name: 🐳 Verify Required Images Published
    runs-on: ubuntu-latest
    permissions:
      packages: read
    needs: [build-binaries]
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-binaries.result == 'success'
    timeout-minutes: 35
    steps:
      - name: Wait for and verify required images on ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Verifying required images for version: ${VERSION}"
          echo "Every image must be present on ghcr.io."

          # Poll for up to 30 minutes per image. Multi-arch builds, cosign
          # signing and provenance attestation routinely take 15-25 minutes,
          # so we wait rather than fail-fast.
          DEADLINE=$(($(date +%s) + 30*60))

          # Required artifact set. Each entry is "<registry>|<name>:<tag>".
          # docker-publish.yml publishes the server + worker images AND the
          # Helm chart to ghcr.io under the project-hort org (the docker.io
          # mirror was retired). The chart references BOTH images, so a release
          # that ships only the server (the v1.1.8 hort-web failure mode) must
          # stay a draft — hence all three are gated here.
          IMAGES=(
            "ghcr.io|project-hort/hort-server:${VERSION}"
            "ghcr.io|project-hort/hort-worker:${VERSION}"
            "ghcr.io|project-hort/charts/hort-server:${VERSION}"
          )

          # Common Accept headers cover OCI index + OCI single manifest (the
          # latter required for the Helm chart, which `helm push` writes as an
          # image.manifest.v1 artifact rather than an index), Docker manifest
          # list, and Docker manifest v2 (different registries return different
          # default media types).
          MANIFEST_ACCEPT='-H Accept:application/vnd.oci.image.index.v1+json -H Accept:application/vnd.oci.image.manifest.v1+json -H Accept:application/vnd.docker.distribution.manifest.list.v2+json -H Accept:application/vnd.docker.distribution.manifest.v2+json'

          probe_ghcr() {
            local name="$1"; local tag="$2"
            local token
            token=$(curl -sf "https://ghcr.io/token?service=ghcr.io&scope=repository:${name}:pull" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              | jq -r '.token // empty')
            [ -n "${token}" ] || return 1
            # shellcheck disable=SC2086
            # --proto =https refuses to follow HTTPS->HTTP redirects so the
            # Bearer token can never leak over plaintext.
            curl -sfL --proto =https -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              ${MANIFEST_ACCEPT} \
              "https://ghcr.io/v2/${name}/manifests/${tag}"
          }

          probe() {
            local registry="$1"; local img="$2"
            local name="${img%:*}"; local tag="${img#*:}"
            case "${registry}" in
              ghcr.io)   probe_ghcr "${name}" "${tag}" ;;
              *) echo "::error::unknown registry ${registry}"; return 2 ;;
            esac
          }

          missing=()
          for entry in "${IMAGES[@]}"; do
            registry="${entry%%|*}"
            img="${entry#*|}"
            echo ""
            echo "Polling ${registry}/${img}"
            while true; do
              if probe "${registry}" "${img}"; then
                echo "  ✓ ${registry}/${img}"
                break
              fi
              if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                echo "::error::Required image missing on ${registry} after 30m: ${img}"
                missing+=("${registry}/${img}")
                break
              fi
              echo "  not yet present, waiting 30s..."
              sleep 30
            done
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo ""
            echo "::error::One or more required images are missing on ghcr.io after the deadline. The GitHub Release will be marked DRAFT and will not promote to stable until every required image is published."
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo ""
          echo "All required images present on ghcr.io for version ${VERSION}."

  # ════════════════════════════════════════════════════════════════════════════
  # SBOM (CycloneDX JSON)
  # ════════════════════════════════════════════════════════════════════════════
  #
  # CRA Annex I §2 mandates a maintained SBOM as part of delivery. We emit
  # one CycloneDX JSON SBOM per workspace member via cargo-cyclonedx and
  # attach the bundled tarball to the release. The SBOM job runs in parallel
  # with `build-binaries` because it has no binary dependencies — it waits on
  # the same two gates, not on the binaries. Its result is a publish-or-draft
  # input in the `release` job below: an SBOM the dependency graph has not been
  # cleared for is not provenance.

  sbom:
    name: 📜 Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # keyless cosign sign-blob of the SBOM bundle (Fulcio OIDC)
    needs: [e2e-gate, ci-gate]
    # Three independent requirements, all conjoined.
    #
    # `always()` neutralises the implicit blocking that `needs:` would
    # otherwise give, which is why the two gate clauses have to be named here
    # explicitly — adding a gate to the list above without a clause here would
    # leave it decorative.
    #
    # The ref test answers a different hazard than the two gates do. The step
    # below `cosign sign-blob`s the SBOM bundle under hort's release identity,
    # and a dispatch picks its own ref: without this test a dispatch from any
    # writable branch produced a real Sigstore signature over an SBOM of
    # branch content. This job carries no `environment: release` and never did
    # — so the ref test, not that declaration, is the whole of what keeps the
    # dispatch path from signing here.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.e2e-gate.result == 'success' &&
      needs.ci-gate.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.81.11
        with:
          tool: cargo-cyclonedx

      - name: Generate CycloneDX SBOMs
        env:
          SQLX_OFFLINE: true
        run: cargo cyclonedx --format json --override-filename sbom

      - name: Bundle SBOMs
        run: |
          mkdir -p sbom-bundle
          # Each workspace member emits `sbom.json` next to its Cargo.toml.
          # Re-key by crate path so the bundle is unambiguous.
          find . -name "sbom.json" -not -path "./target/*" -not -path "./.cargo/*" | while read -r p; do
            rel=$(dirname "$p" | sed "s|^\./||")
            crate=${rel//\//-}
            crate=${crate:-root}
            cp "$p" "sbom-bundle/sbom-${crate}.json"
          done
          ls -la sbom-bundle/
          tar -czvf hort-sbom.tar.gz sbom-bundle/
          sha256sum hort-sbom.tar.gz > hort-sbom.tar.gz.sha256

      # cosign sign-blob the SBOM bundle. CRA Annex I §2(1) treats the
      # SBOM as part of release delivery; signing it provides downstream
      # provenance verification. Same keyless OIDC signing path as
      # `build-binaries` and the container-image jobs in docker-publish.yml.
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign SBOM with cosign sign-blob
        run: |
          cosign sign-blob --yes \
            --bundle hort-sbom.tar.gz.bundle \
            hort-sbom.tar.gz

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hort-sbom
          path: |
            hort-sbom.tar.gz
            hort-sbom.tar.gz.sha256
            hort-sbom.tar.gz.bundle
          retention-days: 365

  # ════════════════════════════════════════════════════════════════════════════
  # PUBLISH CRATES TO HORT REGISTRY
  #
  # Publishes the workspace's first-party crates to the hosted `hort-crates`
  # repository on registry.hort.rs. Gated by vars.HORT_PROXY_ENABLED == 'true'
  # (default off) so merging before the live instance exists does not fail the
  # release. Any value other than exactly 'true' (absent, empty, 'false', etc.)
  # is treated as disabled.
  #
  # The `environment: release` declaration causes this job's OIDC token to
  # carry the `environment: release` claim; hort-auth additionally requests
  # audience `hort-server-release` (issue #82). Both discriminators together
  # match `gha-release`'s ServiceAccount — belt-and-suspenders, not either
  # alone. Without `environment: release` the OIDC token lacks the
  # `environment` claim; without the matching audience the exchange is
  # rejected by hort with `aud_mismatch` at the OidcIssuer gate before
  # federatedIdentities matching is even reached.
  #
  # Protected environment setup — CONFIGURED as of 2026-10-07:
  #   GitHub → Settings → Environments → release:
  #     - Deployment branches and tags: tags matching `v*`
  #     - No required reviewer (single maintainer; self-approval is friction
  #       without review, so the tag rule is the whole gate)
  #   GitHub therefore refuses to emit the `environment: release` claim for any
  #   other ref, which is what makes `gha-release`'s federation trustworthy —
  #   SA claim matching is exact and has no globs, so no `ref:` pattern could
  #   express this inside hort.
  #   This is the SECOND mechanism, not the only one: every job declaring the
  #   environment also carries its own `refs/tags/v*` condition.
  #
  # cargo publish mechanics for a path-dep workspace:
  #   - `cargo publish --no-verify` is required: the workspace uses path deps
  #     (each crate's Cargo.toml has `crate-name = { path = "../..." }`).
  #     Without --no-verify, cargo tries to build the crate in isolation, which
  #     fails because the path deps are not yet on the registry. --no-verify
  #     skips the pre-publish build check; the actual build already passed CI.
  #   - Crates must be published in topological (dependency) order: a crate
  #     that depends on another must be published AFTER its dependency has been
  #     indexed, otherwise the version-resolution step fails.
  #   - `--registry hort-crates` targets the hosted `hort-crates` repo; the
  #     token is CARGO_REGISTRIES_HORT_CRATES_TOKEN (set by hort-auth).
  # ════════════════════════════════════════════════════════════════════════════

  hort-publish:
    name: Publish Crates to hort-crates
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write   # required to mint the OIDC token for the gha-release SA
    # `needs:` names only `build-binaries`, deliberately. The `if:` below opens
    # with `always()`, which voids the implicit blocking of every entry here,
    # and it tests `build-binaries.result` alone — so an `e2e-gate` entry in
    # this list would gate nothing while reading to a reviewer as though the
    # E2E suite guarded the crates publish. It does guard it, one step further
    # back: `build-binaries` requires both `e2e-gate` and `ci-gate` and carries
    # no `always()`, so reaching this job at all means both gates were green.
    # `sbom` and `release` carry the same note about their own decorative
    # edges; this one had the edge without the note.
    needs: [build-binaries]
    if: |
      always() &&
      needs.build-binaries.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.HORT_PROXY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      # Authenticate via the gha-release SA (environment: release AND
      # audience: hort-server-release — issue #82 — both must match one of
      # gha-release's federatedIdentities). Writes
      # CARGO_REGISTRIES_HORT_CRATES_TOKEN into the environment.
      - name: Hort registry auth
        id: hortauth
        uses: ./.github/actions/hort-auth
        with:
          proxy_enabled: ${{ vars.HORT_PROXY_ENABLED }}
          audience: hort-server-release

      # ── vetted-index preflight. The check itself lives in scripts/ci/ so
      # this job, .gitlab-ci.yml's prefetch:warm and prefetch:verify all run
      # one implementation and cannot drift.
      #
      # cargo-virtual is released_only (NonServableStatusFilter +
      # IndexModeFilter, hort-http-cargo/src/serve.rs): a locked dep hort has
      # never ingested, or is still inside its quarantine window, is simply
      # absent from the served index. Discovery via `cargo publish` itself is
      # SERIAL — cargo fails at the first missing version, so a naive release
      # attempt surfaces exactly one cold dep per try and each retry costs a
      # full quarantine window. This step enumerates every cold dep up front
      # so a single warm + wait covers the whole set instead of one-at-a-time.
      #
      # locked-registry-deps.sh deliberately does not use `cargo metadata` to
      # enumerate the locked graph: source replacement is already active in
      # this job (hort-auth just wrote .cargo/config.toml), so `cargo
      # metadata` would resolve through the very index this preflight exists
      # to check, hitting the same serial one-miss failure it's meant to
      # replace. It parses Cargo.lock directly instead. (prefetch-warm.yml
      # runs without replacement, so it can keep using `cargo metadata`.)
      - name: Vetted-index preflight (released_only cold-dep check)
        env:
          HORT_URL: https://registry.hort.rs
          CARGO_SOURCE_REPO: cargo-virtual
          HORT_TOKEN: ${{ steps.hortauth.outputs.token }}
        run: |
          set -euo pipefail

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "${tmpdir}"' EXIT

          scripts/ci/locked-registry-deps.sh Cargo.lock > "${tmpdir}/locked.txt"
          locked_count=$(wc -l < "${tmpdir}/locked.txt")

          if ! scripts/ci/vetted-index-preflight.sh "${HORT_URL}" "${CARGO_SOURCE_REPO}" \
              < "${tmpdir}/locked.txt" > "${tmpdir}/cold.txt"; then
            cold_count=$(wc -l < "${tmpdir}/cold.txt")

            # Same request shape as prefetch-warm.yml: batch-POST the FULL
            # locked set (idempotent — already-present entries are a no-op),
            # starting every missing dep's quarantine window in parallel
            # instead of one at a time.
            items=$(jq -R -s -c '
              split("\n") | map(select(length > 0) | split(" ") | {package: .[0], version: .[1]})
            ' "${tmpdir}/locked.txt")

            echo "Cold deps found — starting a prefetch warm for the full locked set (${locked_count} deps)…"
            # -f: a non-2xx (most likely 403 — this identity's prefetch
            # grant on cargo-virtual is not applied) must be loud, not
            # rendered as a misleading `queued: ?  already_present: ?` line.
            if ! curl -fsS -X POST "${HORT_URL}/api/v1/repositories/${CARGO_SOURCE_REPO}/prefetch" \
              -H "Authorization: Bearer ${HORT_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"items\": ${items}}" \
              | jq -r '"enqueued: \(.enqueued_job_ids | length)  already_held: \(.skipped_already_held | length)  rejected: \(.rejected_packages | length)  failed: \(.failed | length)" , (.rejected_packages[]? | "  rejected: \(.package) \(.version // "") — \(.reason // .message // "no reason given")") , (.failed[]? | "  failed: \(.package) \(.version // "") — \(.reason // .message // "no reason given")")'; then
              echo "::warning::prefetch POST failed — likely cause: the gha-release-prefetch-cargo-virtual grant is not applied yet (issue #138). Cold deps below still block this publish."
            fi

            echo "::error::hort-publish preflight: ${cold_count} locked dependency version(s) are not yet served by the vetted index (cargo-virtual, released_only) — publish would otherwise fail one miss at a time. A prefetch warm was just started for the full locked set; re-run this release after the crates-proxy quarantine window (24h, or 3d once #126's playbook run is applied) so every cold dep above has cleared quarantine. Cold set:"
            while read -r name version; do
              echo "::error::  ${name} ${version}"
            done < "${tmpdir}/cold.txt"
            exit 1
          fi

          echo "Vetted-index preflight OK — ${locked_count} locked deps all served by ${CARGO_SOURCE_REPO}."

      # The set and the order both come from the manifests, via
      # scripts/ci/publishable-crates-in-order.sh — a member is published
      # unless it sets `publish = false`, and the order is a topological sort
      # of the intra-workspace edges between the published crates. The
      # previous hand-maintained list drifted from the graph it claimed to
      # describe (it published hort-app before hort-config, which hort-app
      # depends on) and nothing caught it, because nothing else read it.
      #
      # The published set includes the in-memory EphemeralStore adapter. It is
      # not a test fixture: it is the default backend — both binaries take it
      # as an ordinary (not dev-) dependency and select it whenever
      # HORT_EPHEMERAL_STORE_BACKEND is unset or `memory` — and hort-http-core
      # keeps it as an optional dependency that the published manifest
      # retains. Publishing hort-http-core without it fails at resolve time,
      # so the two ship together. The script rejects that class of hole
      # up front rather than discovering it mid-release, when earlier crates
      # are already uploaded and can only be yanked.
      #
      # --no-verify: required for a path-dep workspace (path deps are not yet
      # available on the registry when the pre-publish build check runs; the CI
      # build already verified correctness). --registry hort-crates: targets the
      # hosted first-party registry, not the default crates.io.
      #
      # The sleep between publishes covers sparse-index propagation only — the
      # hort index-serve path is synchronous, so an uploaded crate is typically
      # in the index within 1–2 s. It does NOT cover a hosted repo's quarantine
      # window: where a ScanPolicy sets a non-zero observation period, the
      # index it serves omits a crate that has not cleared it. Every publish
      # after the first resolves its just-uploaded siblings (cargo does that
      # even under --no-verify), so that window, not this sleep, is what
      # decides whether the chain can resolve them.
      #
      # Resumability. A publish that fails partway leaves the crates it did
      # upload in the index, immutable and unwithdrawable; cargo then refuses
      # to republish any of them, so a re-run of the same tag used to die at
      # the first one and the remaining crates could never ship at that
      # version. scripts/ci/publish-crates.sh checks each crate against the
      # index BEFORE its attempt and skips the ones already there — never on
      # cargo's exit status afterwards, which cannot distinguish "refused to
      # republish" from "the upload failed". Its module comment carries the
      # full argument.
      #
      # The loop lives in that script rather than here so the constraint can
      # be tested: scripts/test-crate-version-in-index.sh drives it against a
      # fixture index with a stub cargo, and asserts both that already-present
      # crates are skipped and that a failing publish still aborts the run.
      - name: Publish hort crates to hort-crates (derived dependency order)
        env:
          SQLX_OFFLINE: "true"
          # The publishing identity's own token: hort serves a write-granted
          # principal a wider index view than an anonymous reader (ADR 0055),
          # and the skip check has to see what cargo will see.
          HORT_TOKEN: ${{ steps.hortauth.outputs.token }}
          # A federated bearer inherits its subject id-token's expiry —
          # min(1h, jwt.exp − now), and GitHub id-tokens expire after ~5
          # minutes — so any publish loop longer than that outlives one
          # token. The loop re-mints per crate through this hook (the
          # runner hands out fresh id-tokens for the whole job lifetime;
          # `permissions: id-token: write` above is what enables it).
          HORT_TOKEN_REFRESH_CMD: scripts/ci/github-oidc-hort-token.sh https://registry.hort.rs hort-server-release
        run: scripts/ci/publish-crates.sh https://registry.hort.rs hort-crates

  # ════════════════════════════════════════════════════════════════════════════
  # CREATE RELEASE
  # ════════════════════════════════════════════════════════════════════════════

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # softprops/action-gh-release creates the GitHub Release + uploads assets
    needs: [build-binaries, verify-images-published, sbom]
    # Two independent requirements, conjoined.
    #
    #   startsWith(github.ref, 'refs/tags/v')
    #       The `contents: write` above is handed to
    #       `softprops/action-gh-release`, which CREATES the tag it is given.
    #       `always()` has already voided the implicit needs-gating, so this
    #       condition is the only thing between a dispatch and a real `v*` git
    #       tag minted on a branch commit with cosign-signed assets hanging
    #       off it. Inheriting it was never an option: `always()` keeps only
    #       the needs this `if:` tests for success, and it tests exactly one —
    #       so `verify-images-published`, which carries the same ref test, is
    #       not in this job's effective-needs closure at all.
    #   needs.build-binaries.result == 'success'
    #       The signed assets exist. This is the one needs-edge `always()`
    #       leaves gating, deliberately: `verify-images-published` and `sbom`
    #       are read as draft-or-publish inputs in the gate step below
    #       instead, which is what `always()` is here for.
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-binaries.result == 'success'
    steps:
      # First step in the job, before the checkout, because it needs nothing
      # from the tree and because everything after it depends on the answer.
      #
      # The `if:` on this job pins the ref to a release tag, so `GITHUB_REF`
      # already carries the version and the dispatch input cannot be a second
      # source of truth — it can only agree with the ref or disagree with it,
      # and a disagreement means the operator dispatched a ref other than the
      # one they named. Reject that loudly instead of picking a side: silently
      # preferring either one releases something nobody asked for. The input
      # survives as a confirmation prompt (`required: true` keeps the field in
      # the dispatch form), not as a knob — for any given ref there is exactly
      # one value it can hold.
      #
      # Nothing else in this workflow reads the input, so the rejection here
      # cannot come after a mis-stamped artifact: `build-binaries` and `sbom`
      # both derive the version from the ref, and `Determine version` below
      # does too.
      - name: Validate dispatch version input
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          REF_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "${INPUT_VERSION}" != "${REF_VERSION}" ]; then
            echo "::error::version input '${INPUT_VERSION}' does not match the dispatched ref ${GITHUB_REF} (version '${REF_VERSION}'). Dispatch the tag you mean to release — the released version is derived from the ref, never from this input."
            exit 1
          fi
          echo "version input agrees with the ref: ${REF_VERSION}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: hort-*

      # One path, not two. Both outputs come from `GITHUB_REF` on a tag push
      # and on a dispatch alike: the `if:` on this job guarantees the ref is a
      # `refs/tags/v*` tag, which leaves no second path for an input to serve.
      # That is also what makes the create step below unable to mint a tag
      # anywhere — the `tag` it is handed is, by construction, the ref this run
      # is already on. An input-derived tag was the opposite property: it named
      # a tag that need not exist, and `action-gh-release` creates what it
      # cannot find.
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Check gate status
        id: gates
        run: |
          # Two of the four gates are already implied by reaching this job:
          # `e2e-gate` (e2e.yml) and `ci-gate` (ci.yml — cargo-audit,
          # cargo-deny, THIRD-PARTY-LICENSES sync) are both hard prerequisites
          # of `build-binaries`, and this job runs only when `build-binaries`
          # succeeded.
          #
          # The other two run BESIDE `build-binaries`, so `needs:` cannot block
          # on them (this job is `if: always()`, which is what lets a gate
          # failure still produce a draft rather than no release at all) and
          # their results are read here instead:
          #
          #   - verify-images-published — every image the chart references is
          #     live on ghcr.io at this version;
          #   - sbom — the cosign-signed CycloneDX bundle. ADR 0047 / ADR 0049
          #     promise it as part of release provenance and CRA Annex I §2
          #     requires it as part of delivery, so a release published without
          #     it makes a provenance claim that is false. Being in `needs:` is
          #     not enough on its own: `always()` neutralises the implicit
          #     blocking, which is exactly how a red `sbom` used to yield a
          #     fully published release with no SBOM attached.
          #
          # Either one not green ⇒ DRAFT, which is the fail-closed outcome.
          #
          # What the draft does NOT protect, stated because for a long time it
          # was the only thing standing between a branch dispatch and a
          # release — by accident. It never covered the git tag: the create
          # step below holds `contents: write` and `action-gh-release` mints
          # the tag it is handed, so a dispatch from a branch produced a real
          # `v*` tag on a branch commit (visible in every clone, to
          # `git describe` and to anything reading the tag list) with
          # cosign-signed assets attached to the draft. And the draft was not
          # a decision anyone recorded: it happened because
          # `verify-images-published` is ref-gated and so reports `skipped`
          # off a tag, which this step reads as not-green. A side effect of
          # another job's condition is not a guarantee. The `if:` on THIS job
          # is now the reason a branch dispatch cannot release, and the ref
          # condition on `build-binaries` / `sbom` is the reason it cannot
          # sign; the draft is back to being only what the next paragraph
          # says.
          #
          # What the draft DOES protect, on a legitimate release tag: these
          # two gates run BESIDE `build-binaries` rather than before it, so
          # `needs:` cannot hold this job on them without also losing the
          # ability to produce anything. The draft is how a red gate yields
          # "nothing published" instead of "no release at all" — the signed
          # assets stay attached and reviewable, and a re-run can publish them
          # once the gate is green.
          IMAGES_GATE="${{ needs.verify-images-published.result }}"
          SBOM_GATE="${{ needs.sbom.result }}"
          echo "images_gate=${IMAGES_GATE}" >> $GITHUB_OUTPUT
          echo "sbom_gate=${SBOM_GATE}" >> $GITHUB_OUTPUT

          if [[ "$IMAGES_GATE" == "success" && "$SBOM_GATE" == "success" ]]; then
            echo "all_passed=true" >> $GITHUB_OUTPUT
            echo "Gates passed: images=$IMAGES_GATE sbom=$SBOM_GATE"
          else
            echo "all_passed=false" >> $GITHUB_OUTPUT
            echo "::warning::A required gate is not green: images=$IMAGES_GATE sbom=$SBOM_GATE. Release will be created as DRAFT."
          fi

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          # Binary tarballs + SBOM bundle (from the `sbom` job, also a
          # `*.tar.gz` artifact) and Windows .exe pairs.
          find artifacts -name "*.tar.gz*" -exec cp {} release-assets/ \;
          find artifacts -name "*.exe*" -exec cp {} release-assets/ \;
          ls -la release-assets/

      # Immutable-releases (a repo setting) freezes a release — and bars all
      # asset uploads — the instant it is published. If a release for this tag
      # already exists in a published state (e.g. one created via the GitHub
      # "Draft a new release" UI, which makes the tag and a release together),
      # the create step below would "find" it and be unable to upload, the
      # failure that produced empty 0-asset releases for v0.9.0/0.9.2-beta.1.
      # Delete any pre-existing release for this tag — keeping the git tag — so
      # the create step always starts from a fresh, mutable draft. No-op when
      # none exists; a published immutable release that cannot be deleted still
      # leaves the run to fail loudly at the create step, same as before.
      - name: Remove any pre-existing release for this tag (start from a clean draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false || true

      # Always create as a DRAFT first. GitHub's "Immutable releases" setting
      # freezes a release the moment it is published, so assets can only be
      # uploaded while the release is still a mutable draft. The publish step
      # below then publishes it — but only when all gates passed, so a gate
      # failure still leaves an unpublished draft (same outcome as before).
      - name: Create draft Release (assets upload while mutable)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Hort ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true

      # Publish the draft (fires release.published). `gh release edit` only
      # changes the flags passed, so re-assert prerelease/latest to match the
      # create-step intent (stable → latest, `-`-versioned → prerelease).
      - name: Publish release (gates passed only)
        if: steps.gates.outputs.all_passed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ steps.version.outputs.tag }}'
          if [[ '${{ steps.version.outputs.version }}' == *-* ]]; then
            gh release edit "$tag" --draft=false --prerelease
          else
            gh release edit "$tag" --draft=false --latest
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # NOTE: Docker images are published by .github/workflows/docker-publish.yml,
  # which already triggers on `tags: ['v*']`. We previously had a redundant
  # `docker-release` job here that re-dispatched docker-publish via
  # workflow_dispatch after the release was created. That second run
  # (a) duplicated ~30 minutes of multi-arch build work, and (b) could only
  # produce inferior tags because workflow_dispatch loses the tag context
  # required by docker/metadata-action's `type=semver` patterns. Removing it
  # leaves a single, deterministic publish path: tag push triggers
  # docker-publish.yml, which now self-verifies the published semver tags
  # before the run can succeed (see issue #905).
  # ════════════════════════════════════════════════════════════════════════════
