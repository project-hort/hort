# SonarQube / SonarCloud analysis configuration for Hort.
#
# TWO Sonar targets read this file, and it is the single definition of the
# analysis SEMANTICS they must agree on — source layout, the test/production
# split, exclusions, and the issue-ignore rules:
#
#   - the in-cluster SonarQube Community, scanned by `.gitlab-ci.yml`'s
#     `quality:sonar`;
#   - SonarQube Cloud, scanned by `.github/workflows/ci.yml`'s
#     `sonarqube-cloud` job.
#
# Those semantics are exactly what must not drift between the two, which is
# the whole reason this file exists. Two things are therefore NOT here, and
# each job passes them at invocation instead:
#
#   - Target identity and credentials: `sonar.host.url`, `sonar.token`,
#     `sonar.projectKey`, `sonar.organization`.
#   - The coverage and clippy REPORT PATHS
#     (`sonar.rust.lcov.reportPaths`, `sonar.coverageReportPaths`,
#     `sonar.rust.clippyReport.reportPaths`). These are plumbing of one
#     target rather than shared semantics: two of the three name a file that
#     only the GitLab pipeline builds, so a value here would be a path the
#     other target cannot resolve. All three move together rather than
#     splitting one category across two places — each job passes the paths
#     for the reports its own pipeline actually built.
#
# `sonar-scanner` auto-reads this file from the repo root; CLI `-D` flags
# override it, so those per-target args win as intended.
#
# The quality-gate thresholds (coverage and duplication on new code) are the
# Sonar project's own server-side gate, not set here — and the two targets'
# gates are configured independently of each other.

# Wait for the server-side quality-gate computation and fail the scanner
# step on a red gate. That verdict BLOCKS on both targets: quality:sonar
# carries no allow_failure, so a red gate fails the GitLab branch pipeline,
# and the GitHub `sonarqube-cloud` job fails its own check the same way.
# `quality:sonar-findings` (allow_failure + when: always) is the GitLab job
# that names what to fix; on the GitHub side the SonarQube Cloud project
# page is where the failing conditions are read.
sonar.qualitygate.wait=true

# --- Source layout (Rust workspace under crates/) --------------------------
#
# The test/production split is BY FILE, which is all Sonar offers. Hort keeps
# most of its unit tests in inline `#[cfg(test)]` modules inside production
# sources, and those modules are analysed as production code — the split
# reaches the test files under `tests/` and the `*test*.rs` / `*tests*.rs`
# names, and nothing finer. A finding inside an inline test module is
# therefore a production finding here; that is a limitation of the split, not
# a verdict about the code.
sonar.sources=crates
sonar.tests=crates
sonar.test.inclusions=**/*test*.rs,**/*tests*.rs,**/tests/**/*.rs

# --- Duplication measurement -----------------------------------------------
#
# Exempt from the duplication measurement: the test files, exactly as the
# split above defines them. The value is the `sonar.test.inclusions` list
# verbatim — same globs, same order, no divergence — so "counts as a test"
# and "is exempt from duplication" are one set by construction, and neither
# can drift from the other without this pair of lines visibly disagreeing.
# (`**/*tests*.rs` is already subsumed by `**/*test*.rs`; it stays anyway,
# because being a copy of the line above is the whole point of the value.)
#
# Why: repetition is normal and frequently correct in test code — a table
# test over seven cases, four near-identical fixtures, the same arrange
# block in neighbouring tests. The gate scores duplication on NEW CODE and
# blocks on it (see `sonar.qualitygate.wait` above), so without this a
# change that honestly grows its coverage can red the pipeline on a
# property that says nothing about the quality of that change.
#
# This exempts ONE MEASUREMENT and nothing else. The property is scoped to
# `cpd` by name, so whatever bug, vulnerability, code-smell and secrets
# rules run on these files today keep running on them unchanged; the one
# deliberate narrowing of those on test files is the explicit `secrets:*`
# ignore block at the bottom of this file, and this line neither widens nor
# duplicates it.
#
# What it does NOT reach: inline `#[cfg(test)]` modules, where most of
# hort's unit tests live (see the split above). Sonar measures per file, so
# no path glob can exempt a module inside `src/foo.rs`, and a glob naming
# that file would exempt the production code around it too. Duplication
# between inline test modules is therefore still measured, and still
# measured as production duplication. That half stays open — this property
# does not promise it.
sonar.cpd.exclusions=**/*test*.rs,**/*tests*.rs,**/tests/**/*.rs

# Non-source trees excluded from analysis entirely.
sonar.exclusions=target/**,docker/**,scripts/**,site/**,docs/**,.sqlx/**

# Coverage: explicitly no coverage exclusions. The report paths themselves
# are per-target plumbing and are passed at invocation (see the header).
sonar.coverage.exclusions=

# Clippy findings are imported from a JSON report where the pipeline writes
# one, never re-run inside the scanner. clippy.enabled=false is load-bearing
# for BOTH targets: without it the Rust analyzer invokes `cargo clippy`
# itself inside the scanner image, where there is no cargo, and fails. That
# holds whether or not a report is available to import, so it belongs here
# while the report path does not.
sonar.rust.clippy.enabled=false

# --- Issue-ignore: test-only private keys ----------------------------------
# Hort's test suite carries hardcoded test-only signing material (JWT/OIDC
# and token-exchange sign-then-verify roundtrips). These are NOT production
# secrets — they are fixtures, already allowlisted for GitGuardian
# (`.gitguardian.yaml`). Suppress the Sonar `secrets` analyzer on exactly the
# files that carry them, scoped to the secrets repo only (bug / vulnerability
# / code-smell rules stay active on these files).
#
# `secrets:*` matches every rule in the secrets analyzer. If your Sonar
# version does not honor the repo wildcard, replace it with the exact rule
# key shown on the finding ("Why is this an issue" -> secrets:Sxxxx).
#
# NOTE: 5 of the 6 entries below are #[cfg(test)] modules embedded in SOURCE
# files (not test-PATHS), so they must be listed individually. This list
# grows whenever a new test key lands in a src module — prefer generating
# test keys on the fly (no hardcoded material at all), which makes this whole
# block unnecessary. See the test-key-hygiene follow-up.
sonar.issue.ignore.multicriteria=tk_testdirs,tk_oidc_lib,tk_oidc_multi,tk_exchange,tk_apitokens,tk_extraca

# (a) Integration-test files under tests/ (init52 token-exchange / CLI-session).
sonar.issue.ignore.multicriteria.tk_testdirs.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.tk_testdirs.resourceKey=**/tests/**/*.rs

# (b) #[cfg(test)] signing material embedded in source files (enumerated —
#     these are not test-paths, so a path glob would miss them).
sonar.issue.ignore.multicriteria.tk_oidc_lib.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.tk_oidc_lib.resourceKey=**/hort-adapters-oidc/src/lib.rs
sonar.issue.ignore.multicriteria.tk_oidc_multi.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.tk_oidc_multi.resourceKey=**/hort-adapters-oidc/src/multi_issuer.rs
sonar.issue.ignore.multicriteria.tk_exchange.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.tk_exchange.resourceKey=**/hort-http-core/src/handlers/exchange.rs
sonar.issue.ignore.multicriteria.tk_apitokens.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.tk_apitokens.resourceKey=**/hort-http-core/src/handlers/api_tokens.rs
sonar.issue.ignore.multicriteria.tk_extraca.ruleKey=secrets:*
sonar.issue.ignore.multicriteria.tk_extraca.resourceKey=**/hort-config/src/extra_ca.rs
