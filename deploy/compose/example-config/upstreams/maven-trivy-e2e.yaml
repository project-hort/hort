# UpstreamMapping for maven-trivy-e2e — the runtime upstream a Maven
# pull-through fetch actually reads (the ArtifactRepository's spec.proxy
# block is validator-only; see maven-central-e2e.yaml's own note on this).
# Empty pathPrefix → catch-all single-upstream mapping, matching Maven's
# registry-wide-upstream-per-repo shape (no path-prefix routing).
apiVersion: project-hort.de/v1
kind: UpstreamMapping
metadata:
  name: maven-trivy-e2e
spec:
  repository: maven-trivy-e2e
  pathPrefix: ""
  upstreamUrl: https://repo1.maven.org/maven2
  auth:
    type: anonymous
