# PermissionGrant: serviceAccount provenance-ci -> write oci-provenance-e2e
# (native-token-mode skopeo push + cosign sign in
# scenarios/quarantine/provenance-push-then-sign.sh). The write grant is also
# what the quarantine hold-read exemption's granted-authority predicate
# (ADR 0039 §10) evaluates when the SA's pull-scoped capability JWT reads the
# held subject manifest. Resolves at apply to the SA's backing user
# (GrantSubject::User, ADR 0037).
apiVersion: project-hort.de/v1beta1
kind: PermissionGrant
metadata:
  name: provenance-ci-write
spec:
  subject:
    kind: serviceAccount
    name: provenance-ci
  permission: write
  repository: oci-provenance-e2e
