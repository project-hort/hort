# PermissionGrant: serviceAccount oci-quarantine-e2e-ci -> write
# oci-quarantine-e2e (native-token-mode skopeo push + re-push in
# scripts/native-tests/scenarios/clients/oci-push-under-quarantine.sh). Also
# what the quarantine hold-read exemption's granted-authority predicate
# (ADR 0039 §10) evaluates for the dedup-HEAD leg. Resolves at apply to the
# SA's backing user (GrantSubject::User, ADR 0037).
apiVersion: project-hort.de/v1
kind: PermissionGrant
metadata:
  name: oci-quarantine-e2e-ci-write
spec:
  subject:
    kind: serviceAccount
    name: oci-quarantine-e2e-ci
  permission: write
  repository: oci-quarantine-e2e
