# ScanPolicy for oci-trivy-composite-e2e — the enforcing posture, and
# not a copy of oci-trivy-e2e-scan.yaml's:
#
#   - `enforcement: reject` makes this a repository whose verdicts
#     actually gate. Under `record` nothing gates, so a scenario run
#     there cannot distinguish "the layer's absent assessment moved to
#     the composition" from "no verdict was gating anything anyway".
#   - `scanBackends: ["trivy"]` is required rather than incidental: a
#     waived scan returns before a composition is ever resolved, so
#     there would be no composed verdict for the scenario to observe.
#
# The composition's verdict gates the image unconditionally (ADR 0064
# D1/D2) — there is no field to set for it, and a document that still
# names the retired `compositeVerdictMode` is refused at apply.
#
# `quarantineDuration: 20s` keeps a genuine observation window (the
# release waits on the window, not on a verdict) while staying inside a
# scenario's patience.
apiVersion: project-hort.de/v1
kind: ScanPolicy
metadata:
  name: oci-trivy-composite-e2e-scan
spec:
  scope:
    repository: oci-trivy-composite-e2e
  severityThreshold: high
  quarantineDuration: 20s
  requireApproval: false
  provenanceMode: off
  scanBackends: ["trivy"]
  enforcement: reject
  licensePolicy: {}
