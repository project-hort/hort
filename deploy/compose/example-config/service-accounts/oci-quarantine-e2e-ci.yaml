# ServiceAccount (e2e): the native-token-mode pusher/puller for
# scripts/native-tests/scenarios/clients/oci-push-under-quarantine.sh.
#
# PAT-only SA (no federatedIdentities / fallbackRotation): under the
# native-tokens compose overlay the scenario admin-mints an hort_svc_* token
# for this SA and uses it as the skopeo `--dest-creds`/`--src-creds` for the
# initial push, the dedup re-push (skopeo's per-blob existence HEAD is gated
# the same as any other blob read, so it needs the read leg below, not just
# write), and the must-fail pull of the still-held content. A native
# credential is required because the `/v2/auth` mint validates the Basic
# password strictly as a PAT: dev-user's claims-based Keycloak JWT can never
# complete it (mirrors the provenance-ci SA's rationale). Authority is the
# sibling serviceAccount-subject PermissionGrants in
# auth/oci-quarantine-e2e-ci-{read,write}.yaml. Inert in legacy (no-overlay)
# runs: the SA row exists, nothing mints for it — the scenario's legacy-mode
# branch keeps using dev-user's OIDC token instead.
apiVersion: project-hort.de/v1
kind: ServiceAccount
metadata:
  name: oci-quarantine-e2e-ci
spec: {}
