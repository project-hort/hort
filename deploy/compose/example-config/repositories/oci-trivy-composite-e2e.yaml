# Hosted OCI repo under a Trivy ScanPolicy that both ENFORCES
# (`enforcement: reject`) and PROMOTES the composed-image verdict
# (`compositeVerdictMode: promoted`). Used by
# scripts/native-tests/scenarios/quarantine/trivy-oci-constituent-abstention.sh .
#
# Distinct from oci-trivy-e2e, its nearest sibling, on the one axis that
# matters: oci-trivy-e2e is `enforcement: record` + the default
# `compositeVerdictMode: observed`, deliberately, so its release
# assertions never depend on which CVEs the base image carries. Under
# that posture no verdict gates and no constituent's assessment can
# belong to a composition, so the posture ADR 0064 D2's loosening is
# scoped to — a promoted composite verdict over a gating repository —
# cannot be reached from it at all. Hence a second fixture rather than a
# second leg.
#
# `isPublic: true` so the post-release leg can assert an ANONYMOUS layer
# blob fetch succeeds: an authenticated fetch could not tell a released
# row from the write-authorized hold-read exemption.
apiVersion: project-hort.de/v1
kind: ArtifactRepository
metadata:
  name: oci-trivy-composite-e2e
spec:
  name: "OCI Trivy Composite-Verdict E2E"
  description: "Hosted OCI repo under an enforcing Trivy ScanPolicy with the composed-image verdict promoted; used to confirm a layer whose materialised tree no analyzer claimed releases and serves, because that absence of assessment belongs to the composition. requires: egress."
  format: oci
  type: hosted
  storage:
    backend: filesystem
  isPublic: true
  replicationPriority: local_only
