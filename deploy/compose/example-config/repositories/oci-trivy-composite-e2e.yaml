# Hosted OCI repo under a Trivy ScanPolicy that ENFORCES
# (`enforcement: reject`). Used by
# scripts/native-tests/scenarios/quarantine/trivy-oci-constituent-abstention.sh .
#
# Distinct from oci-trivy-e2e, its nearest sibling, on the one axis that
# matters: oci-trivy-e2e is `enforcement: record`, deliberately, so its
# release assertions never depend on which CVEs the base image carries.
# Under that posture no verdict gates at all, so what this scenario
# asserts — that a constituent whose absent assessment belongs to its
# composition still releases and serves — cannot be distinguished there
# from nothing gating anything. Hence a second fixture rather than a
# second leg.
#
# `isPublic: true` so the post-release leg can assert an ANONYMOUS layer
# blob fetch succeeds: an authenticated fetch could not tell a released
# row from the write-authorized hold-read exemption.
apiVersion: project-hort.de/v1
kind: ArtifactRepository
metadata:
  name: oci-trivy-composite-e2e
spec:
  name: "OCI Trivy Composite-Verdict E2E"
  description: "Hosted OCI repo under an enforcing Trivy ScanPolicy; used to confirm a layer whose materialised tree no analyzer claimed releases and serves, because that absence of assessment belongs to the composition. requires: egress."
  format: oci
  type: hosted
  storage:
    backend: filesystem
  isPublic: true
  replicationPriority: local_only
