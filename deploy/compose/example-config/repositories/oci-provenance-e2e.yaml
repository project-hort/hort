apiVersion: project-hort.de/v1beta1
kind: ArtifactRepository
metadata:
  name: oci-provenance-e2e
spec:
  name: "OCI Provenance E2E"
  description: "Hosted OCI repo under a provenanceMode=required + provenanceBackends=[cosign-key] ScanPolicy; used by scripts/native-tests/scenarios/quarantine/provenance-push-then-sign.sh to drive the keyed cosign hold-until-signed round-trip (ADR 0039, issues #13/#14)."
  format: oci
  type: hosted
  storage:
    backend: filesystem
    path: /var/lib/hort-server/cas/oci-provenance-e2e
  isPublic: true
  replicationPriority: local_only
