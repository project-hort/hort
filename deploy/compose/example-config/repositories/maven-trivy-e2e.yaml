# Private Maven Central pull-through used by
# scripts/native-tests/scenarios/quarantine/trivy-jar-finding.sh . Distinct from maven-central-e2e: that repository is
# public with quarantineDuration: 0s (SHA-1-floor smoke, no scanning
# posture); this one is private + scanned, mirroring crates-proxy's
# private-quarantined-proxy shape so the Trivy scan actually runs on
# something with a real (short) observation window instead of a
# skip-quarantine posture that would race the async scan.
#
# `indexMode: include_pending` is load-bearing (same reason as
# maven-central-e2e / crates-proxy): the default `released_only` serves an
# empty index on a cold mirror, so a never-ingested coordinate cannot be
# resolved and the pull-through never starts.
apiVersion: project-hort.de/v1
kind: ArtifactRepository
metadata:
  name: maven-trivy-e2e
spec:
  name: "Maven Central pull-through (Trivy scan e2e)"
  description: "Private, quarantined+scanned Maven Central proxy used to confirm a Trivy finding materialises for a known-vulnerable JAR. requires: egress."
  format: maven
  type: proxy
  indexMode: include_pending
  storage:
    backend: filesystem
    path: /var/lib/hort-server/cas/maven-trivy-e2e
  proxy:
    upstreamUrl: "https://repo1.maven.org/maven2"
  isPublic: false
  replicationPriority: local_only
