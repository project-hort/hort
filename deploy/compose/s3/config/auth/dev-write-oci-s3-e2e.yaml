# PermissionGrant: [developer, ci-pusher] -> write oci-s3-e2e
# Mirrors example-config/auth/dev-write-oci-e2e.yaml — dev-user pushes the
# large blob (scripts/native-tests/scenarios/storage/s3-multipart-blob.sh).
apiVersion: project-hort.de/v1beta1
kind: PermissionGrant
metadata:
  name: dev-write-oci-s3-e2e
spec:
  subject:
    kind: claims
    required: [developer, ci-pusher]
  permission: write
  repository: oci-s3-e2e
