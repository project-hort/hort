# Mirrors example-config/policies/oci-e2e-permissive.yaml — the s3-overlay
# multipart scenario pushes a blob and immediately pulls it back
# (scripts/native-tests/scenarios/storage/s3-multipart-blob.sh); the only
# mechanism that would block the immediate pull is the quarantine 503
# (Retry-After), so quarantine-by-default is opted out for this repo.
apiVersion: project-hort.de/v1beta1
kind: ScanPolicy
metadata:
  name: oci-s3-e2e-permissive
spec:
  scope:
    repository: oci-s3-e2e
  severityThreshold: critical
  quarantineDuration: 0s
  requireApproval: false
  provenanceMode: off
  # `enforcement: record` — a Trivy verdict is recorded, never gating, the
  # posture every other OCI e2e fixture carries. What a fixture asserts must
  # not depend on a scanner verdict over its content, only on whether each
  # row got a completed assessment at all. Omitting the field is the opposite
  # posture, not a quieter one: it inherits the enforcing default, and this
  # policy scans.
  #
  # The exposure here is the smallest of the family — the blob is generated
  # random bytes rather than an upstream tag, and a layer blob is a
  # composition constituent, so a filesystem claim cannot condemn it either
  # way. The posture is still the right one: a fixture should not carry a
  # verdict dependency it has no use for.
  enforcement: record
  licensePolicy: {}
