# Test fixture: blanket scheduledTasks.rotateSvcToken with a multi-entry
# scheduledTasks.svcTokens list.
#
# Usage:
#   helm template deploy/helm/hort-server/ -f deploy/helm/hort-server/test-values-svc-tokens-rotate-global.yaml
#
# Exercises: the global switch reaches EVERY entry's init container as
# `--rotate`, even though neither entry sets its own `rotate` field.
# Positive counterpart to test-values-svc-tokens-rotate-entry.yaml,
# where only the flagged entry rotates.
#
# This file is strictly for local helm lint/template smoke tests — it
# is not a production values file.

scheduledTasks:
  adminTasksEnabled: true
  rotateSvcToken: true
  svcTokens:
    - name: cronjob-tasks
      permissions:
        - admin_task_invoke
    - name: uat-smoke
      permissions:
        - admin_task_invoke

# Minimal required values to pass helm lint (schema validation).
publicBaseUrl: "https://example.com"
postgres:
  app:
    existingSecret: "hort-app-db-secret"
    secretKey: DATABASE_URL
  admin:
    existingSecret: "hort-admin-db-secret"
    secretKey: DATABASE_URL
auth:
  provider: "oidc"
  oidc:
    issuerUrl: "https://idp.example.com"
    audience: "hort-server"
    groupsClaim: "groups"
    jwksCacheTtlSeconds: 600
storage:
  backend: filesystem
secrets:
  fileRoot: "/var/run/secrets/hort-server"
