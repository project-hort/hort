# Test fixture: per-entry scheduledTasks.svcTokens[].authorityRepository.
#
# Usage:
#   helm template deploy/helm/hort-server/ -f deploy/helm/hort-server/test-values-svc-tokens-authority-repository.yaml
#
# Exercises the case backlog/183 exists for: the SECOND entry needs a
# GLOBAL (unscoped) cap — no `repository:` — while its `--require-authority`
# preflight is aimed at a single repository via `authorityRepository`. That
# renders `--require-authority=maven-proxy` with NO accompanying
# `--repository` flag on that entry's init container — proving the two
# flags are independent, not welded together. The FIRST entry sets neither
# field, so it renders the bare `--require-authority` — the byte-compatible
# default. Negative/positive pair in one fixture, mirroring
# test-values-svc-tokens-repository.yaml's shape. The default single-entry
# render is separately pinned byte-identical by the `golden_checks`
# bootstrap-Job fixture — this file only exercises the flag threading, not
# the golden bytes.
#
# This file is strictly for local helm lint/template smoke tests — it is
# not a production values file.

scheduledTasks:
  adminTasksEnabled: true
  svcTokens:
    - name: cronjob-tasks
      permissions:
        - admin_task_invoke
    - name: uat-smoke
      permissions:
        - read
        - prefetch
      authorityRepository: maven-proxy

# Minimal required values to pass helm lint (schema validation).
publicBaseUrl: "https://example.com"
postgres:
  app:
    existingSecret: "hort-app-db-secret"
    secretKey: DATABASE_URL
  admin:
    existingSecret: "hort-admin-db-secret"
    secretKey: DATABASE_URL
auth:
  provider: "oidc"
  oidc:
    issuerUrl: "https://idp.example.com"
    audience: "hort-server"
    groupsClaim: "groups"
    jwksCacheTtlSeconds: 600
storage:
  backend: filesystem
secrets:
  fileRoot: "/var/run/secrets/hort-server"
