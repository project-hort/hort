{{/*
Additive, Job-scoped NetworkPolicy.

WHY THIS EXISTS
  The app-pod NetworkPolicy (`networkpolicy.yaml`) renders by default
  with an EMPTY operator-supplied `egress` list. Stock Kubernetes treats
  `policyTypes: [Egress]` + zero egress rules as DENY-ALL egress. Its
  `podSelector` matches `hort-server.selectorLabels` — and EVERY
  Job/CronJob pod template in this chart ALSO carries
  `hort-server.selectorLabels` (plus its own `hort-server.io/job: <name>`
  discriminator). So the deny-all also catches the pre-install `migrate`
  Helm hook Job, which must reach Postgres before the app is ever created
  → `helm install` aborts at the pre-install hook. The app-pod posture is
  deliberately secure-by-default and is NOT weakened here: "default the
  policy off" was explicitly rejected.
  Instead this is an ADDITIVE policy.

  Kubernetes NetworkPolicies are purely additive (the effective allow
  set for a pod is the UNION of every policy selecting it). This policy
  introduces NO new restriction on any pod; it only ADDS an egress
  allowance to this release's Job/CronJob pods. The app-pod policy in
  `networkpolicy.yaml` is left byte-identical.

SELECTOR — two clauses, both load-bearing
  The `podSelector` ANDs `matchLabels: hort-server.selectorLabels` with
  `matchExpressions: hort-server.io/job Exists`, so it selects exactly
  THIS RELEASE's Job/CronJob pods: a pod must carry this release's
  `app.kubernetes.io/{name,instance}` AND an `hort-server.io/job` key.
  Every cronjob-*.yaml + job-migrate.yaml + svc-token-bootstrap-job.yaml
  + prepull-*.yaml + tests/test-connection.yaml pod template sets both
  (`job-migrate.yaml`'s pod-template labels are the pattern), so no
  pod that needs the allowance loses it.

  Neither clause may be dropped:
  - WITHOUT the release scope, the only thing between any pod in the
    namespace and this allowance is one label of its own choosing. A
    principal who may create or label a Pod but may NOT touch
    NetworkPolicies would take the allowance by writing
    `hort-server.io/job: anything`, and in a namespace whose own policy
    denies egress would reach the destinations that policy meant to
    block; patching the label onto an existing restricted pod does the
    same. The scope also keeps two releases of this chart in one
    namespace from granting each other's Job pods egress.
  - WITHOUT the `Exists` clause this would be the app pods' own
    selector: the app Deployment pods carry the same
    `hort-server.selectorLabels` and are kept out only by not carrying
    an `hort-server.io/job` key (they carry
    `app.kubernetes.io/component: server` instead). The app-pod deny-all
    is untouched.

  WHAT THE SELECTOR CANNOT DO — the accepted limit
  A NetworkPolicy selects on pod labels and namespaces, and that is the
  whole of what the Kubernetes API gives it: no ServiceAccount, no owner
  reference, no "Helm created this pod". So the release scope above
  raises the bar from one freely-settable label to three freely-settable
  labels — it is a SCOPE, not a credential. A principal who may create
  or label a Pod in this namespace can wear all three. Nothing
  expressible in a NetworkPolicy closes that, and this template does not
  pretend otherwise: a principal holding create-Pod in the release's
  namespace is not an attacker a NetworkPolicy defends against, and
  keeping Pod creation off untrusted principals is the cluster RBAC's
  boundary, not this policy's. Network position never substitutes for
  authorization.
  What the chart CAN bound is how much a selected pod gets — see EGRESS
  SHAPE below and `networkPolicy.jobEgress`. Narrowing the destinations
  does not make the selector unforgeable; it bounds what a pod wearing
  the labels receives. Both halves are stated for OPERATORS in
  `values.yaml` at the `jobEgress` key and in the chart README, because a
  template comment is not where an operator reads; keep those two in step
  with this one.

EGRESS SHAPE — why unrestricted egress + explicit DNS by default, not an ipBlock
  The DB endpoint is inside the operator-supplied opaque Secret DSN
  (`postgres://…@host:5432/db` in `postgres.{admin,app}.existingSecret`)
  — the chart never sees the host/port/CIDR. This is the SAME reason
  The app NetworkPolicy ships the `egress` list empty ("the chart does
  not guess your cluster's CIDRs", values.yaml). Inventing a CIDR here
  would be a guess; the chart deliberately keeps CIDR auto-discovery
  out of scope. The deterministic fact is that these
  Jobs need outbound network at all. The standard, no-guess bootstrap-
  Job carve-out is therefore: allow DNS resolution (UDP+TCP 53) and
  otherwise-unrestricted egress, SCOPED to this release's Job pods only.
  The migrate Job by design opens exactly one outbound TCP connection
  (to Postgres via HORT_DATABASE_URL — see job-migrate.yaml) and makes no
  Kubernetes API calls; the svc-token-bootstrap Job additionally needs
  the kube-apiserver (kubectl apply of the token Secret). Both are
  covered by the un-narrowed `to: []` egress rule below without the
  chart guessing any address.

  An operator who DOES know their destinations narrows the allowance
  with `networkPolicy.jobEgress`: a defaulted-empty list of NetworkPolicy
  egress rules that REPLACES the unrestricted rule below. Three
  properties make that safe to ship into existing installs:
  - EMPTY is the shipped default and renders the unrestricted rule, so an
    upgrade changes no allow rule. A chart that stopped letting the
    `migrate` hook through on upgrade would be worse than the width it
    was closing.
  - The list can only NARROW. The default already allows every
    destination on every port, so any union of operator rules is a
    subset of it — there is no value of `jobEgress` whose effect is wider
    than the default. (Contrast `worker.metrics.scrapeFrom`, where an
    empty list means ALL sources and the schema therefore has to reject
    it: that fail-open direction does not exist here.)
  - DNS stays chart-owned and unconditional, outside what `jobEgress`
    replaces: a destination list that forgot it would break every
    hostname DSN.
  The failure mode is loud, not silent: a list the migrate Job cannot
  reach Postgres through aborts `helm install` at the pre-install hook.

  Two things that do NOT work, and were once recommended here: a second,
  tighter NetworkPolicy (by the additivity rule above the effective allow
  set is the UNION of every policy selecting the pod, so another policy
  can only ADD — nothing can subtract an allow rule, which is why
  `jobEgress` has to replace THIS rule rather than ship as a companion
  policy); and the app `egress` posture, which never reaches these pods
  at all (it selects the app pods, which the `Exists` clause excludes).
  Editing this rule is safe to reason about precisely because its scope
  is this release's Job pods: it does not reach a neighbouring release or
  any unrelated pod in the namespace.

PER-PRE-APP-HOOK-JOB VERDICT (audit table)
  | Template                       | Kind | Helm hook / trigger          | Needs net before app readiness?              | Disposition |
  |--------------------------------|------|------------------------------|----------------------------------------------|-------------|
  | prepull-daemonset.yaml, prepull-worker-daemonset.yaml | DaemonSet | pre-install,pre-upgrade (-10) | NO — image pulls run via the node's container runtime, outside the pod network namespace entirely; the `pause` placeholder container needs nothing once running | not pre-app in the network sense (no egress needed at all); carries `hort-server.io/job` anyway for consistency with every other Job/CronJob/DaemonSet pod template, so it lands in this policy's allowance at zero cost |
  | prepull-job.yaml               | Job  | pre-install,pre-upgrade (-9) | YES — `kubectl rollout status`/`delete` against the kube-apiserver, before the Deployment exists | CARVE-OUT (same scoped allowance; covered by this policy's release-scoped `hort-server.io/job` selector) |
  | job-migrate.yaml               | Job  | pre-install,pre-upgrade (-5) | YES — Postgres before the Deployment exists   | CARVE-OUT (this policy fixes it) |
  | svc-token-bootstrap-job.yaml   | Job  | post-install,post-upgrade(5) | YES — init-ctr → Postgres (admin DSN); main-ctr → kube-apiserver (kubectl). Runs while the deny-all is active. | CARVE-OUT (same scoped allowance; covered by this policy's release-scoped `hort-server.io/job` selector) |
  | cronjob-noop.yaml              | CronJob | schedule (scheduledTasks.adminTasksEnabled, default OFF) | NO — scheduled, never on the install critical path; not a pre-app hook | not pre-app; covered defensively by the same selector (cheap, correct, identical deny-all problem) |
  | cronjob-staging-sweep.yaml     | CronJob | schedule                  | NO — scheduled task, post-readiness            | not pre-app; covered defensively |
  | cronjob-scrub.yaml             | CronJob | schedule (scrub.enabled)  | NO — scheduled CAS scrub, post-readiness       | not pre-app; covered defensively |
  | cronjob-cron-rescan-tick.yaml  | CronJob | schedule                  | NO — scheduled rescan tick, post-readiness     | not pre-app; covered defensively |
  | cronjob-advisory-watch-tick.yaml | CronJob | schedule                | NO — scheduled advisory watch, post-readiness  | not pre-app; covered defensively |
  | cronjob-eventstore-checkpoint.yaml | CronJob | schedule              | NO — scheduled checkpoint, post-readiness      | not pre-app; covered defensively |
  | cronjob-eventstore-archive.yaml | CronJob | schedule                 | NO — scheduled archive, post-readiness         | not pre-app; covered defensively |
  | cronjob-replay-seen-prune.yaml | CronJob | schedule                  | NO — scheduled prune, post-readiness           | not pre-app; covered defensively |
  | cronjob-retention-evaluate.yaml | CronJob | schedule                 | NO — scheduled retention eval, post-readiness  | not pre-app; covered defensively |
  | cronjob-retention-purge.yaml   | CronJob | schedule                  | NO — scheduled retention purge, post-readiness | not pre-app; covered defensively |
  | cronjob-service-account-rotation.yaml | CronJob | schedule           | NO — scheduled SA rotation, post-readiness     | not pre-app; covered defensively |
  Verdict summary: ONLY job-migrate is a true pre-app (pre-Deployment)
  hook that bricks `helm install`. svc-token-bootstrap is a post-app
  hook that still needs net while the deny-all is active. The CronJobs
  are scheduled tasks (default-disabled), never on the install critical
  path — but they share the identical deny-all problem, so the single
  release-scoped `hort-server.io/job Exists` selector covers them too at
  zero extra cost and with no posture change to the app pods.

  Every pod template in that table shares ONE allowance, so a
  `jobEgress` list has to cover the union of what they reach: Postgres
  for migrate and the svc-token-bootstrap init container, the
  kube-apiserver for prepull-job and the svc-token-bootstrap main
  container, plus whatever the CronJobs the install enables reach (S3 /
  OIDC / upstream registries for the dsn-direct ones).

ESCAPE HATCH PARITY
  Gated on the SAME `.Values.networkPolicy.enabled` as the app-pod
  policy. `networkPolicy.enabled: false` disables BOTH: no app-pod
  policy, no Job-scoped policy, stock cluster default applies to
  everything. `jobEgress` lives inside that gate — it narrows this
  policy, it never renders one.
*/}}
{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hort-server.fullname" . }}-job-bootstrap-egress
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
spec:
  # Selects exactly THIS RELEASE's Job/CronJob pods. The two clauses AND
  # together: a pod must carry this release's name/instance labels AND an
  # `hort-server.io/job` key. Dropping the first would hand this egress
  # allowance to any pod in the namespace willing to set one label of its
  # own; dropping the second would hand it to the app pods, which carry
  # the same name/instance labels. The three labels are a scope, not a
  # credential — a principal who may create or label a Pod here can wear
  # them, and no NetworkPolicy can prevent that. See SELECTOR above.
  podSelector:
    matchLabels:
      {{- include "hort-server.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: hort-server.io/job
        operator: Exists
  policyTypes:
    - Egress
  egress:
    # DNS — Postgres/S3/OIDC/registry hostnames in the operator DSNs and
    # config must resolve before any TCP connection. UDP is the default
    # resolver transport; TCP 53 covers truncated/large responses and
    # resolvers configured TCP-only. Chart-owned and unconditional:
    # `networkPolicy.jobEgress` replaces the bootstrap rule below, never
    # this one — a destination list that forgot DNS would break every
    # hostname DSN.
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    {{- with .Values.networkPolicy.jobEgress }}
    # Bootstrap egress, narrowed to the operator's `networkPolicy.jobEgress`
    # entries, which REPLACE the chart's unrestricted rule: this release's
    # Job pods reach these destinations and DNS, and nothing else. The
    # pre-install `migrate` hook is on this path, so a list it cannot
    # reach Postgres through aborts `helm install` at that hook.
    {{- toYaml . | nindent 4 }}
    {{- else }}
    # Bootstrap egress. Unrestricted `to:` because the destination (the
    # Postgres host in the opaque Secret DSN, and — for the
    # svc-token-bootstrap Job — the kube-apiserver) is not known to the
    # chart and MUST NOT be guessed (the chart deliberately keeps
    # CIDR auto-discovery out of scope). This is an ADDITIVE allowance
    # on this release's Job pods only; the app-pod deny-all is
    # unchanged. An operator who knows their destinations narrows THIS
    # rule by setting `networkPolicy.jobEgress`, which replaces it; a
    # second, tighter NetworkPolicy cannot subtract an allow rule — see
    # the additivity note at the top of this file.
    - {}
    {{- end }}
{{- end -}}
