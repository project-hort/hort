{{- if or (gt (int .Values.replicaCount) 1) .Values.podDisruptionBudget.enabled -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hort-server.fullname" . }}
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "hort-server.selectorLabels" . | nindent 6 }}
      # This PDB is server-only (gated on replicaCount / this toggle,
      # not on the worker's replica count); without this discriminator
      # it would also match the worker pods, which have no PDB of their
      # own and are governed by a different eviction budget entirely.
      app.kubernetes.io/component: server
{{- end -}}
