{{- if .Values.metrics.serviceMonitor.enabled -}}
{{- if not .Values.metrics.bindAddr -}}
{{- fail "metrics.serviceMonitor.enabled=true requires metrics.bindAddr to be set (the ServiceMonitor scrapes the dedicated metrics Service port; with bindAddr empty, no admin listener binds and /metrics is not exposed anywhere)." -}}
{{- end -}}
{{- if not .Values.tlsSidecar.enabled -}}
{{- fail "metrics.serviceMonitor.enabled=true requires tlsSidecar.enabled for a verified HTTPS scrape" -}}
{{- end -}}
{{- if not (and .Values.metrics.serviceMonitor.caSecretName .Values.metrics.serviceMonitor.caSecretKey .Values.metrics.serviceMonitor.serverName .Values.metrics.serviceMonitor.bearerSecretName .Values.metrics.serviceMonitor.bearerSecretKey) -}}
{{- fail "metrics.serviceMonitor.enabled=true requires caSecretName, caSecretKey, serverName, bearerSecretName and bearerSecretKey: with the sidecar enabled the Service's metrics port serves TLS, so these supply the scrape's CA, verified serverName and read_metrics bearer" -}}
{{- end -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hort-server.fullname" . }}
  {{- with .Values.metrics.serviceMonitor.namespace }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hort-server.selectorLabels" . | nindent 6 }}
  {{- if .Values.metrics.serviceMonitor.namespace }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  {{- end }}
  endpoints:
    - port: metrics
      scheme: https
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      path: /metrics
      tlsConfig:
        ca:
          secret:
            name: {{ .Values.metrics.serviceMonitor.caSecretName | quote }}
            key: {{ .Values.metrics.serviceMonitor.caSecretKey | quote }}
        serverName: {{ .Values.metrics.serviceMonitor.serverName | quote }}
      bearerTokenSecret:
        name: {{ .Values.metrics.serviceMonitor.bearerSecretName | quote }}
        key: {{ .Values.metrics.serviceMonitor.bearerSecretKey | quote }}
{{- end -}}
