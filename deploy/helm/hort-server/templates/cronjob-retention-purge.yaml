{{/*
Retention-purge CronJob.

Periodically invokes `hort-cli admin task invoke retention-purge`. The
handler runs the destructive storage-GC walk: for every byte-release work
item — an `ArtifactExpired` (a retention policy decided) or an
`ArtifactDeleted` (a caller deleted the artifact through the registry
API) — with no following `ArtifactPurged`, decrement
`content_references`, delete the CAS blob iff the cross-`kind` refcount
hit 0, append `ArtifactPurged` (RetentionScheduler actor). The use case
REFUSES to run until the worker's boot refcount-reconcile sweep has
converged — swept every repository and applied every repair with zero
failures (gate-false → the handler returns a retryable failure whose
reason lands in `jobs.last_error`; the next worker boot re-runs the
sweep and re-decides the gate). Diagnosing a refusal: the worker
restates a closed gate, with the reason, on its 60-second heartbeat, so
`kubectl logs` on the worker shows it without enabling the worker
`/metrics` listener (`hort_refcount_reconcile_gate_closed` is the gauge
for deployments that do scrape it). Default daily cadence, after
retention-evaluate.

This sweep is the ONLY path that reclaims the bytes of a deleted
artifact, so leaving it disabled (the default below) means a repository
that is only ever written to and deleted from — no retention policy
configured at all — never reclaims storage. The summary's
`user_deletes_visited` counts the delete-driven half of a run.

Schedule-overlap protection: `concurrencyPolicy: Forbid` (layer 1) +
the worker per-kind semaphore concurrency=1 (layer 2).

Idempotency-Key: `--idempotency-key-window=day` → `<UTC date>:retention-purge`.

Gated by `scheduledTasks.retentionPurge.enabled` (default false; this
is the most destructive retention task, so opt-in is required for
safety). The parent `scheduledTasks.adminTasksEnabled` must also be
true.

DESTRUCTIVE TASK: `retention-purge` is in DESTRUCTIVE_TASK_KINDS, so invoking it
requires `destroy_content` — the authority over artifact content — in
addition to `AdminTaskInvoke`. A machine identity MAY hold it: an artifact's
removal leaves a record behind by design (`ArtifactPurged` stays on the
stream), so scheduled storage reclamation is what the `cronjob-tasks`
svc-token exists for. Provisioning it is three steps, all required:

  1. Declare the grant in your gitops tree and apply it —
     `kind: PermissionGrant`, `subject: { kind: serviceAccount, name:
     cronjob-tasks }`, `permission: destroy_content`, no `repository:`
     (the gate asks at `repository = None`, so a repo-scoped destructive
     grant authorises nothing). See
     docs/architecture/how-to/deploy/enable-admin-task-cronjobs.md section 5.1.
  2. Add `destroy_content` to this release's
     `scheduledTasks.svcTokens[].permissions` for the `cronjob-tasks` entry.
     The bootstrap Job's `--require-authority` preflight then fails loud at
     install time if step 1 is missing, instead of leaving a token that 403s
     on every tick.
  3. ROTATE THE TOKEN. A svc-token's capability is frozen at mint
     (ADR 0012) and `cronjob-tasks` is PAT-only — no `fallbackRotation`, so
     nothing re-snapshots it on an interval. An existing token keeps its old
     cap and the bootstrap Job reports "already exists": the grant is live in
     the database, the evaluator sees it, and the mounted token still 403s.
     Set that entry's `rotate: true` for one upgrade, then back to false.
     `hort-cli auth status --output json` reads the frozen cap
     (`permissions`), which is the field to check — never the grant set.

**Being an admin does not confer `destroy_content`**: it is held only through
an explicit PermissionGrant, so an interactive admin is answered `403` until
one exists for their identity. To run this kind by hand instead:
`hort-cli admin task invoke retention-purge` as such an identity.

The authority is re-checked a second time when the worker runs the job,
against the live state of the user it was enqueued under: revoking either
grant (or deactivating the account) stops the jobs it has already queued,
which land as terminal `failed` rows naming the cause. The grant must be
reachable from the persisted identity — a `serviceAccount`- or
`User`-subject grant, or a claims grant on `admin` for an admin user;
a grant bound to any other claim passes the enqueue and is refused at
execution, because nothing persists an IdP-resolved claim set. See
docs/architecture/how-to/deploy/enable-admin-task-cronjobs.md section 5.
*/}}
{{- if and .Values.scheduledTasks.adminTasksEnabled .Values.scheduledTasks.retentionPurge.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hort-server.fullname" . }}-retention-purge
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
    hort-server.io/job: retention-purge
spec:
  schedule: {{ .Values.scheduledTasks.retentionPurge.schedule | quote }}
  timeZone: {{ .Values.scheduledTasks.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "hort-server.selectorLabels" . | nindent 12 }}
            hort-server.io/job: retention-purge
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: hort-cli
              image: {{ include "hort-server.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /usr/local/bin/hort-cli
              args:
                - admin
                - task
                - invoke
                - retention-purge
                - --idempotency-key-window
                - day
              env:
                - name: HORT_SERVER
                  value: "http://{{ include "hort-server.fullname" . }}:{{ .Values.service.httpPort | default 8080 }}"
                - name: HORT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "hort-server.fullname" . }}-svc-token
                      key: token
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
