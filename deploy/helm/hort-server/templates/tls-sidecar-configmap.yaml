{{- if .Values.tlsSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hort-server.fullname" . }}-tls-sidecar
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events {}
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      map $ssl_server_name $tls_certificate_path {
        default /etc/nginx/tls/tls.crt;
      }
      map $ssl_server_name $tls_private_key_path {
        default /etc/nginx/tls/tls.key;
      }
      server {
        listen {{ .Values.tlsSidecar.httpsPort }} ssl;
        ssl_certificate $tls_certificate_path;
        ssl_certificate_key $tls_private_key_path;
        ssl_certificate_cache off;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        location / {
          proxy_pass http://127.0.0.1:{{ .Values.service.httpPort }};
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header Forwarded "";
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }
      {{- if .Values.metrics.bindAddr }}
      server {
        listen {{ .Values.tlsSidecar.metricsHttpsPort }} ssl;
        ssl_certificate $tls_certificate_path;
        ssl_certificate_key $tls_private_key_path;
        ssl_certificate_cache off;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /metrics {
          proxy_pass http://127.0.0.1:{{ .Values.service.metricsPort }};
          proxy_http_version 1.1;
          proxy_set_header Connection "";
          proxy_set_header Host $host;
          proxy_set_header Forwarded "";
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location / {
          return 404;
        }
      }
      {{- end }}
    }
{{- end }}
