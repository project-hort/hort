{{/*
Service-account RBAC for the svc-token bootstrap Job.

Creates a dedicated ServiceAccount + Role + RoleBinding that grants the
bootstrap Job exactly the permissions needed to write every Secret
named by `scheduledTasks.svcTokens`. The Role is intentionally minimal:
  - get/patch/update on the named secrets (for idempotent re-runs) —
    resourceNames enumerates one entry per `svcTokens` list item, using
    the SAME default-resolution helper
    (`hort-server.svcTokenSecretName` in `_helpers.tpl`) the bootstrap
    Job resolves each entry's Secret name with, so the two templates
    can never name a different set of Secrets.
  - create on secrets (cannot be scoped by resourceName in k8s RBAC — see
    inline comment; a separate rule is the standard workaround)

All three resources are gated by `scheduledTasks.adminTasksEnabled` — they
are only useful when the bootstrap Job renders, so they appear and disappear
together.
*/}}
{{- if .Values.scheduledTasks.adminTasksEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hort-server.fullname" . }}-svc-bootstrap
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hort-server.fullname" . }}-svc-bootstrap
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
rules:
  # get/patch/update the specific Secret. resourceNames scoping is supported
  # for these verbs, so we lock them down to the exact secret name.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $i, $tok := .Values.scheduledTasks.svcTokens }}
      - {{ include "hort-server.svcTokenSecretName" (dict "root" $ "tok" $tok "index" $i) }}
      {{- end }}
    verbs: ["get", "patch", "update"]
  # "create" cannot be scoped by resourceName in k8s RBAC (the API server
  # rejects such rules with a validation error). A separate rule without
  # resourceNames is the standard workaround — see
  # https://kubernetes.io/docs/reference/access-authn-authz/rbac/#referring-to-resources
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hort-server.fullname" . }}-svc-bootstrap
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hort-server.fullname" . }}-svc-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "hort-server.fullname" . }}-svc-bootstrap
  apiGroup: rbac.authorization.k8s.io
{{- end }}
