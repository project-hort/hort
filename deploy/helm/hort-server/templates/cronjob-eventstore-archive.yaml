{{/*
Eventstore-archive CronJob.

Periodically invokes `hort-cli admin task invoke eventstore-archive`.
The handler runs the audit-retention stream sweep: seals terminal /
age-gated streams whose minimum retention floor has elapsed, via the
`seal_and_remove` `StreamSealed`-tombstone chokepoint. Whether a
sealed stream's rows are actually removed depends on the worker's
`HORT_RETENTION_DATABASE_URL`: when set, a dedicated
`hort_retention_role` pool can DELETE; when unset, every delete_stream
fails fail-safe via the still-active `events_immutable` trigger (the
tombstone-first transaction rolls back, zero rows removed). Default
WEEKLY cadence (Sunday) — the lowest-frequency retention task.

Schedule-overlap protection: `concurrencyPolicy: Forbid` (layer 1) +
the worker per-kind semaphore concurrency=1 (layer 2).

Idempotency-Key: `--idempotency-key-window=day` →
`<UTC date>:eventstore-archive`.

Gated by `scheduledTasks.eventstoreArchive.enabled` (default false).
The parent `scheduledTasks.adminTasksEnabled` must also be true.

DESTRUCTIVE TASK: `eventstore-archive` is in DESTRUCTIVE_TASK_KINDS, so
invoking it requires `destroy_record` — the authority over the audit record
itself — in addition to `AdminTaskInvoke`.

THIS KIND HAS ONLY THE MANUAL PATH, AND NO GRANT CHANGES THAT. Unlike the
retention pair, `destroy_record` is **not grantable to a service account**:
the archive seals audit streams — authentication audit, download audit, token
use — and nothing reconstructs a sealed stream, so no unattended identity is
given standing authority over one. The refusal is fail-closed at five
independent points (the apply-parse validator rejects a
`serviceAccount`-subject grant of it, the apply linter denies it the
SA-provenance exemption so the hand-written `kind: user` form naming the SA's
backing user rejects too, `issue-svc-token` refuses to mint it, and both
runtime authority checks refuse a service-account caller whatever the grant
set says). Adding it to `scheduledTasks.svcTokens[].permissions` fails the
bootstrap Job; declaring the grant fails the apply. So leaving this CronJob
disabled is the design, not a gap to provision around.

**Being an admin does not confer `destroy_record` either**: it is held only
through an explicit PermissionGrant, so an interactive admin is answered
`403` until one exists for their identity. Run this kind by hand with an
admin CliSession whose identity holds that grant:
`hort-cli admin task invoke eventstore-archive`.

The authority is re-checked a second time when the worker runs the job,
against the live state of the user it was enqueued under: revoking either
grant (or deactivating the account) stops the jobs it has already queued,
which land as terminal `failed` rows naming the cause. The grant must be
reachable from the persisted identity — a `serviceAccount`- or
`User`-subject grant, or a claims grant on `admin` for an admin user;
a grant bound to any other claim passes the enqueue and is refused at
execution, because nothing persists an IdP-resolved claim set. See
docs/architecture/how-to/deploy/enable-admin-task-cronjobs.md section 5.
*/}}
{{- if and .Values.scheduledTasks.adminTasksEnabled .Values.scheduledTasks.eventstoreArchive.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hort-server.fullname" . }}-eventstore-archive
  labels:
    {{- include "hort-server.labels" . | nindent 4 }}
    hort-server.io/job: eventstore-archive
spec:
  schedule: {{ .Values.scheduledTasks.eventstoreArchive.schedule | quote }}
  timeZone: {{ .Values.scheduledTasks.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "hort-server.selectorLabels" . | nindent 12 }}
            hort-server.io/job: eventstore-archive
        spec:
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: hort-cli
              image: {{ include "hort-server.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /usr/local/bin/hort-cli
              args:
                - admin
                - task
                - invoke
                - eventstore-archive
                - --idempotency-key-window
                - day
              env:
                - name: HORT_SERVER
                  value: "http://{{ include "hort-server.fullname" . }}:{{ .Values.service.httpPort | default 8080 }}"
                - name: HORT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "hort-server.fullname" . }}-svc-token
                      key: token
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
{{- end }}
