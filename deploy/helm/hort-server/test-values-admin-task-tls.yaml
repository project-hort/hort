# Exercise every credentialed admin-task CronJob with the TLS Service path.
publicBaseUrl: "https://example.com"
trustedProxyCidrs: ["10.244.3.0/24"]
tlsSidecar:
  enabled: true
  secretName: "hort-server-tls"
extraCaBundle:
  path: "/etc/hort-server/ca/ca.crt"
  configMapName: "hort-server-service-ca"
scheduledTasks:
  adminTasksEnabled: true
  noop:
    enabled: true
  stagingSweep:
    enabled: true
  cronRescanTick:
    enabled: true
  advisoryWatchTick:
    enabled: true
  eventstoreCheckpoint:
    enabled: true
  replaySeenPrune:
    enabled: true
  scannerRegistryPrune:
    enabled: true
  retentionEvaluate:
    enabled: true
  retentionPurge:
    enabled: true
  eventstoreArchive:
    enabled: true
  serviceAccountRotation:
    enabled: true
worker:
  rotation:
    publicRegistryHost: "registry.example.com"
postgres:
  app:
    existingSecret: "hort-app-db-secret"
  admin:
    existingSecret: "hort-admin-db-secret"
auth:
  provider: "oidc"
  oidc:
    issuerUrl: "https://idp.example.com"
    audience: "hort-server"
storage:
  backend: filesystem
