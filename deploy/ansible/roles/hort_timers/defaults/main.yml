---
# hort_timers — systemd timer+oneshot pairs that drive the worker's periodic
# task kinds on the native (non-k8s) deploy, mirroring the Helm scheduledTasks.
# Two execution paths:
#   - dsn-direct: `hort-server <subcommand>` — a DB-only subcommand
#     (MinimalConfig, ADR 0009) that enqueues a job via the DSN; the running
#     hort-worker processes it. No token, no API.
#   - admin-task: `hort-cli admin task invoke <kind>` — enqueues via the API
#     with an `admin_task_invoke` token. Needs hort-cli + the cronjob-tasks
#     token on the host.

hort_timers_enabled: true

# Master gate for the admin-task path (needs hort-cli + the cronjob-tasks
# token). dsn-direct timers run regardless of this flag.
hort_timers_admin_tasks_enabled: true

hort_timers_server_bin: /usr/local/bin/hort-server
hort_timers_cli_bin: /usr/local/bin/hort-cli
hort_timers_server_env_file: /etc/hort/hort-server.env
hort_timers_token_file: /etc/hort/tasks-token

# The capability the cronjob-tasks svc-token is minted with. Every entry
# must be backed by a live PermissionGrant for the cronjob-tasks SA in the
# gitops tree (`auth/grants/cronjob-tasks-*.yaml`) — effective authority is
# grants AND cap, so an unbacked entry here is dead weight and a granted
# permission missing here authorises nothing.
#
# `destroy_content` is what lets the retention timers below run as this
# identity instead of by hand. `destroy_record` (eventstore-archive) MUST
# NOT be added: it is not grantable to a service account at any of the five
# points that enforce it, so a mint carrying it is refused outright.
hort_timers_token_permissions:
  - admin_task_invoke
  - destroy_content

# Force one rotation of the cronjob-tasks token on the next deploy.
#
# The token's capability is frozen at mint (ADR 0012) and this SA is
# PAT-only — no `fallbackRotation`, so nothing re-snapshots it on an
# interval. Editing `hort_timers_token_permissions` above therefore does
# NOT reach an already-minted token: the idempotent mint reports "already
# exists" and the stale cap stays, which is the frozen-cap trap (the grant
# is live in the database, the evaluator sees it, and the mounted token
# still 403s). Read the live cap with
# `hort-cli auth status --output json` — its `permissions` field is the
# frozen cap, never the grant set.
#
# Set true for one deploy to converge, then back to false. Mirrors the Helm
# chart's `scheduledTasks.svcTokens[].rotate`. Rotation invalidates the
# previous token, which is why it is opt-in.
hort_timers_token_rotate: false
hort_timers_server_url: "https://{{ registry_fqdn }}"
hort_timers_run_user: "{{ hort_user }}"

# Per-task schedule (systemd OnCalendar) + enable. Cadences mirror the Helm
# scheduledTasks defaults; `path` selects the execution path.
hort_timers_tasks:
  # ── enabled — dsn-direct (hort-server subcommand; no token) ──────────────────
  - kind: quarantine-release-sweep
    path: dsn-direct
    exec_subcommand: enqueue-quarantine-release-sweep
    on_calendar: "*:0/5"             # every 5 min (Helm: */5 * * * *)
    enabled: true
    description: "Release artifacts whose quarantine window has elapsed (CRITICAL — without it quarantine never releases)."
  - kind: config-scrub
    path: dsn-direct
    exec_subcommand: scrub
    on_calendar: "*-*-* 03:00:00"    # daily 03:00 (Helm: 0 3 * * *)
    enabled: true
    description: "Scrub the gitops config snapshot / CAS integrity."
  - kind: prefetch-row-retention-sweep
    path: dsn-direct
    exec_subcommand: enqueue-prefetch-row-retention-sweep
    on_calendar: "*-*-* 02:00:00"    # daily 02:00 (Helm: 0 2 * * *)
    enabled: true
    description: "Delete terminal prefetch job rows older than the retention horizon; also covers the eager OCI index-child ingest rows, which accrue on any OCI proxy repository with no opt-in at all."
  - kind: scan-row-retention-sweep
    path: dsn-direct
    exec_subcommand: enqueue-scan-row-retention-sweep
    on_calendar: "*-*-* 03:00:00"    # daily 03:00 (Helm: 0 3 * * *)
    enabled: true
    description: "Delete terminal scan job rows older than the retention horizon; every artifact scan — ingest and every periodic rescan — leaves one, on every deployment from day one."
  - kind: jobs-row-retention-sweep
    path: dsn-direct
    exec_subcommand: enqueue-jobs-row-retention-sweep
    on_calendar: "*-*-* 03:30:00"    # daily 03:30 (Helm: 30 3 * * *)
    enabled: true
    description: "Delete terminal job rows older than the retention horizon for every kind the two kind-specific sweeps do not reach; retains per kind the newest completed row and the newest terminal row, which the liveness gauges and the prefetch rotation cursor read."
  - kind: api-token-retention-sweep
    path: dsn-direct
    exec_subcommand: enqueue-api-token-retention-sweep
    on_calendar: "*-*-* 04:30:00"    # daily 04:30 (Helm: 30 4 * * *)
    enabled: true
    description: "Delete api_tokens rows whose own expires_at or revoked_at is older than the 90-day retention horizon; a row with both marks NULL is a durable identity and is never reached. The only sweep here whose DELETE lands outside public.jobs, and api_tokens had no horizon at all before it."
  # ── enabled — admin-task (hort-cli; needs the cronjob-tasks token) ───────────
  - kind: scanner-registry-prune
    path: admin-task
    idempotency_window: hour
    on_calendar: "*:00"              # hourly (Helm: 0 * * * *)
    enabled: true
    description: "Prune stale scanner-registry rows."
  - kind: staging-sweep
    path: admin-task
    idempotency_window: minute
    on_calendar: "*:0/15"            # every 15 min (Helm: */15 * * * *)
    enabled: true
    description: "Sweep orphaned stateful-upload staging entries (else they grow until ingest fails on a full FS)."
  - kind: replay-seen-prune
    path: admin-task
    idempotency_window: hour
    on_calendar: "*:00"              # hourly (Helm: 0 * * * *)
    enabled: true
    description: "Prune the federation JWT-replay seen-set."
  - kind: cron-rescan-tick
    path: admin-task
    idempotency_window: minute
    on_calendar: "*:0/5"             # every 5 min (Helm: */5 * * * *)
    enabled: true
    description: "Re-scan cached artifacts against newly-published advisories (continuous supply-chain re-evaluation)."
  - kind: advisory-watch-tick
    path: admin-task
    idempotency_window: hour
    on_calendar: "0/6:00"            # every 6h (Helm: 0 */6 * * *)
    enabled: true
    description: "Pull the OSV advisory diff and re-scan artifacts hit by newly-published advisories (keeps OSV data current)."
  # ── disabled — need extra infrastructure (non-destructive) ──────────────────
  - kind: verify-event-chain
    path: dsn-direct
    exec_subcommand: verify-event-chain
    on_calendar: "*-*-* 02:30:00"    # daily (Helm: 0 2 * * *)
    enabled: false
    description: "Offline event-chain tamper-evidence + anchoring; needs eventstore-checkpoint + an S3 Object-Lock bucket (off on the filesystem flavor)."
  - kind: eventstore-checkpoint
    path: admin-task
    idempotency_window: hour
    on_calendar: "*:00"              # hourly (Helm: 0 * * * *)
    enabled: false
    description: "Emit the signed event-chain checkpoint anchor verify-event-chain attests; needs an S3 Object-Lock (WORM) bucket."
  - kind: prefetch-tick
    path: dsn-direct
    exec_subcommand: enqueue-prefetch-tick
    on_calendar: "*:0/15"            # every 15 min (Helm: */15 * * * *)
    enabled: false
    description: "Walk prefetch-eligible repos + tracked packages and enqueue upstream-divergence prefetch jobs."
  - kind: wheel-metadata-backfill
    path: dsn-direct
    exec_subcommand: enqueue-wheel-metadata-backfill
    on_calendar: "Sun *-*-* 04:00:00"  # weekly Sun 04:00 (Helm: 0 4 * * 0)
    enabled: false
    description: "One-shot retrofit: extract PEP 658 METADATA for PyPI wheels ingested before metadata extraction existed."
  - kind: service-account-rotation
    path: admin-task
    idempotency_window: minute
    on_calendar: "*:0/15"            # every 15 min (Helm: */15 * * * *)
    enabled: false
    description: "Rotate service-account tokens (needs the k8s svc-token rotation surface; off on the native flavor)."
  # ── disabled — destructive retention/archive tasks ──────────────────────────
  # Each requires `admin_task_invoke` AND a destructive permission.
  #
  # The retention pair needs `destroy_content`, which the cronjob-tasks SA
  # DOES hold (`auth/grants/cronjob-tasks-destroy-content.yaml`), so these
  # two are runnable unattended once their remaining prerequisite —
  # HORT_RETENTION_DATABASE_URL — is wired and the token carries the cap
  # (see `hort_timers_token_rotate`). They stay disabled here because
  # turning them on is a capacity-and-retention decision, not a
  # capability gap.
  #
  # eventstore-archive needs `destroy_record`, which is NOT grantable to a
  # service account — nothing reconstructs a sealed audit stream, so no
  # unattended identity holds standing authority over one. This timer
  # cannot be made to work by granting anything; run the kind by hand as a
  # human identity that holds `destroy_record`.
  - kind: retention-evaluate
    path: admin-task
    idempotency_window: hour
    on_calendar: "*-*-* 03:00:00"
    enabled: false
    description: "Retention evaluation — needs HORT_RETENTION_DATABASE_URL wired (else fail-safe no-op)."
  - kind: retention-purge
    path: admin-task
    idempotency_window: hour
    on_calendar: "*-*-* 04:00:00"
    enabled: false
    description: "Retention purge — needs HORT_RETENTION_DATABASE_URL wired. Also the only path that reclaims a deleted artifact's bytes."
  - kind: eventstore-archive
    path: admin-task
    idempotency_window: day
    on_calendar: "Sun *-*-* 05:00:00"
    enabled: false
    description: "Event-store archive — NOT runnable as the cronjob-tasks SA: `destroy_record` is not grantable to a machine identity. Run by hand as a human identity that holds it. Also needs HORT_RETENTION_DATABASE_URL + the seal-pool single-flight backstop (ADR 0020)."
