---
# certbot role defaults.
#
# le_email — Let's Encrypt account email address.  REQUIRED: must be set in
#   group_vars/production/ or --extra-vars before running the play.  The role
#   asserts this variable is defined and non-empty so a missing value fails
#   early with an actionable message rather than silently producing an
#   unusable certificate.
#   There is intentionally no default value: an empty registration email is
#   rejected by Let's Encrypt and would cause the certbot invocation to fail
#   with a confusing upstream error.

# certbot_staging — when true, passes --staging to certbot so that issuance
#   uses the Let's Encrypt staging CA.  Staging certificates are not trusted
#   by browsers but are issued without consuming production rate-limit quota.
#   Use this for test runs or CI-driven provisioning against a non-production
#   host.  Set to false (the default) for all production deployments.
certbot_staging: false

# certbot_fqdn — the domain to certify.  Defaults to registry_fqdn so every
#   pre-#78 caller (site-native.yml / site-podman.yml, which invoke this role
#   with no extra vars) is byte-for-byte unaffected.  A second call site
#   (the project-hort.de `website` role, issue #78) overrides this to certify
#   a different domain on the same or a different host, without touching
#   this role's default behaviour.
certbot_fqdn: "{{ registry_fqdn }}"

# certbot_notify_handlers — handler names notified after a successful
#   issuance (see tasks/main.yml).  Defaults to the nginx role's three
#   registry-vhost handlers, preserving today's behaviour exactly. A caller
#   certifying a different vhost (e.g. the `website` role) overrides this
#   with its own "Render <vhost> (cert present)" handler name — the handler
#   must exist somewhere in the same play (handlers are play-scoped); the
#   generic "Validate nginx config" / "Reload nginx" handlers are reusable
#   as-is regardless of which vhost is being certified.
certbot_notify_handlers:
  - "Render nginx vhost (cert present)"
  - "Validate nginx config"
  - "Reload nginx"
