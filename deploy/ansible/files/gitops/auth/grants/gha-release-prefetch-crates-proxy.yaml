apiVersion: project-hort.de/v1
kind: PermissionGrant
metadata:
  name: gha-release-prefetch-crates-proxy
spec:
  # Per-repo serviceAccount-subject grant: gha-release may prefetch the
  # crates-proxy MEMBER directly. Sibling of
  # gha-release-prefetch-cargo-virtual.yaml, needed because a prefetch POST
  # against the virtual repo enqueues jobs that no-op in the
  # no-catch-all-upstream-mapping branch (a virtual repo has no upstream
  # mapping; see PrefetchIngestHandler) — only the member actually fetches.
  # The read half of SelfServicePrefetchUseCase's Read ∧ Prefetch gate is
  # covered by the existing gha-release-read-crates-proxy.yaml.
  #
  # Used by release.yml's hort-publish preflight when its warm POST is
  # pointed at the member (CARGO_SOURCE_REPO). Interim until the
  # member-aware enqueue lands; then the cargo-virtual grant suffices again.
  subject:
    kind: serviceAccount
    name: gha-release
  permission: prefetch
  repository: crates-proxy
