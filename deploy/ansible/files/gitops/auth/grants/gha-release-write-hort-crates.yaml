apiVersion: project-hort.de/v1
kind: PermissionGrant
metadata:
  name: gha-release-write-hort-crates
spec:
  # Per-repo serviceAccount-subject grant: gha-release (the GitHub
  # Actions release-publishing identity) publishes first-party crates
  # to hort-crates. Resolves at apply to
  # GrantSubject::User(<gha-release backing user>).
  subject:
    kind: serviceAccount
    name: gha-release
  permission: write
  repository: hort-crates
