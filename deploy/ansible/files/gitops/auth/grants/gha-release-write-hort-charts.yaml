apiVersion: project-hort.de/v1beta1
kind: PermissionGrant
metadata:
  name: gha-release-write-hort-charts
spec:
  # Per-repo serviceAccount-subject grant: gha-release (the GitHub
  # Actions release-publishing identity) pushes the registry.hort.rs
  # chart flavor to hort-charts. Resolves at apply to
  # GrantSubject::User(<gha-release backing user>).
  subject:
    kind: serviceAccount
    name: gha-release
  permission: write
  repository: hort-charts
