apiVersion: project-hort.de/v1beta1
kind: PermissionGrant
metadata:
  name: gha-release-write-hort-oci
spec:
  # Per-repo serviceAccount-subject grant: gha-release (the GitHub
  # Actions release-publishing identity) pushes first-party images to
  # hort-oci. Resolves at apply to
  # GrantSubject::User(<gha-release backing user>).
  subject:
    kind: serviceAccount
    name: gha-release
  permission: write
  repository: hort-oci
