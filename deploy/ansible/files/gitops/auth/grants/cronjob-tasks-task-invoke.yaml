apiVersion: project-hort.de/v1
kind: PermissionGrant
metadata:
  name: cronjob-tasks-task-invoke
spec:
  # Standalone serviceAccount-subject grant. Resolves at apply to
  # GrantSubject::User(<cronjob-tasks backing user>), so the cronjob-tasks
  # SA can enqueue non-destructive admin tasks without admin.
  # `admin_task_invoke` is the narrow "may enqueue an admin task" cap, not
  # the `admin` bit — this standalone grant is the sole carrier.
  #
  # This confers no destructive authority by itself. The destructive
  # factor is a separate grant per authority, and neither is implied by
  # `admin`: `destroy_content` for retention-evaluate / retention-purge
  # ships beside this file as cronjob-tasks-destroy-content.yaml, and
  # `destroy_record` for eventstore-archive is not grantable to a service
  # account at all (nothing reconstructs a sealed audit stream — see the
  # ServiceAccount declaration for the five points that refuse it).
  subject:
    kind: serviceAccount
    name: cronjob-tasks
  permission: admin_task_invoke
  # No `repository:` -> global admin_task_invoke (task invocation is a
  # global capability, not per-repo).
