apiVersion: project-hort.de/v1beta1
kind: ServiceAccount
metadata:
  name: gha-release
# Release-publishing identity for the GitHub Actions release workflow:
# pushes first-party images to hort-oci and crates to hort-crates.
#
# The envelope is identity + federation binding only. The authority is
# the serviceAccount-subject PermissionGrants in
# `auth/grants/gha-release-write-hort-oci.yaml`,
# `auth/grants/gha-release-write-hort-crates.yaml`, and
# `auth/grants/gha-release-read-hort-oci.yaml` (the workflow
# cosign-signs the images it pushes; signing reads the just-pushed
# manifest back from hort-oci, and write does not imply read).
spec:
  federatedIdentities:
    - issuer: github-actions          # references OidcIssuer metadata.name
      claims:
        repository: project-hort/hort
        # `environment: release` is emitted only when the GitHub Actions job
        # targets a protected environment named "release". The environment
        # enforces tag-only trigger + required reviewers — hort does not need
        # a `ref:` glob because the environment gate is authoritative.
        # (A ref glob would require exact-match anyway — globs are not
        # supported by the SA claim matcher.)
        environment: release
