apiVersion: project-hort.de/v1
kind: ServiceAccount
metadata:
  name: gha-ci
# CI pull identity for GitHub Actions builds in project-hort/hort:
# cargo fetch / docker pull through the proxies, and cargo resolution
# via cargo-virtual.
#
# The envelope is identity + federation binding only. The read
# authority is the per-repo serviceAccount-subject PermissionGrants in
# `auth/grants/gha-ci-read-*.yaml` (one per repo: cargo-virtual,
# crates-proxy, dockerhub-proxy, quay-proxy, npm-proxy).
spec:
  federatedIdentities:
    - issuer: github-actions          # references OidcIssuer metadata.name
      claims:
        repository: project-hort/hort # scope-narrowing: any workflow in this repo
        # NOTE: scoped to the non-gating `ci` deployment environment (no
        # protection rules — it exists only to stamp this claim) so this
        # identity is disjoint from `gha-release`'s `environment: release`
        # by construction. Before this, a bare repository-only claim was a
        # SUBSET of gha-release's claim set, so a release-tagged token
        # matched both SAs and the federated exchange failed closed on
        # `multiple_sa_match` — blocking every release-publish path under
        # HORT_PROXY_ENABLED. Every job authenticating as gha-ci MUST tag
        # `environment: ci` (see the six jobs in ci.yml / feature-ci.yml);
        # an untagged job's token carries no `environment` claim and would
        # match neither SA (`no_sa_match`). Fixes #64.
        environment: ci
