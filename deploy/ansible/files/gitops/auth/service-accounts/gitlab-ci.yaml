apiVersion: project-hort.de/v1beta1
kind: ServiceAccount
metadata:
  name: gitlab-ci
# CI pull identity for GitLab CI builds (gitlab.kdp.kloni.cloud) — same
# scope as the GitHub gha-ci SA.
#
# The envelope is identity + federation binding only. The read
# authority is the per-repo serviceAccount-subject PermissionGrants in
# `auth/grants/gitlab-ci-read-*.yaml` (one per repo: cargo-virtual,
# crates-proxy, dockerhub-proxy, quay-proxy, npm-proxy).
spec:
  federatedIdentities:
    - issuer: gitlab                       # OidcIssuer metadata.name (auth/issuers/gitlab.yaml)
      claims:
        # GitLab CI id_tokens emit project_path as <namespace>/<project>; this
        # binds the SA to the one project so no other repo on the instance can
        # assume it.
        project_path: "pub-projects/hort"
