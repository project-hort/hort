apiVersion: project-hort.de/v1
kind: ServiceAccount
metadata:
  name: maintainer-curator
# Operator "curator" identity: a maintainer who quarantine-releases /
# curates artifacts across the registry. The token is minted by the
# gitops role (`issue-svc-token --name maintainer-curator --permission
# curate`) and stored in the operator's secret store.
#
# The envelope is identity-only; the CURATE authority is the standalone
# serviceAccount-subject PermissionGrant in
# `auth/grants/maintainer-curator-curate.yaml` (global curate).
# Non-admin: `issue-svc-token` rejects `--permission=admin`.
#
# PAT-only SA: no federatedIdentities / fallbackRotation — the gitops
# role mints the token via `issue-svc-token`.
spec: {}
