apiVersion: project-hort.de/v1
kind: ServiceAccount
metadata:
  name: maintainer-dev
# Operator "developer" identity: a maintainer's day-to-day read access
# across every first-party + proxy repo on registry.hort.rs. The token
# is minted by the gitops role (`issue-svc-token --name maintainer-dev
# --permission read`) and stored in the operator's secret store.
#
# The envelope is identity-only; the READ authority is the standalone
# serviceAccount-subject PermissionGrant in
# `auth/grants/maintainer-dev-read.yaml` (global read). The SA holds no
# `is_admin` bit (`issue-svc-token` rejects `--permission=admin`);
# human admin is OIDC (Dex) -> CliSession, not a static SA token.
#
# PAT-only SA: no federatedIdentities / fallbackRotation — the gitops
# role mints the token via `issue-svc-token`. CI federation lives on
# the gha-ci / gha-release / gitlab-ci SAs instead.
spec: {}
