apiVersion: project-hort.de/v1
kind: ServiceAccount
metadata:
  name: cronjob-tasks
# Scheduled-housekeeping identity: the SA whose token the in-cluster /
# on-host CronJobs mount to invoke admin tasks (`hort-cli admin task
# invoke <kind>` for noop, staging-sweep, cron-rescan-tick,
# advisory-watch-tick, eventstore-checkpoint, …).
#
# The envelope is identity-only. All authority is standalone
# serviceAccount-subject PermissionGrants in `auth/grants/`, each
# resolving at apply to GrantSubject::User(<backing user>):
#
#   cronjob-tasks-task-invoke.yaml     permission: admin_task_invoke
#   cronjob-tasks-destroy-content.yaml permission: destroy_content
#
# `admin_task_invoke` is the narrow "may enqueue an admin task" cap, not
# the `admin` bit. A destructive task needs it AND a destructive
# permission, and which one depends on what is destroyed:
# `destroy_content` for retention-evaluate / retention-purge (granted
# above — scheduled storage reclamation is what this identity exists for,
# and ArtifactPurged stays on the stream behind it), `destroy_record` for
# eventstore-archive.
#
# `destroy_record` IS NOT GRANTABLE TO THIS OR ANY SERVICE ACCOUNT.
# Nothing reconstructs a sealed audit stream, so no unattended identity
# gets standing authority over one. The refusal is fail-closed at five
# independent points, not a convention: the apply-parse validator rejects
# a serviceAccount-subject grant of it, the apply linter denies it the
# SA-provenance exemption (so the hand-written `kind: user` form naming
# this SA's backing user rejects too), `issue-svc-token` refuses to mint
# it, and both runtime authority checks — the admin-task gate and the
# worker's pre-handler re-check — refuse a service-account caller
# whatever the grant set says. Run eventstore-archive by hand with a
# Dex-backed admin CliSession whose identity holds `destroy_record`, or a
# narrow `HORT_TOKEN_ALLOW_ADMIN`-gated token; neither is implied by
# `admin`, so an admin session does not stand in for the grant.
#
# PAT-only SA: no federatedIdentities / fallbackRotation — the gitops
# role mints the token via `issue-svc-token`. THAT MEANS A NEW GRANT IS
# INERT UNTIL THE TOKEN IS ROTATED: the capability is frozen at mint
# (ADR 0012), and with no `fallbackRotation` block there is no
# reconciler interval that re-snapshots it. Read the live cap with
# `hort-cli auth status --output json` (`permissions` is the frozen cap,
# never the grant set) and rotate with the hort_timers role's
# `hort_timers_token_rotate: true` — see the grant file beside this one
# for the direct command.
spec: {}
