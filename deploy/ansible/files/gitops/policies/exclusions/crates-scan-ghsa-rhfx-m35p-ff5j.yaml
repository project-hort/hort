apiVersion: project-hort.de/v1
kind: Exclusion
metadata:
  name: crates-scan-ghsa-rhfx-m35p-ff5j
spec:
  policy: crates-scan
  cveId: GHSA-rhfx-m35p-ff5j
  # Same package + rationale as crates-scan-rustsec-2026-0002.yaml -- this
  # is the SAME lru 0.12.5 IterMut finding under its GitHub Security
  # Advisory alias (RUSTSEC-2026-0002's [advisory] aliases =
  # ["GHSA-rhfx-m35p-ff5j"] in the upstream advisory-db). Scanners
  # disagree on which id is primary vs alias for a given finding
  # (hort-domain's cve_matches already checks both directions for exactly
  # this reason), so a second exclusion keyed by the GHSA id is
  # belt-and-suspenders against the OSV backend surfacing this one as
  # primary instead of RUSTSEC-2026-0002.
  packagePattern: "lru"
  scope: global
  reason: "lru 0.12.5 IterMut Stacked-Borrows unsoundness (RustSec alias of RUSTSEC-2026-0002) -- hort-app's pat_cache uses only get/put/push, never constructs IterMut; see .cargo/audit.toml for the full build-side rationale this mirrors"
  # No expiresAt -- see the sibling RUSTSEC-2026-0002 exclusion's comment.
