# Example inventory — replace with real hostnames / IPs.
# Copy this file to inventory/production/hosts.ini (gitignored) and adjust.
[hort]
registry.hort.rs ansible_user=debian

[hort:vars]
# Override in group_vars/production/ (gitignored) or via --extra-vars.
ansible_python_interpreter=/usr/bin/python3

# project-hort.de static site (issue #78, site-website.yml). Can be the SAME
# host as [hort] above (a second vhost + cert on one box) or a separate one
# — the website role has no dependency on the hort-server stack. If it's the
# same host, just repeat the hostname here too.
[website]
project-hort.de ansible_user=debian

[website:vars]
ansible_python_interpreter=/usr/bin/python3
