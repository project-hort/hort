# Example inventory — replace with real hostnames / IPs.
# Copy this file to inventory/production/hosts.ini (gitignored) and adjust.
[hort]
registry.hort.rs ansible_user=debian

[hort:vars]
# Override in group_vars/production/ (gitignored) or via --extra-vars.
ansible_python_interpreter=/usr/bin/python3

# hort's static sites (issues #78, #77; site-website.yml) — project-hort.de
# and hort.rs. site-website.yml runs as two plays, both targeting this
# [website] group, so ONE host here gets both sites (two vhosts, two certs)
# by default. Can be the SAME host as [hort] above, this single shared host,
# or two entirely separate hosts (add a second inventory line) — the
# website role has no dependency on the hort-server stack either way.
[website]
project-hort.de ansible_user=debian

[website:vars]
ansible_python_interpreter=/usr/bin/python3
