# Configuration for cargo-audit
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit
#
# **This file is the single source of truth for the RUSTSEC advisory
# ignore list.** `deny.toml`'s `[advisories.ignore]` is kept in sync
# with this file by `scripts/check-advisory-sync.sh`, run on every CI
# push. When you add or remove an ID here, mirror the change in
# `deny.toml` in the same commit.

[advisories]
# List of advisory IDs to ignore.
#
# An entry tagged with the marker `AUDIT-ONLY: RUSTSEC-YYYY-NNNN` on the
# comment line immediately above the ID is intentionally **not** mirrored
# in `deny.toml`. The two tools walk the dependency graph differently:
# `cargo audit` walks the full `Cargo.lock`; `cargo deny` walks the
# active build graph (excluding unused optional features). When an
# advisory is reachable only via an unused feature, `cargo deny` does
# not match the ignore and emits `advisory-not-detected` (which is a
# hard failure). The marker tells `scripts/check-advisory-sync.sh` the
# divergence is intentional.
#
# issue #80: `scripts/check-advisory-sync.sh` also asserts a THIRD axis —
# every ID here needs a matching `kind: Exclusion` in
# `deploy/ansible/files/gitops/policies/exclusions/` (a build-side risk
# acceptance with no registry-side mirror would let hort's own quarantine
# gate reject the same package CI has already decided is safe to build
# with, once CI's prefetch — now SA-token-authorized — warms it through
# `crates-proxy`). Build-side ignores are hort-build-scoped acceptances and
# are deliberately NOT mirrored into registry-level Exclusions -- a registry
# Exclusion waives the finding for EVERY registry consumer (a nuclear option;
# maintainer principle, issue #80). If a build-accepted dep is ever
# scan-rejected registry-side, the remedy is UPGRADING the dep off the
# vulnerable version (the #80 lru fix), not a registry mirror. The historical
# `REGISTRY-EXEMPT:` markers below are retained as per-dep context only
# is intentionally **not** mirrored to a registry Exclusion — same
# marker-naming convention as AUDIT-ONLY/DENY-ONLY.
ignore = [
    # AUDIT-ONLY: RUSTSEC-2026-0459
    # REGISTRY-EXEMPT: RUSTSEC-2026-0459 — build-side acceptance only, with no
    # registry Exclusion: an Exclusion waives the finding for EVERY registry
    # consumer (the nuclear option). Nothing hort publishes carries this crate
    # at all, so there is nothing for a registry-side waiver to protect.
    #
    # libsqlite3-sys 0.30.1 — C SQLite CVE-2026-119375 (RUSTSEC-2026-0459,
    # 6.8 medium), advisory published 2026-10-30 and reaching the live RustSec
    # database on 2026-11-09, between a green `security:cargo-audit` on
    # `develop` at 08:59 and the next run. No code and no `Cargo.lock` change
    # is involved on hort's side.
    #
    # It is a `Cargo.lock` entry and nothing more. `cargo tree -i
    # libsqlite3-sys` prints "nothing to print" for EVERY edge kind — normal,
    # dev and build — so the crate is in no dependency graph: it reaches no
    # hort binary, no test binary, no container image and no published crate,
    # and no input from a hort user can reach it. It is in the lockfile because
    # a `Cargo.lock` is feature-independent and therefore records every
    # optional driver of `sqlx 0.9` (mysql, postgres, sqlite) whatever feature
    # set the workspace selects. That is also why `cargo deny check` reports
    # `advisories ok` on the same tree — it walks the active build graph — and
    # why this entry is AUDIT-ONLY: mirroring it into `deny.toml` would make
    # cargo-deny emit `advisory-not-detected`, a hard failure.
    #
    # Not fixable here, on two independent counts, both measured rather than
    # assumed:
    #   * No upgrade path *today*. The advisory's fix is `>=0.39.0`, and
    #     `sqlx-sqlite 0.9.0` requires `libsqlite3-sys >=0.30.1, <0.38.0`:
    #     `cargo update -p libsqlite3-sys --precise 0.39.0` fails to resolve.
    #     The widening is already merged upstream —
    #     https://github.com/launchbadge/sqlx/pull/4502, merged 2026-11-08 —
    #     and sqlx's own documented policy is to raise this range's maximum
    #     "in patch (SemVer-compatible) releases". Only the release is
    #     missing; `sqlx 0.9.0` is still the newest published version and
    #     `cargo update -p sqlx` locks 0 packages.
    #   * No removal path. `default-features = false` on the `sqlx` dependency
    #     cannot drop the entry, because the lockfile records optional
    #     dependencies regardless of feature activation.
    #
    # Two further bounds from the advisory's own text, both narrowing it
    # further: the vulnerable code is the SQLite source the `bundled` feature
    # compiles, and "a build that links a system SQLite instead of the bundled
    # source is not affected by the copy in this crate" — hort compiles
    # neither; and the attack is local and needs a victim to open a database
    # file together with a sibling `-wal` file written by a less trusted party,
    # which no hort code path does.
    #
    # Why the residual risk is accepted: the vulnerable code is C SQLite inside
    # a crate that is compiled into nothing hort builds, ships or publishes, so
    # the exposure is zero rather than small, and the bridge is short.
    #
    # Removal trigger, concrete: the next `sqlx` patch release carrying PR
    # 4502. Then `cargo update -p sqlx` is a lockfile-only fix and **this entry
    # is deleted** rather than carried forward. Nothing else needs to change.
    "RUSTSEC-2026-0459",

    # AUDIT-ONLY: RUSTSEC-2026-0173
    # REGISTRY-EXEMPT: RUSTSEC-2026-0173 — not observed to block a CI
    # prefetch/build (issue #80's prod evidence names only the lru /
    # RUSTSEC-2026-0002 finding); also unreachable in the active build
    # graph (see the AUDIT-ONLY rationale below), so hort's own scan of
    # crates-proxy's dependency closure has no path to this crate at
    # all. If it ever blocks registry-side, upgrade the dep (registry Exclusion = nuclear option, avoid).
    # proc-macro-error2 2.0.1 - unmaintained. Reachable ONLY through
    # `sigstore`'s DISABLED `cosign` feature, so it is NEVER compiled into any
    # hort binary:
    #   sigstore 0.14 (cosign OFF) -> oci-client 0.17 -> oci-spec 0.9
    #     -> getset 0.1.6 -> proc-macro-error2 2.0.1
    # `cargo tree -i proc-macro-error2` is empty and `cargo deny` (active-graph
    # scan) is clean; only `cargo audit --deny warnings` (full-`Cargo.lock`
    # scan) escalates the unmaintained notice to an error. AUDIT-ONLY (not
    # mirrored to deny.toml): mirroring would make cargo-deny emit
    # `advisory-not-detected` for an advisory it correctly never sees.
    # It is NOT excludable from the lockfile: `Cargo.lock` pins optional deps
    # for any feature combination even when the activating feature (cosign) is
    # off, and the parent manifests (sigstore/oci-client) are not ours to edit;
    # `cargo update` re-locks the same versions. No patched version exists
    # (unmaintained), no dependency bump removes it. Low risk: unmaintained
    # != vulnerable, and not built. Re-evaluate if a future sigstore drops the
    # oci-client/getset chain.
    "RUSTSEC-2026-0173",

    # REGISTRY-EXEMPT: RUSTSEC-2023-0071 — not observed to block a CI
    # prefetch/build (issue #80's prod evidence names only the lru /
    # RUSTSEC-2026-0002 finding). If it ever blocks registry-side, prefer upgrading the dep (registry Exclusion = nuclear option) —
    # hort's own crates-proxy scan of `rsa` is ever observed to
    # quarantine/reject it for a CI dependency build.
    # rsa 0.9.10 - Marvin Attack: a timing sidechannel that can leak an
    # RSA *private* key over the network (RUSTSEC-2023-0071). This
    # enters the ACTIVE build graph via
    # `sigstore 0.14 -> openidconnect 4.0 -> rsa`, reachable from
    # hort-worker (`cargo tree -i rsa -e normal`). hort uses sigstore
    # exclusively for OFFLINE bundle signature VERIFICATION — RS256/RSA
    # *public-key* operations against the Fulcio leaf certificate; it
    # never performs an RSA private-key operation and holds no RSA
    # private key, so the private-key timing sidechannel is not reachable
    # through our usage. No patched rsa release exists ("No safe upgrade
    # is available"), and rsa is not droppable without dropping sigstore
    # (the dual-file ignore fallback covers this).
    # NOTE: this used to be AUDIT-ONLY (rsa was reachable only via the
    # inactive `sqlx-mysql` feature, so cargo-deny's active-graph walk
    # never saw it). Adding the sigstore provenance stack moved rsa into
    # the active graph, so the ID is now MIRRORED in `deny.toml` — cargo-deny matches the ignore
    # there too. Re-evaluate if a fixed rsa ships, or if any RSA signing
    # (private-key) path is ever added.
    "RUSTSEC-2023-0071",

    # REGISTRY-EXEMPT: RUSTSEC-2026-0387 — build-side acceptance only, with no
    # registry Exclusion: an Exclusion waives the finding for EVERY registry
    # consumer (the nuclear option, issue #80). If hort's own crates-proxy
    # scan ever rejects crypto-bigint for a CI dependency build, the remedy is
    # moving off the version, not a registry mirror.
    #
    # crypto-bigint 0.5.5 — multiple timing variability issues in operations
    # intended to be constant-time (RUSTSEC-2026-0387). Enters the ACTIVE
    # build graph via `sigstore 0.14 -> openidconnect 4.0 -> p256/p384 0.13
    # -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5`, reachable from
    # hort-worker (`cargo tree -i crypto-bigint@0.5.5 -e normal`).
    #
    # Not fixable here, on three independent counts:
    #   * The advisory's patched range is `>= 0.7.6`; there is NO patched
    #     0.5.x release, so no lockfile move clears it. The graph's OTHER
    #     instance — 0.7.5, via the keyed-cosign `p256 0.14` stack — IS
    #     patched, and was moved to 0.7.6 rather than covered by this entry.
    #   * sigstore 0.14.0 is its newest release.
    #   * `openidconnect` is not droppable by feature selection: sigstore's
    #     own feature graph routes `verify -> fulcio -> oauth ->
    #     dep:openidconnect`, and `verify` is the whole reason the adapter
    #     exists. It already builds `default-features = false` with only
    #     verify / sigstore-trust-root / rustls-tls.
    #
    # Why the residual risk is accepted: timing variability in constant-time
    # primitives is exploitable where a SECRET scalar passes through them.
    # hort only ever VERIFIES — ECDSA verification consumes a public key, a
    # signature and a message hash — and holds no signing key (sigstore's
    # `sign` feature is deliberately off, see the adapter's Cargo.toml). This
    # is the same argument the rsa / RUSTSEC-2023-0071 entry above records,
    # for the same sigstore -> openidconnect chain.
    #
    # Known cost: both gates ignore by advisory ID, not by version, so this
    # also masks a future UNPATCHED 0.7.x should one re-enter the graph.
    # Re-evaluate when a sigstore release moves off the 0.13 elliptic-curve
    # line, or if any ECDSA SIGNING path is ever added.
    "RUSTSEC-2026-0387",
]

# Yanked-crate posture — surfaced, but non-blocking. Mirrors `deny.toml`'s
# `yanked = "warn"` so the two gates agree.
#
# A yank on crates.io is a maintainer withdrawing a version. It is NOT a
# vulnerability (it carries no RUSTSEC advisory — genuine advisories are caught
# by the checks above and block regardless), and NOT a deletion (the exact
# locked version stays downloadable, so an already-pinned build is unaffected).
# Without this stanza cargo-audit reports a yank as a warning and CI's
# `--deny warnings` escalates it to a hard build failure. Neither cargo-audit
# nor cargo-deny supports a *per-crate* yanked exemption (yanked is not an
# advisory ID, so the `ignore` list above does not apply to it) — only this
# blanket switch — so a hard block would red the build on an upstream-controlled,
# often-transient signal for which there may be no upgrade path to clear it.
# `cargo deny` remains the visible yanked reporter (a warning on every run), so
# a withdrawal is never silent; it just does not block. This posture is outside
# `scripts/check-advisory-sync.sh` (that script enforces `ignore`/Exclusion
# parity over advisory IDs, of which a yank is none).
[yanked]
enabled = false
