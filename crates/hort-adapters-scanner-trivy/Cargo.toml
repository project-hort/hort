[package]
name = "hort-adapters-scanner-trivy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hort outbound adapter — Trivy filesystem scanner (ScannerPort impl)"
# Not published: the release set is every member whose `publish` names a registry.
publish = false

[lints]
workspace = true

[dependencies]
hort-domain = { workspace = true }

tokio      = { workspace = true, features = ["process", "io-util", "fs", "macros", "rt-multi-thread"] }
futures    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
bytes      = { workspace = true }
tempfile   = { workspace = true }
thiserror  = { workspace = true }
# Archive extraction for scan materialisation. Trivy's filesystem mode
# does not open archives, so a wheel / npm tarball / `.crate` / OCI layer
# has to be unpacked on disk before any analyzer sees it. `deny.toml`'s
# `[bans]` rule names this crate as a `wrappers` exception alongside
# `hort-formats`: that crate's `archive_bounds` helper reads one entry
# into memory and has no extract-to-disk API, and this adapter depends
# only on `hort-domain` per the scanner-port contract, so it cannot reach
# it. The equivalent caps (extracted bytes, entry count, compression
# ratio) plus path- and link-containment live in `src/extract.rs`.
tar        = { workspace = true }
zip        = { workspace = true }
flate2     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }

[features]
# Optional: integration tests against a real `trivy` CLI on PATH.
# Default off — CI environments without trivy installed must build green.
trivy-cli = []
