[package]
name = "hort-http-subscriptions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hort inbound HTTP adapter for the /api/v1/subscriptions CRUD surface"
# Not published: the release set is every member whose `publish` names a registry.
publish = false

[lints]
workspace = true

[dependencies]
hort-domain    = { workspace = true }
hort-app       = { workspace = true }
hort-http-core = { workspace = true }

axum         = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
url          = { workspace = true }
thiserror    = { workspace = true }

[dev-dependencies]
tokio                       = { workspace = true, features = ["test-util"] }
hort-app                      = { path = "../hort-app", features = ["test-support"] }
hort-http-core                = { path = "../hort-http-core", features = ["test-support"] }
tower                       = { workspace = true }
arc-swap                    = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
