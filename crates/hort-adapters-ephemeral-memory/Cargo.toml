[package]
name = "hort-adapters-ephemeral-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-memory adapter for the EphemeralStore port — dashmap-backed, background TTL evictor"
# Published to the hort-crates registry. The allow-list is affirmative on
# purpose: an absent `publish` key means "any registry", which would let a
# new member join the published set silently and would let a stray
# `cargo publish` push this crate to crates.io.
publish = ["hort-crates"]

[lints]
workspace = true

[dependencies]
hort-domain = { workspace = true }
# `MeteredEphemeralStore::new` takes `EphemeralKeyspaceClass`
# (defined in `hort-app::ephemeral_keyspace`) so every metric series
# carries the `class={evictable|durable}` label. Pure data import —
# no I/O brought in.
hort-app    = { workspace = true }

tokio       = { workspace = true, features = ["sync", "time", "rt"] }
bytes       = { workspace = true }
dashmap     = { workspace = true }
metrics     = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
metrics-util = { workspace = true, features = ["debugging"] }
