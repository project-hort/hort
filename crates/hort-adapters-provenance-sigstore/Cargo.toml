[package]
name = "hort-adapters-provenance-sigstore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hort outbound adapter — Sigstore/cosign offline-bundle provenance verifier (ProvenancePort impl)"
# Not published: the release set is every member whose `publish` names a registry.
publish = false

[lints]
workspace = true

[dependencies]
hort-domain = { workspace = true }
hort-config = { workspace = true }
hort-app    = { workspace = true }

# `reqwest` is the workspace-pinned 0.13 (batch 7, #102 — unified with the
# `sigstore` crate's own transitive `reqwest 0.13`; before that bump this was
# 0.12, deliberately separate from `sigstore`'s 0.13). The ONLY live HTTP
# client this adapter builds is the periodic TUF trust-root refresh
# (`extra_ca.rs` + `reqwest::Client::builder()` per ADR 0010); the verify
# path is fully offline. NOTE: `sigstore` also has its own built-in TUF
# (`SigstoreTrustRoot::new`) path, which this adapter deliberately does NOT
# use (it calls `reqwest::Client::new()` internally — the exact ADR 0010
# anti-pattern). We fetch the trusted-root bytes with our own
# ADR-0010-compliant client and hand them to
# `from_trusted_root_json_unchecked`.
reqwest    = { workspace = true }
serde_json = { workspace = true }
hex        = { workspace = true }
# NOT the workspace `sha2` (0.11). `sigstore`'s only public offline-verify
# entry point, `Verifier::verify_digest(input_digest: Sha256, …)`, takes a
# `sha2` hasher *by value* and finalizes it itself, so the hasher this crate
# constructs must be the very same `sha2` major `sigstore` compiles against
# (`^0.10`). A workspace-major hasher is a different type and does not
# satisfy the signature. This pin moves only when `sigstore` moves — the
# same upstream coupling that holds `x509-cert`/`const-oid` below.
sha2       = "0.10"
chrono     = { workspace = true }
# Adapter-layer observability (ADR 0027 §9): a `debug!` records which
# fail-closed branch a Rekor-inclusion rejection took (never key bytes).
tracing    = { workspace = true }

# Sigstore verification primitives (ADR 0027). Offline bundle verify
# against an injectable trust root (`ManualTrustRoot` / `SigstoreTrustRoot::
# from_trusted_root_json_unchecked`) + the `bundle::Bundle` (protobuf-specs)
# parser. `verify` + `bundle` + `sigstore-trust-root` features; `rustls-tls`
# (NOT native-tls) to match the workspace rustls posture. We do NOT enable any
# feature that requires live TUF on the verify path.
# `cosign` is deliberately NOT enabled: the verify path is entirely
# `sigstore::bundle::verify::{Verifier, policy}` + `sigstore::bundle::Bundle`
# (never `sigstore::cosign::*`), so the cosign sign/registry-client feature is
# dead weight — dropping it prunes ~20 transitive crates (the cosign OCI/
# registry client tree) with no code change. Verified: adapter tests + worker/
# server build green without it. (`reqwest 0.13` + `oauth2` are NOT droppable —
# sigstore's `bundle`/`verify` core pulls them regardless; `sigstore-trust-root`
# is kept for the library-blessed `from_trusted_root_json_unchecked` loader
# rather than hand-rolling a `ManualTrustRoot` over the root of trust.)
#
# The `bundle` convenience feature is NOT used: it is exactly `sign + verify`,
# and hort holds no signing key — it only ever verifies. `sigstore::bundle`
# itself is gated on `any(sign, verify)`, so `verify` alone still yields
# `bundle::Bundle` and `bundle::verify::*`, which is the entire surface this
# adapter touches. Dropping `sign` also drops sigstore's signing-side
# `ecdsa`/`p256`/`signature` deps. It is load-bearing rather than cosmetic:
# `sigstore::bundle::sign` calls `der::Any::new(tag, String::as_ref())`, whose
# `impl Into<Box<[u8]>>` argument becomes inference-ambiguous as soon as
# `hybrid-array`'s `alloc` feature is active anywhere in the same graph (it
# adds a competing `From<&Array<T, U>> for Box<[T]>`). The keyed cosign
# adapter's `p256 0.14` stack turns that feature on, so a graph carrying both
# cannot compile sigstore's sign module at all.
sigstore = { version = "0.14.0", default-features = false, features = [
    "verify",
    "sigstore-trust-root",
    "rustls-tls",
] }
# The bundle / trust-root protobuf types (`Bundle`, the verification-
# material content oneof, the message-vs-DSSE content oneof) live here.
# Pinned to the same `0.5` major `sigstore` 0.14 depends on so the
# `Bundle` type unifies (no duplicate-type mismatch across the boundary).
sigstore_protobuf_specs = { version = "0.5", default-features = false }
# Identity extraction from the verified Fulcio leaf certificate. Pinned to
# the same majors sigstore 0.14 uses so the `x509_cert::Certificate` types
# unify (no duplicate-type mismatch).
#
# These two majors are NOT independently bumpable, and the constraint is
# upstream rather than a matter of local adaptation:
#   * `x509-cert 0.3` — `verifier.rs` implements sigstore's
#     `bundle::verify::policy::VerificationPolicy`, whose method signature
#     is `fn verify(&self, cert: &x509_cert::Certificate)` against
#     sigstore's own `x509-cert ^0.2`. Bumping ours resolves a *second*
#     `x509-cert` into the graph and the impl stops satisfying the trait
#     (E0053/E0308 "multiple different versions of crate `x509_cert`").
#     Only a sigstore release that itself moves to 0.3 unblocks this.
#   * `const-oid 0.10` — `ObjectIdentifier` gains a `MAX_SIZE` const
#     generic there, so it no longer unifies with the `ObjectIdentifier`
#     reached through `x509-cert 0.2` → `der 0.7` → `const-oid 0.9` that
#     `identity.rs` compares extension OIDs against. It moves only with
#     `x509-cert`, which moves only with `sigstore`.
x509-cert = { version = "0.2", default-features = false, features = ["std", "pem"] }
const-oid = { version = "0.9", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
# Self-signed root generation for the extra-CA apply test (same fixture
# pattern as hort-adapters-advisory-osv — no committed PEM).
rcgen = "0.14"
# In-process HTTP server for the TUF trust-root refresh fetch test (the
# only live-HTTP path in the crate). Same dev-dep the OSV adapter uses.
wiremock = "0.6"
# Test-only: synthesize a valid single-/two-leaf Rekor Merkle inclusion
# proof + signed checkpoint to prove `inclusion::verify_inclusion` runs the
# real RFC-6962 fold + ECDSA P-256 checkpoint-signature path (no network,
# no committed key). `aws-lc-rs` is the workspace-standard crypto provider
# (the same one `sigstore`/`jsonwebtoken` use, already in the locked graph
# — adds no new transitive crate); `base64` (the `"0.22"` workspace line)
# encodes the checkpoint root + signature into the signed-note envelope.
# Both are dev-deps in sibling adapter crates (oidc / upstream-http / k8s).
aws-lc-rs = "1.16"
base64 = "0.23"
