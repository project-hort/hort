[package]
name = "hort-adapters-provenance-cosign-key"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "hort outbound adapter — keyed (pinned-public-key) cosign provenance verifier (ProvenancePort impl), ADR 0039"
# Not published: the release set is every member whose `publish` names a registry.
publish = false

[lints]
workspace = true

[dependencies]
hort-domain = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# Adapter-layer observability (which fail-closed branch a keyed rejection took;
# NEVER key bytes / signatures / payloads).
tracing    = { workspace = true }
# ECDSA P-256 verification (the cosign default key type) + PEM SPKI public-key
# parsing. The minimal keyed primitive — NOT the sigstore bundle/PKI crate
# (ADR 0039 Consequences: a smaller advisory surface on the keyed path). p256
# and its ecdsa/pkcs8/spki/sec1 deps are already in the locked graph (the
# sigstore adapter's transitive tree).
#
# `sigstore 0.14` (and `openidconnect 4`) require `p256 ^0.13`, so this 0.14
# pin resolves a second ECDSA stack alongside the old one (ecdsa 0.17,
# elliptic-curve 0.14, crypto-bigint 0.7, primefield/primeorder 0.14, sec1
# 0.8, rfc6979 0.6) until sigstore moves and the two consolidate.
# Verification semantics are identical across the 0.13 → 0.14 jump —
# `NistP256` sets `NORMALIZE_S = false` in both, so neither major enforces
# low-S on verify.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Test-only keypair generation (prove the verify path runs real ECDSA against
# a freshly generated key, no committed key material) goes through
# `p256::elliptic_curve::Generate::generate()`, which draws from the system
# RNG via the `std` feature above — no separate RNG dev-dependency.
