# GitLab CI/CD pipeline for Hort.
#
# Scope: the hexagonal workspace in `crates/` (hort-domain, hort-app,
# hort-adapters-*, hort-http-core, hort-http-<format>, hort-formats,
# hort-server, hort-worker).
#
# Stages: lint, unit tests, coverage, integration, cargo audit / cargo-deny,
# the SonarQube gate, container image builds (hort-server + hort-worker,
# buildah + cosign), the Helm chart publish, and the release SBOM.

# Shared Rust compiler cache (sccache -> Garage S3), opted into by the compile-heavy
# test jobs below via `extends: [.sccache]`. Secretless: GitLab OIDC -> Vault JWT
# (role gitlab-ci-sccache) mints a read-only, single-path token for the S3 creds at
# job time. Fail-safe: if Vault/S3 is unreachable or sccache is absent, the before_script
# leaves RUSTC_WRAPPER unset and the job builds WITHOUT the cache instead of failing.
# Only unit/integration opt in; lint and coverage stay off (sccache breaks
# clippy-driver and llvm-cov instrumentation) and the buildah image builds compile
# inside the Docker build, where RUSTC_WRAPPER doesn't reach.
include:
  - component: gitlab.kdp.kloni.cloud/idp/components-catalog/supply-chain/sccache@v0.8.0

stages:
  - test
  - security
  - quality
  - build-images
  - helm
  - release

# ---------------------------------------------------------------------------
# Pipeline scope (issue #38)
# ---------------------------------------------------------------------------
#
# Run a pipeline for:
#   - MR events — feature branches get CI via their merge request ONLY; a push
#     to the source branch re-runs the MR pipeline while the MR is open;
#   - every push to the integration trunks `main` / `develop` and the
#     long-lived `release/*` maintenance branches;
#   - any tag (`v*` finals/pre-releases AND the `test/*` alpha tags).
# NOT for: a feature-branch push with no open MR, or a commit to a `test/*`
# branch — those build only when their tag is set/moved. When a branch has an
# open MR we keep the MR pipeline and suppress the duplicate branch pipeline,
# so a single push doesn't run CI twice.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Doc-only skip (backlog 024 / issue #24)
# ---------------------------------------------------------------------------
#
# Backlog-commit / coordination-only pushes to develop were running the full
# build/test/lint/security/quality/image pipeline for a markdown-only diff.
# `changes:` can only express a positive match, so this is the code/build/CI
# side of the architect-finalized doc-vs-code split (backlog/024): a path
# matching this list runs the gated jobs; anything else — including a path
# on neither side of the split — skips them. That residual case (see the
# DEVIATION note below) is the one place this mechanism can't fully honour
# "unrecognized path -> fail safe to full run"; GitLab `changes:` has no way
# to express that directly. Mitigate by listing broad code/build roots
# (whole directories) rather than individual files, so newly-added files
# under an existing code root are covered automatically.
#
# `.gitlab-ci.yml` is deliberately IN this list — editing the pipeline
# definition must always re-run the full pipeline against itself.
#
# DEVIATION from the backlog-024 path split as literally written: it lists
# `.gitlab-ci.yml` but not the rest of `.gitlab/**`, and doesn't mention
# `sonar-project.properties`. Both are directly executed/read by jobs this
# list gates — `.gitlab/ci/cosign-setup.sh` / `cosign-sign.sh` are sourced by
# `.docker` (build-images:*) and `release:sbom`; `sonar-project.properties`
# is the static-analysis config `quality:sonar`'s scanner auto-reads. Neither
# path matches the doc-only set either, so under the literal finalized list
# they'd fall through a `changes:` positive-match gap: not doc, not code,
# silently skipped — a concrete violation of this directive's own fail-safe
# constraint ("any path not in the doc-only set runs the full pipeline"),
# not a stylistic preference. Added both at the time (backlog/024); the rest
# of the then-uncovered top-level paths were deliberately left for the
# architect to triage rather than decided unilaterally — that triage is the
# rest of this comment (backlog/026, issue #26).
#
# backlog/026 (issue #26) triage of the residual uncovered paths, plus
# `THIRD-PARTY-LICENSES.md`/`.json` (previously doc-side / uncovered — see
# below). The rule: a path is **code-side** only if editing it can change a
# heavy job's *output* (build, test, lint, attribution). Added here:
#   - `.dockerignore` — image-build context (buildah/`docker build`), same
#     rationale as the already-listed `docker/**`.
#   - `about/**/*` — cargo-about templates/config read by
#     `security:attribution-sync`, same rationale as the already-listed
#     `about.toml`.
#   - `THIRD-PARTY-LICENSES.md` / `.json` — the generated attribution
#     artifacts. `.md` previously matched the doc-only `**/*.md` glob, so a
#     lone hand-edit classified as doc-only and skipped its own
#     verification job; `.json` matched neither side. Both are code-side now
#     (the verification-*timing* half of this — re-checking on the
#     `develop → main` promotion / release pushes / tags regardless of path
#     classification — is issue #30's `security:attribution-sync` rescope,
#     not this anchor; the two are complementary, not overlapping).
#
# Left **skip-safe** (deliberately NOT in this list — inert to every GitLab
# job, so a lone edit correctly stays doc-only and skips the heavy jobs; not
# an oversight, do not re-litigate without re-running the same "does it
# change a heavy job's output?" test): `.github/**` (GitHub-only CI; no
# GitLab job reads it), `.agents/**` (auto-agents config), `.env.example`,
# `.gitguardian.yaml`, `.mergify.yml`, `renovate.json`, `install/**` (the CLI
# installer served at hort.rs — not built/tested by the Rust pipeline),
# `tools/**` (workspace-excluded — `exclude = ["tools/*"]` in the root
# `Cargo.toml`, so no `--workspace` job builds it), `.trivyignore`
# (grep-confirmed not referenced by any GitLab job — it is the suppression
# list for the Trivy publish gate in `.github/workflows/docker-publish.yml`,
# a GitHub Actions workflow triggered on `v*` tags independently of this
# GitLab-only path list, so it is correctly inert to every GitLab job).
.code-changed-paths: &code-changed-paths
  - "crates/**/*"
  - "Cargo.toml"
  - "Cargo.lock"
  - "migrations/**/*"
  - ".gitlab-ci.yml"
  - ".gitlab/**/*"
  - "sonar-project.properties"
  # deploy/ is split, not blanket-included (maintainer request, 2026-07-25:
  # pure ansible/operator-config edits must not run the full Rust
  # build+test). ONLY the deploy subtrees an actual CI job exercises count
  # as code:
  #   - deploy/helm/**            -> quality:helm-template-test + chart-pin-sync
  #   - deploy/compose/**         -> E2E stack + example-config fixtures
  #   - deploy/ansible/files/**   -> the gitops tree, walked by the Rust
  #                                  public_deploy_gitops_tree guard test
  #   - deploy/ansible/roles/fail2ban/** -> quality:fail2ban-regex-test
  # Everything else under deploy/ansible/ (roles, playbooks, inventory,
  # group_vars, README) has no CI coverage and rides the docs-only fast
  # path. RULE: if a future CI job starts exercising another deploy
  # subtree, add that subtree HERE in the same MR — a test-covered path
  # missing from this list silently skips its gate on targeted MRs.
  - "deploy/helm/**/*"
  - "deploy/compose/**/*"
  - "deploy/ansible/files/**/*"
  - "deploy/ansible/roles/fail2ban/**/*"
  - "docker/**/*"
  - ".dockerignore"
  - "scripts/**/*"
  - ".cargo/**/*"
  - "rust-toolchain.toml"
  - "deny.toml"
  - ".clippy.toml"
  - "rustfmt.toml"
  - "about.toml"
  - "about/**/*"
  - "THIRD-PARTY-LICENSES.md"
  - "THIRD-PARTY-LICENSES.json"

# Shared rule template for jobs with no other rules: `!reference`'d as
# `<<: [*other-anchor, *rules-code-changed]` (YAML merge; GitLab supports
# merging multiple mapping anchors this way, same as `.rust-cache` below).
# Tag pipelines always run full — releases stay fail-safe-full regardless of
# what changed (backlog pitfall #2: `changes:` is not reliable/meaningful for
# tag pipelines, so it's simply not used on that branch of the rule). MR and
# branch pipelines only run the job when the diff touches a code/build/CI
# path.
.rules-code-changed: &rules-code-changed
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *code-changed-paths
    - if: $CI_COMMIT_BRANCH
      changes: *code-changed-paths

# hort's static sites, project-hort.de (issue #78) + hort.rs (issue #77):
# anything that can change scripts/build-site.sh's output for EITHER site —
# the docs both are generated from, the root README (project-hort.de's
# landing-page content source), the installer scripts + cosign.pin
# (hort.rs's apex files, copied verbatim), the hort-cli README (one of
# hort.rs's four doc sources), and the site chrome/generator itself.
.site-changed-paths: &site-changed-paths
  - "docs/architecture/**/*"
  - "README.md"
  - "crates/hort-cli/README.md"
  - "install/**/*"
  - "site/**/*"
  - "scripts/build-site.sh"
  - "scripts/site/**/*"
  - "scripts/populate-dl-archive.sh"

.rules-site-changed: &rules-site-changed
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *site-changed-paths
    - if: $CI_COMMIT_BRANCH
      changes: *site-changed-paths

# Guaranteed-present, guaranteed-green job. GitLab's "pipelines must succeed"
# merge-check trap: if every job in a doc-only pipeline is gated out, the
# pipeline has zero jobs and some project settings then block the MR
# (backlog pitfall #1 / acceptance #4). This job carries no `rules:` (always
# runs, on every pipeline) so a doc-only pipeline is never empty — it costs
# nothing to also run it on code pipelines (no compile, no heavy image), and
# keeping it unconditional is simpler than deriving "was anything else
# skipped" via a second copy of the path list.
docs-only:ok:
  stage: test
  image: alpine:3.24
  needs: []
  script:
    - "true"

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------

variables:
  # Route CI deps through registry.hort.rs — cargo, npm and the OCI client all
  # resolve from hort instead of their public upstreams. Set to exactly "true"
  # to enable; any other value (absent, empty, "false") is treated as disabled
  # so merging before the live instance exists does not break CI. Mirrors the
  # gate in .github/actions/hort-auth/action.yml.
  #
  # Enabling this is only safe once the vetted index serves the ENTIRE
  # Cargo.lock: the index hides versions hort has not ingested-and-released,
  # so a cold or still-quarantined dependency fails every cargo job with
  # "failed to select a version". `prefetch:verify` reports that readiness.
  HORT_PROXY_ENABLED: ""
  # Allow jobs to mint a hort bearer WITHOUT repointing any dependency source
  # — the prefetch warm/verify jobs and nothing else. Safe to leave on
  # permanently: warming is what eventually makes HORT_PROXY_ENABLED viable.
  HORT_PREFETCH_ENABLED: ""
  # OCI registry host for images AND Helm charts. REQUIRED for the
  # build-images / helm-publish / sign jobs — no default (the former
  # internal-mirror value only resolved on the original runner). Set as
  # a CI/CD variable; to publish to this GitLab instance's own registry set
  # REGISTRY=$CI_REGISTRY. See docs/ci/README.md.
  REGISTRY: ""
  # Image path namespace: images at ${REGISTRY}/${IMAGE_PREFIX}/hort-{server,worker},
  # charts at ${REGISTRY}/${IMAGE_PREFIX}/charts. Portable default — override
  # only to publish under a different namespace.
  IMAGE_PREFIX: "hort"
  # Registry credentials. Resolution precedence (see .resolve-registry-creds):
  # explicit REGISTRY_USER / REGISTRY_PASSWORD CI vars → a /secrets/zot
  # secret-file mount (if the runner provides one) → GitLab's built-in
  # $CI_REGISTRY_USER / $CI_REGISTRY_PASSWORD. Set as masked CI/CD variables,
  # or rely on the $CI_REGISTRY_* fallback.
  #
  # Internal-PKI CA trusted before any TLS call to the registry / Vault. Empty
  # by default — public-CA registries need nothing. Set to the in-runner path of
  # a mounted internal CA cert to enable the trust step; it no-ops if the file
  # is absent.
  PLATFORM_CA_PATH: ""
  # Image / SBOM signing strategy — see docs/ci/README.md.
  #   keyless (default): Sigstore/Fulcio/Rekor via the GitLab OIDC id_token —
  #                      works on any GitLab with reach to public Sigstore.
  #   vault-key:         offline cosign key fetched from Vault/OpenBao; requires
  #                      the VAULT_* CI vars (no portable defaults).
  #   none:              skip signing entirely.
  SIGNING_MODE: "keyless"
  # Internal registry host for the CI tool images below (ci/rust-ci,
  # ci/buildah-cosign). Its own variable so the same pipeline works against
  # another instance, or a stock upstream image, by overriding this plus the
  # image variables that reference it — no hardcoded host anywhere else.
  CI_TOOLS_REGISTRY: "hort.kdp.kloni.cloud"
  # Tag of ci/rust-ci to build/test with, kept separate from the host so a
  # tool-image bump is a one-line change. See RUST_IMAGE below for what the
  # image ships.
  CI_RUST_IMAGE_TAG: "2026.8.115"
  # Project MSRV is 1.94.0 (see .clippy.toml); kept in lockstep with
  # `docker/Dockerfile.hort-server`'s `ARG RUST_VERSION` by
  # `scripts/check-rust-version.sh`. ci/rust-ci ships Rust 1.94.1,
  # cargo-llvm-cov, cargo-audit, cargo-deny, cargo-about, cargo-cyclonedx and
  # sccache — a superset of stock `rust:1.94.1-slim` — so it supersedes the
  # old ci/rust-sccache image and RUST_IMAGE and RUST_SCCACHE_IMAGE now both
  # point at it: lint/coverage/security (RUST_IMAGE) and the .sccache-extending
  # test:unit / test:integration (RUST_SCCACHE_IMAGE) share one image.
  RUST_IMAGE: "${CI_TOOLS_REGISTRY}/ci/rust-ci:${CI_RUST_IMAGE_TAG}"
  # FAST path (deliberate dev-cycle speedup): pre-baked image with sccache on
  # PATH, used by the test jobs that extend .sccache. FALLBACK: the
  # .sccache-install anchor (below) is a NO-OP when this image already ships
  # sccache, but installs it on a stock image — so hort is never HARD-dependent
  # on the custom image. To build without it (custom image unavailable, or off
  # our internal registry entirely), override BOTH RUST_IMAGE and
  # RUST_SCCACHE_IMAGE to a stock `rust:1.94.1-slim` (or newer) reference and
  # sccache plus every tool are installed inline instead. (The canonical
  # GitHub Actions build already runs stock — it cannot reach
  # ${CI_TOOLS_REGISTRY}.)
  RUST_SCCACHE_IMAGE: "${CI_TOOLS_REGISTRY}/ci/rust-ci:${CI_RUST_IMAGE_TAG}"
  SCCACHE_VERSION: "0.16.0"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"
  # Memory-budgeting for the Kubernetes runner. Unconstrained, rustc fans
  # out to num_cpus parallel jobs and the workspace's heavy crates
  # (axum/tokio/sqlx) push the build container's RSS past 8 GiB; with
  # `request: 0` on the pod, the kubelet evicts it first under node
  # memory pressure (the failure mode we hit). Two levers, both applied:
  #   1. Cap Cargo concurrency so peak RSS is bounded.
  #   2. Switch dev-profile debuginfo to line-tables-only — keeps useful
  #      backtraces, drops the bulk of debug-symbol RAM/disk cost.
  # Together these typically pull peak RSS from ~8 GiB to ~3–4 GiB.
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
  # Kubernetes pod resource requests/limits (consumed by the GitLab
  # Kubernetes executor). The `request` is what the scheduler reserves;
  # the `limit` caps runaway. Sized for `CARGO_BUILD_JOBS=2` with
  # line-tables-only debug. Postgres + helper sidecars get small
  # explicit budgets so the runner doesn't oversubscribe a borderline
  # node.
  KUBERNETES_CPU_REQUEST: "1"
  KUBERNETES_CPU_LIMIT: "2"
  KUBERNETES_MEMORY_REQUEST: "4Gi"
  KUBERNETES_MEMORY_LIMIT: "6Gi"
  KUBERNETES_SERVICE_CPU_REQUEST: "200m"
  KUBERNETES_SERVICE_CPU_LIMIT: "500m"
  KUBERNETES_SERVICE_MEMORY_REQUEST: "256Mi"
  KUBERNETES_SERVICE_MEMORY_LIMIT: "512Mi"
  KUBERNETES_HELPER_CPU_REQUEST: "100m"
  KUBERNETES_HELPER_CPU_LIMIT: "200m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------

.rust-cache: &rust-cache
  cache:
    key: "rust-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cargo/bin
      - .cargo/registry/index
      - .cargo/registry/cache
      - .cargo/git/db
      # target/ intentionally NOT cached: sccache (RUST_SCCACHE_IMAGE + .sccache)
      # is the compile cache. Caching target/ keyed on CI_COMMIT_REF_SLUG left a
      # permanent multi-GB cache.zip per branch AND per release tag -- ~330G of
      # mostly-dead archives on the runner's /cache. Keep only the small .cargo
      # crate-source dirs; sccache handles compilation reuse.

.rust-apt-deps: &rust-apt-deps
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends
      protobuf-compiler pkg-config libssl-dev ca-certificates curl git

# FALLBACK sccache install (resilience, NOT a replacement for RUST_SCCACHE_IMAGE):
# a NO-OP when the image already ships sccache (the fast pre-baked image), else
# installs the sccache binary on a stock ${RUST_IMAGE} so hort still builds if
# the custom image is unavailable. Runs after *rust-apt-deps (curl + ca-certs)
# and before the .sccache mixin. Best-effort: on ANY error the mixin sees sccache
# absent and skips RUSTC_WRAPPER -> the build still runs, just uncached.
.sccache-install: &sccache-install
  - |
    if ! command -v sccache >/dev/null 2>&1; then
      echo "sccache not in image — installing inline (fallback path)"
      _V="${SCCACHE_VERSION:-0.16.0}"; _A="sccache-v${_V}-x86_64-unknown-linux-musl"
      ( curl -fsSL "https://github.com/mozilla/sccache/releases/download/v${_V}/${_A}.tar.gz" \
          | tar -xz -C /tmp \
        && install -m0755 "/tmp/${_A}/sccache" /usr/local/bin/sccache \
        && sccache --version ) \
      || echo "sccache install failed — building uncached (fail-safe)"
    fi

# Fetch the PREBUILT cargo-binstall (a single static binary) into
# $CARGO_HOME/bin, so tool installs (`cargo binstall <tool>`) download a
# prebuilt release instead of compiling the tool from source every pipeline.
# Best-effort (`|| true`): if the fetch is unreachable, the per-tool install
# lines fall back to `cargo install` (source), so binstall is a pure
# accelerator and never a hard dependency of a gate. Requires curl on PATH.
.install-binstall: &install-binstall
  - curl -L --proto '=https' --tlsv1.2 -sSf
      https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh
      | bash || true

# Conditional internal-PKI CA trust. Two trust-store flavours: RHEL-family
# (the buildah image) and Debian/Alpine (rust:slim, alpine/helm). Both are
# no-ops when PLATFORM_CA_PATH is unset or the file is absent, so a public-CA
# registry needs no platform CA at all.
.platform-ca-rhel: &platform-ca-rhel
  - |
    if [ -n "${PLATFORM_CA_PATH:-}" ] && [ -f "${PLATFORM_CA_PATH}" ]; then
      echo "[ca] trusting ${PLATFORM_CA_PATH} (RHEL trust store)"
      cp "${PLATFORM_CA_PATH}" /etc/pki/ca-trust/source/anchors/platform-ca.crt
      update-ca-trust
    fi

.platform-ca-deb: &platform-ca-deb
  - |
    if [ -n "${PLATFORM_CA_PATH:-}" ] && [ -f "${PLATFORM_CA_PATH}" ]; then
      echo "[ca] trusting ${PLATFORM_CA_PATH} (Debian/Alpine trust store)"
      cp "${PLATFORM_CA_PATH}" /usr/local/share/ca-certificates/platform-ca.crt
      update-ca-certificates
    fi

# Resolve registry credentials without committing to a single source.
# Precedence: explicit REGISTRY_USER/REGISTRY_PASSWORD → the /secrets/zot
# secret-file mount (this deployment) → GitLab's built-in $CI_REGISTRY_*.
# Exported so a sourced cosign-setup.sh sees the same values.
.resolve-registry-creds: &resolve-registry-creds
  - |
    if [ -z "${REGISTRY_USER:-}" ] && [ -r /secrets/zot/username ]; then
      REGISTRY_USER="$(cat /secrets/zot/username)"
      REGISTRY_PASSWORD="$(cat /secrets/zot/password)"
    fi
    REGISTRY_USER="${REGISTRY_USER:-$CI_REGISTRY_USER}"
    REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    export REGISTRY_USER REGISTRY_PASSWORD

# Jobs without other rules now opt in to `.rules-code-changed` above, so
# fmt, clippy, unit tests, coverage, cargo-audit, and the sonar gate run on
# every pipeline (feature branch, MR, main, release, tag) EXCEPT a doc-only
# diff, which skips them (backlog 024). Integration tests stay additionally
# gated to main/master/release/tag via this anchor, now also composed with
# the code-changed path list on its branch arms — the tag arm stays
# unconditional (fail-safe-full, same reasoning as `.rules-code-changed`).
.rules-main-only: &rules-main-only
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-changed-paths
    - if: $CI_COMMIT_BRANCH == "master"
      changes: *code-changed-paths
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes: *code-changed-paths
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# registry.hort.rs proxy auth — id_tokens + tool config
# ---------------------------------------------------------------------------
#
# Gated by HORT_PROXY_ENABLED == "true" (default-off). The shell guard inside
# the before_script anchor is strict-equality so merging before the live
# instance exists does not break CI. Mirrors .github/actions/hort-auth.
#
# How it wires together:
#   • .hort-auth declares HORT_OIDC_TOKEN (aud: hort-server). Test/build
#     jobs pull it via id_tokens: !reference [.hort-auth, id_tokens].
#   • &hort-auth-steps is a before_script YAML anchor consumed as
#     - *hort-auth-steps in each job's before_script list.
#   • The buildah jobs (.docker) have their own id_tokens block;
#     HORT_OIDC_TOKEN is added there alongside VAULT/SIGSTORE tokens.
#
# Exchange endpoint (RFC 8693 token exchange, confirmed from exchange.rs):
#   POST https://registry.hort.rs/api/v1/auth/exchange
#   form-encoded: grant_type=urn:ietf:params:oauth:grant-type:token-exchange
#                 subject_token=$HORT_OIDC_TOKEN
#                 subject_token_type=urn:ietf:params:oauth:token-type:jwt
#   response: { "access_token": "..." }
#
# Cargo source (HORT_CARGO_SOURCE_REPO, default cargo-virtual): the virtual
# aggregation repo — own crates + crates.io mirror. For a hort deployment whose
# build predates the aggregation, set HORT_CARGO_SOURCE_REPO=crates-proxy to
# resolve against the crates.io pull-through directly.
.hort-auth:
  id_tokens:
    HORT_OIDC_TOKEN:
      aud: hort-server
  before_script: &hort-auth-steps
    - |
      # Two independent switches, deliberately separate:
      #   HORT_PREFETCH_ENABLED — mint a bearer so a job can call hort's API
      #     (the prefetch warm/verify jobs). Harmless: changes no toolchain
      #     configuration, so a job that resolves dependencies is unaffected.
      #   HORT_PROXY_ENABLED — additionally repoint cargo, npm and the OCI
      #     client at hort. This one changes where EVERY dependency in the
      #     job resolves from, so it is only safe once the vetted index can
      #     serve the whole lock; a version it does not serve yet fails the
      #     job the same way it fails a release publish.
      if [ "${HORT_PROXY_ENABLED:-}" = "true" ] || [ "${HORT_PREFETCH_ENABLED:-}" = "true" ]; then
        echo "[hort-auth] exchanging OIDC token for hort bearer token"
        _hort_url="${HORT_URL:-https://registry.hort.rs}"
        _hort_cargo_repo="${HORT_CARGO_SOURCE_REPO:-cargo-virtual}"
        _hort_gt="urn:ietf:params:oauth:grant-type:token-exchange"
        _hort_stt="urn:ietf:params:oauth:token-type:jwt"
        _hort_response=$(curl -sSf \
          -X POST "${_hort_url}/api/v1/auth/exchange" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          --data-urlencode "grant_type=${_hort_gt}" \
          --data-urlencode "subject_token=${HORT_OIDC_TOKEN}" \
          --data-urlencode "subject_token_type=${_hort_stt}")
        HORT_TOKEN=$(echo "${_hort_response}" \
          | grep -o '"access_token":"[^"]*"' \
          | cut -d'"' -f4)
        if [ -z "${HORT_TOKEN}" ]; then
          echo "[hort-auth] ERROR: no access_token in response (omitted)"
          exit 1
        fi
        echo "[hort-auth] token exchange succeeded"
      fi

      if [ "${HORT_PROXY_ENABLED:-}" = "true" ]; then
        # Cargo: sparse index via cargo-virtual (or crates-proxy fallback)
        mkdir -p .cargo
        # cargo >=1.74 requires a credential provider for auth-required
        # registries (hort's config.json advertises auth-required:true);
        # cargo:token reads CARGO_REGISTRIES_<NAME>_TOKEN.
        printf '[registry]\nglobal-credential-providers = ["cargo:token"]\n\n' \
          > .cargo/config.toml
        printf '[source.crates-io]\nreplace-with = "hort"\n\n' \
          >> .cargo/config.toml
        printf '[registries.hort]\nindex = "sparse+%s/cargo/%s/"\n\n' \
          "${_hort_url}" "${_hort_cargo_repo}" >> .cargo/config.toml
        # hort-crates: first-party hosted registry (cargo publish target)
        _hort_crates_idx="sparse+${_hort_url}/cargo/hort-crates/"
        printf '[registries.hort-crates]\nindex = "%s"\n' \
          "${_hort_crates_idx}" >> .cargo/config.toml
        # cargo sends the registry token verbatim as the Authorization header;
        # hort accepts only Bearer/Basic, so encode as HTTP Basic (dummy user).
        _cargo_b64="$(printf 'x:%s' "${HORT_TOKEN}" | base64 -w0)"
        export CARGO_REGISTRIES_HORT_TOKEN="Basic ${_cargo_b64}"
        export CARGO_REGISTRIES_HORT_CRATES_TOKEN="Basic ${_cargo_b64}"

        # npm: npm-proxy pull-through
        _hort_host="${_hort_url#https://}"
        printf 'registry=%s/npm/npm-proxy/\n' "${_hort_url}" > .npmrc
        printf '//%s/npm/npm-proxy/:_authToken=%s\n' \
          "${_hort_host}" "${HORT_TOKEN}" >> .npmrc

        # OCI: log in via buildah (dockerhub-proxy / quay-proxy mirror)
        if command -v buildah >/dev/null 2>&1; then
          echo "${HORT_TOKEN}" | buildah login "${_hort_host}" \
            --username hort-ci \
            --password-stdin
        fi
      else
        echo "[hort-auth] HORT_PROXY_ENABLED != 'true' — dependency sources unchanged"
      fi

# ===========================================================================
# Stage 1: test — fmt, clippy, unit tests, coverage, integration (reserved)
# ===========================================================================

# Test jobs in this stage run sequentially via `needs:` rather than in
# parallel. Order: lint → unit → coverage → integration. This trades
# wall-clock time for predictable resource use on the shared GitLab
# runners (one Rust compile at a time per pipeline).

# Parity with .github/workflows/ci.yml → lint-rust, but scoped to crates/.
test:lint:
  stage: test
  image: ${RUST_IMAGE}
  <<: [*rust-cache, *rules-code-changed]
  variables:
    # cargo clippy runs clippy-driver over workspace crates whose dependencies
    # (sqlx + its sqlx-macros proc-macro) are compiled by rustc; under
    # RUSTC_WRAPPER=sccache the wrapped-rustc artifacts don't resolve for
    # clippy-driver → E0463 "can't find crate for sqlx" and a cascade of
    # inference errors. Same wrapper-breaks-the-tool class as coverage/llvm-cov,
    # and clippy gets 0 sccache hits anyway — keep it off sccache (like coverage).
    RUSTC_WRAPPER: ""
  id_tokens: !reference [.hort-auth, id_tokens]
  before_script:
    # rust-apt-deps installs curl/ca-certificates; platform-ca-deb then trusts
    # the internal PKI CA (PLATFORM_CA_PATH) so hort-auth's OIDC exchange (curl)
    # can verify an internal-CA HORT_URL endpoint. Both precede hort-auth-steps.
    - *rust-apt-deps
    - *platform-ca-deb
    - *hort-auth-steps
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets -- -D warnings

# Parity with test-backend-unit, scoped to the rewrite.
test:unit:
  stage: test
  # Pinned to the higher-powered podman runner (issue #39): a compile-only
  # `--lib` job with no live service, so no runner-side per-build network is
  # needed. Reachability (internal image mirror, CA, Vault/S3 sccache) is
  # confirmed on that runner. `test:integration` stays on the default runner
  # until `FF_NETWORK_PER_BUILD` is set there (its Postgres `services:` alias).
  tags: [podman]
  extends: [.sccache]
  image: ${RUST_SCCACHE_IMAGE}
  <<: [*rust-cache, *rules-code-changed]
  needs:
    - job: test:lint
      artifacts: false
  id_tokens:
    # See test:lint - both tokens inline (extends:[.sccache] won't merge id_tokens).
    VAULT_ID_TOKEN:
      aud: "${VAULT_ADDR}"
    HORT_OIDC_TOKEN:
      aud: hort-server
  before_script:
    # rust-apt-deps installs curl/ca-certificates; platform-ca-deb then trusts
    # the internal PKI CA (PLATFORM_CA_PATH) so hort-auth's OIDC exchange (curl)
    # can verify an internal-CA HORT_URL endpoint. Both precede hort-auth-steps.
    # extends:[.sccache] replaces before_script; chain its sccache setup back in.
    - *rust-apt-deps
    - *sccache-install
    - *platform-ca-deb
    - *hort-auth-steps
    - !reference [.sccache, before_script]
  script:
    - cargo test --workspace --lib --verbose

# Parity with coverage. hort-domain/hort-app are pure Rust zero-I/O libraries
# and the adapter crates use runtime sqlx (no query! macros), so no
# Postgres service or migrations are needed to collect --lib coverage.
test:coverage:
  stage: test
  # Pinned to the podman runner (issue #39): `--lib` coverage with no live
  # Postgres service (see the DB-backed note below), so it pins like test:unit.
  tags: [podman]
  image: ${RUST_IMAGE}
  <<: [*rust-cache, *rules-code-changed]
  # Runs in PARALLEL with test:unit (issue #43): both gate only on test:lint.
  # Safe now that both compile-heavy jobs are pinned to the podman runner (#39);
  # the prior `needs: test:unit` chain only existed to avoid two concurrent
  # workspace compiles on the shared Platform runner.
  needs:
    - job: test:lint
      artifacts: false
  variables:
    # cargo-llvm-cov drives rustc directly; sccache or other wrappers break
    # instrumentation.
    RUSTC_WRAPPER: ""
  id_tokens: !reference [.hort-auth, id_tokens]
  before_script:
    # rust-apt-deps installs curl/ca-certificates; platform-ca-deb then trusts
    # the internal PKI CA (PLATFORM_CA_PATH) so hort-auth's OIDC exchange (curl)
    # can verify an internal-CA HORT_URL endpoint. Both precede hort-auth-steps.
    - *rust-apt-deps
    - *platform-ca-deb
    - *hort-auth-steps
    - rustup component add llvm-tools-preview
    - *install-binstall
    - |
      # Skip when the image already ships the tool; otherwise install and
      # FAIL if it is still missing. A swallowed install failure surfaces much
      # later as "no such command", long after the cause has scrolled away.
      if ! cargo llvm-cov --version >/dev/null 2>&1; then
        cargo binstall --no-confirm --locked cargo-llvm-cov \
          || cargo install --locked cargo-llvm-cov
      fi
      cargo llvm-cov --version >/dev/null 2>&1 || {
        echo "cargo llvm-cov unavailable: binstall and cargo install both failed" >&2
        exit 1
      }
  script:
    - cargo llvm-cov --workspace --lib
        --lcov --output-path lcov.info
    - cargo llvm-cov report --summary-only
    # Convert LCOV → SonarQube generic coverage XML. Kept alongside
    # lcov.info so the scanner can consume either via
    # sonar.rust.lcov.reportPaths or sonar.coverageReportPaths.
    - |
      awk '
      BEGIN { print "<coverage version=\"1\">" }
      /^SF:/ { file = substr($0, 4); printf "  <file path=\"%s\">\n", file }
      /^DA:/ { split(substr($0, 4), a, ","); printf "    <lineToCover lineNumber=\"%s\" covered=\"%s\"/>\n", a[1], (a[2]+0 > 0 ? "true" : "false") }
      /^end_of_record/ { print "  </file>" }
      END { print "</coverage>" }
      ' lcov.info > coverage-sonar.xml
  artifacts:
    when: always
    paths:
      - lcov.info
      - coverage-sonar.xml
    expire_in: 7 days

# DB-backed integration tests (`crates/*/tests/` + the inline `--lib` tests
# the unittest target builds). The Postgres service is wired so the
# hort-adapters-postgres / hort-adapters-storage suites run against a real
# database. Main / release / tags only, matching the GitHub CI gating.
test:integration:
  stage: test
  # Pinned to the podman runner (issue #39). Its Postgres `services:` alias
  # resolves there now that `FF_NETWORK_PER_BUILD=true` is set on the runner
  # (gitlab-runner-podman!29): each build gets its own bridge network so the
  # docker-executor-on-rootless-podman resolves `postgres` via netavark DNS.
  tags: [podman]
  extends: [.sccache]
  image: ${RUST_SCCACHE_IMAGE}
  <<: [*rust-cache, *rules-main-only]
  needs:
    - job: test:coverage
      artifacts: false
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: "artifact_registry"
    POSTGRES_USER: "registry"
    POSTGRES_PASSWORD: "registry"
    DATABASE_URL: "postgresql://registry:registry@postgres:5432/artifact_registry"
  id_tokens:
    # See test:lint - both tokens inline (extends:[.sccache] won't merge id_tokens).
    VAULT_ID_TOKEN:
      aud: "${VAULT_ADDR}"
    HORT_OIDC_TOKEN:
      aud: hort-server
  before_script:
    # rust-apt-deps installs curl/ca-certificates; platform-ca-deb then trusts
    # the internal PKI CA (PLATFORM_CA_PATH) so hort-auth's OIDC exchange (curl)
    # can verify an internal-CA HORT_URL endpoint. Both precede hort-auth-steps.
    # extends:[.sccache] replaces before_script; chain its sccache setup back in.
    - *rust-apt-deps
    - *sccache-install
    - *platform-ca-deb
    - *hort-auth-steps
    - !reference [.sccache, before_script]
    - apt-get install -y -qq --no-install-recommends postgresql-client
    - for i in $(seq 1 30); do pg_isready -h postgres -U "${POSTGRES_USER}" && break; sleep 1; done
  script:
    - cargo test --workspace --tests --verbose

# GitLab-side cargo-proxy warm + a scheduled readiness probe. develop lives
# on GitLab, so a GitLab-side warm reacts to a Cargo.lock change immediately
# instead of waiting for the GitHub twin (prefetch-warm.yml), which only
# fires on a develop push mirror / nightly schedule. Both jobs call
# scripts/ci/locked-registry-deps.sh and/or scripts/ci/vetted-index-
# preflight.sh — the same implementation release.yml's preflight uses, so
# the three call sites cannot drift.
#
# Invariant both jobs exist to work around: cargo-virtual is released_only
# (NonServableStatusFilter + IndexModeFilter, hort-http-cargo/src/serve.rs),
# so a build resolving THROUGH the vetted index cannot warm a cold dep
# itself — released_only hides the cold entry, so resolution fails before
# any fetch is even attempted. The prefetch POST is the only thing that
# warms; `cargo resolve`/`cargo build` only ever checks.
#
# Both grants below take effect only on the operator's Ansible apply, so
# both jobs treat a permission failure as a loud warning, never a pipeline
# failure — hence allow_failure: true on both, unconditionally.
prefetch:warm:
  stage: test
  image: alpine:3.24
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $HORT_PREFETCH_ENABLED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $HORT_PREFETCH_ENABLED == "true"'
  id_tokens: !reference [.hort-auth, id_tokens]
  before_script:
    - apk add --no-cache bash curl jq
    - *hort-auth-steps
  # This job also doubles as the GitLab<->hort OIDC federation probe (backlog
  # 097 §4): the federation is declared in gitops but its applied state on
  # registry.hort.rs is unverified, so this job's own output must distinguish
  # the three possible outcomes without any log spelunking.
  #
  #   1. exchange failed (no HORT_TOKEN) — *hort-auth-steps above already
  #      exits 1 in that case (before this `script:` even starts), so that
  #      outcome is reported from `after_script:` below instead, via
  #      CI_JOB_STATUS (the only signal available once before_script has
  #      already terminated the job).
  #   2. exchange OK, prefetch 403 — federation works, the
  #      gitlab-ci-prefetch-cargo-virtual.yaml grant just isn't applied yet.
  #   3. success — print queued / already_present / rejected.
  script:
    - |
      set -uo pipefail

      bash scripts/ci/locked-registry-deps.sh Cargo.lock > /tmp/locked.txt
      locked_count=$(wc -l < /tmp/locked.txt)
      items=$(jq -R -s -c '
        split("\n") | map(select(length > 0) | split(" ") | {package: .[0], version: .[1]})
      ' /tmp/locked.txt)

      echo "Warming ${_hort_cargo_repo} with ${locked_count} locked deps…"
      # Body to a file, status via -w: the runner may execute this under
      # busybox sh (the image ships no bash until before_script installs it,
      # and shell selection happens before that), where bash's $'\n'
      # ANSI-C quoting is not portable.
      status=$(curl -sS -o /tmp/prefetch-response.json -w '%{http_code}' -X POST \
        "${_hort_url}/api/v1/repositories/${_hort_cargo_repo}/prefetch" \
        -H "Authorization: Bearer ${HORT_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"items\": ${items}}")
      body=$(cat /tmp/prefetch-response.json)

      case "${status}" in
        200)
          echo "${body}" | jq -r '"enqueued: \(.enqueued_job_ids | length)  already_held: \(.skipped_already_held | length)  rejected: \(.rejected_packages | length)  failed: \(.failed | length)" , (.rejected_packages[]? | "  rejected: \(.package) \(.version // "") — \(.reason // .message // "no reason given")") , (.failed[]? | "  failed: \(.package) \(.version // "") — \(.reason // .message // "no reason given")")'
          ;;
        403)
          # Federation worked (we got here — HORT_TOKEN was minted), but the
          # prefetch permission itself is missing: name the grant so the
          # operator knows exactly what Ansible apply to run.
          echo "::warning::prefetch POST rejected with 403 — the gitlab-ci-prefetch-cargo-virtual.yaml grant is not applied yet (federation itself is fine)"
          ;;
        *)
          echo "::warning::prefetch POST failed with HTTP ${status}: ${body}"
          ;;
      esac
  after_script:
    - |
      if [ "${CI_JOB_STATUS:-}" = "failed" ]; then
        echo "::warning::hort OIDC token exchange failed — the GitLab<->hort federation is not usable yet. Candidate causes: (1) the federation gitops is not applied yet, (2) an audience or jti claim mismatch between the GitLab id_token and hort's issuer envelope, (3) HORT_PROXY_ENABLED is not actually 'true' in this pipeline context."
      fi

# Read-only readiness probe: reports the complete cold set ahead of a
# release, without side effects (no prefetch POST — see
# scripts/ci/vetted-index-preflight.sh). Scheduled only — this is a
# pre-release signal an operator checks before cutting a release, not
# something every develop push needs to re-run.
prefetch:verify:
  stage: test
  image: alpine:3.24
  needs: []
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $HORT_PREFETCH_ENABLED == "true"'
  id_tokens: !reference [.hort-auth, id_tokens]
  before_script:
    - apk add --no-cache bash curl jq findutils
    - *hort-auth-steps
  script:
    - |
      set -uo pipefail

      if bash scripts/ci/locked-registry-deps.sh Cargo.lock \
          | HORT_TOKEN="${HORT_TOKEN}" bash scripts/ci/vetted-index-preflight.sh \
              "${_hort_url}" "${_hort_cargo_repo}"; then
        echo "prefetch:verify — every locked dep is served by ${_hort_cargo_repo} (release-ready)."
      else
        echo "::warning::prefetch:verify — cold deps listed above are not yet served by ${_hort_cargo_repo}; not release-ready. Re-run prefetch:warm (or wait for the next develop push) and let the quarantine window clear."
      fi

# ===========================================================================
# Stage 2: security — cargo audit (parity with GitHub security-audit)
# ===========================================================================
#
# cargo audit reads the workspace Cargo.lock against the live RustSec
# advisory DB, so a newly-published advisory against an already-pinned
# crate flips this gate red with no dependency change.

# `cargo audit --deny warnings` upgrades yanked/unmaintained/unsound from
# advisory to error. `security:advisory-sync` enforces parity between
# `.cargo/audit.toml` and `deny.toml`'s ignore lists.
security:cargo-audit:
  stage: security
  image: ${RUST_IMAGE}
  # No workspace compile — `cargo audit` reads Cargo.lock and the tool is a
  # prebuilt binstall download — so this runs from pipeline start rather than
  # queuing behind the serialized test-compile chain.
  needs: []
  <<: *rules-code-changed
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates git pkg-config libssl-dev curl
    - *install-binstall
    - |
      # Skip when the image already ships the tool; otherwise install and
      # FAIL if it is still missing. A swallowed install failure surfaces much
      # later as "no such command", long after the cause has scrolled away.
      if ! cargo audit --version >/dev/null 2>&1; then
        cargo binstall --no-confirm --locked cargo-audit \
          || cargo install --locked cargo-audit
      fi
      cargo audit --version >/dev/null 2>&1 || {
        echo "cargo audit unavailable: binstall and cargo install both failed" >&2
        exit 1
      }
  script:
    # Diagnostic JSON artefact captured first; failure-tolerant (||
    # true) so a non-zero exit still produces the upload below.
    - cargo audit --json > cargo-audit.json || true
    # Blocking gate — `--deny warnings` upgrades yanked / unmaintained /
    # unsound from advisory to error. The advisory-ignore list is the
    # `.cargo/audit.toml` SSoT. No `--ignore`
    # flags here: duplicating IDs in CI commands invited drift —
    # someone adds an ID to the toml and forgets the workflow, the gate
    # is still load-bearing but not self-documenting. The
    # `scripts/check-advisory-sync.sh` job below enforces parity
    # between `.cargo/audit.toml` and `deny.toml`'s `[advisories.ignore]`.
    - cargo audit --deny warnings
  artifacts:
    when: always
    paths:
      - cargo-audit.json
    expire_in: 7 days

# Lightweight gate that runs on every push: confirms `.cargo/audit.toml`
# and `deny.toml`'s `[advisories.ignore]` are byte-identical sets. The
# single source of truth is `.cargo/audit.toml`; this gate prevents
# accidental drift. Plain bash + grep, no extra image deps required.
security:advisory-sync:
  stage: security
  image: ${RUST_IMAGE}
  needs: []
  <<: *rules-code-changed
  script:
    - bash scripts/check-advisory-sync.sh

# Third-party attribution staleness + allowlist-parity gate. Regenerates
# THIRD-PARTY-LICENSES.{md,json} via `cargo about generate` and diffs against
# the committed copies (stale ⇒ fail), and asserts `about.toml`'s `accepted`
# license list matches `deny.toml`'s `[licenses] allow` list. No workspace
# compile — cargo-about is a prebuilt binstall download reading `cargo
# metadata` — so this runs from pipeline start like the other security:* gates.
#
# Scoped to release-relevant pipelines only (issue #30), NOT `.rules-code-changed`
# like its security:* siblings: attribution is a property of the shipped
# artifact (embedded via `include_str!`, ADR 0047), so it's verified where a
# public/internal artifact can actually be built, not on every code-touching
# MR. Without this, a Renovate dep-bump MR changes the dep graph, the
# committed attribution goes stale, and the job fails deterministically on
# every such MR even though nothing ships from it. A stale attribution still
# cannot ship: the develop → main promotion MR, main/release/* pushes, and
# every v* tag all re-verify it before any artifact is built — only
# internal, non-shipping pipelines (feature/Renovate MRs, develop-targeting
# MRs, ordinary develop pushes) stop running it. No `changes:` filter on any
# arm — always verify before a release-relevant build, regardless of what
# changed.
security:attribution-sync:
  stage: security
  image: ${RUST_IMAGE}
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|release\/)/'
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates git pkg-config libssl-dev curl python3
    - *install-binstall
    - |
      # Skip when the image already ships the tool; otherwise install and
      # FAIL if it is still missing. A swallowed install failure surfaces much
      # later as "no such command", long after the cause has scrolled away.
      if ! cargo about --version >/dev/null 2>&1; then
        cargo binstall --no-confirm --locked cargo-about \
          || cargo install --locked cargo-about --features cli
      fi
      cargo about --version >/dev/null 2>&1 || {
        echo "cargo about unavailable: binstall and cargo install both failed" >&2
        exit 1
      }
  script:
    - bash scripts/check-attribution.sh

# No-plans gate (D7): `docs/plans/` is the branch-lifetime home for design docs
# + backlogs, distilled into `docs/adr/` + `docs/architecture/` and removed
# before they reach main. Runs PRE-MERGE on every MR to a protected branch:
#   - MR to main    → HARD FAIL (plans must be gone before main).
#   - MR to develop → WARNING only (plans may ride into integration; non-blocking).
# Plus a post-merge backstop on the default branch (a fail). `exit 2` is the
# allowed-failure (warning) code; `exit 1` is a hard fail. Plain bash, no deps.
quality:no-plans-on-default-branch:
  stage: quality
  image: ${RUST_IMAGE}
  needs: []
  rules:
    # Pre-merge gate: any MR targeting a protected branch.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^(main|develop)$/'
    # Post-merge backstop on the default branch (direct push / bypassed MR).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  # exit 2 → allowed failure (yellow "warning", non-blocking) on MRs to develop;
  # any other non-zero (exit 1) is a hard fail (blocks the merge to main).
  allow_failure:
    exit_codes:
      - 2
  script:
    - |
      if [ -d docs/plans ] && [ -n "$(ls -A docs/plans 2>/dev/null)" ]; then
        target="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_COMMIT_BRANCH}"
        echo "docs/plans/ is present. Offending entries:"
        ls -A docs/plans
        if [ "$target" = "develop" ]; then
          echo "WARNING: docs/plans/ on an MR to develop — allowed during integration,"
          echo "but it MUST be distilled into docs/adr/ + docs/architecture/ and removed"
          echo "before reaching main (the MR to main will FAIL otherwise)."
          exit 2
        fi
        echo "ERROR: docs/plans/ would land on main (D7). Distil the durable decisions"
        echo "into docs/adr/ + docs/architecture/ and remove docs/plans/ before merging."
        exit 1
      fi
      echo "OK: no docs/plans/ present."

# cargo-deny gate. Runs the four sections in `deny.toml`: advisory floor,
# license allowlist, banned crates (openssl-sys, native-tls, wasmtime*),
# source pinning. The advisory ignore list is mirrored in
# `.cargo/audit.toml` so the two gates stay in agreement (enforced by
# `security:advisory-sync` above).
security:cargo-deny:
  stage: security
  image: ${RUST_IMAGE}
  # No workspace compile — `cargo deny check` reads `cargo metadata` and the
  # tool is a prebuilt binstall download — so this runs from pipeline start
  # rather than queuing behind the serialized test-compile chain.
  needs: []
  <<: *rules-code-changed
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates git pkg-config libssl-dev curl
    - *install-binstall
    - |
      # Skip when the image already ships the tool; otherwise install and
      # FAIL if it is still missing. A swallowed install failure surfaces much
      # later as "no such command", long after the cause has scrolled away.
      if ! cargo deny --version >/dev/null 2>&1; then
        cargo binstall --no-confirm --locked cargo-deny \
          || cargo install --locked cargo-deny
      fi
      cargo deny --version >/dev/null 2>&1 || {
        echo "cargo deny unavailable: binstall and cargo install both failed" >&2
        exit 1
      }
  script:
    - cargo deny --workspace check

# ===========================================================================
# Stage 3: quality — SonarQube/SonarCloud gate
# ===========================================================================
#
# Enforces coverage on new code >= 85% and duplication on new code <= 1%
# via the Sonar quality gate. The STATIC analysis config — source layout
# (`crates/`), exclusions, coverage report paths, and the test-key
# issue-ignore rules — lives in `sonar-project.properties` at the repo root
# (sonar-scanner auto-reads it); the job below passes only the dynamic
# host/token/projectKey + per-MR args. Configure SONAR_HOST_URL and
# SONAR_TOKEN as masked CI/CD variables. Optional: set SONAR_PROJECT_KEY
# (and SONAR_ORGANIZATION) to point at a different Sonar project on a
# local GitLab-hosted SonarQube.

quality:sonar:
  stage: quality
  # SonarQube is reachable only at its in-cluster service DNS
  # (sonarqube-sonarqube.sonarqube.svc.cluster.local), so this job must run on
  # an in-cluster runner. The `platform` tag selects the in-cluster Platform
  # Runner; without it the untagged job can land on an out-of-cluster runner
  # that cannot resolve the service hostname and fails at "query server version".
  tags:
    - platform
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  rules:
    # Skip Sonar on merge-request pipelines. Its quality gate scores coverage +
    # duplication on "new code", which has no meaning for the many MRs that
    # change no Rust (deploy / docs / CI) — those score 0% and block the MR. The
    # gate runs on the branch pipeline (develop / main / release / tags) instead,
    # which is the authoritative full-project analysis. MR-level coverage is
    # still enforced by the test:coverage job.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # Runs only when a Sonar token is configured, so installations without a
    # Sonar instance don't hard-fail the quality stage. Set SONAR_TOKEN (and
    # SONAR_HOST_URL) as masked CI/CD variables to enable. See docs/ci/README.md.
    # Split tag vs. branch (rather than the old bare `if: '$SONAR_TOKEN'`) so
    # this job's presence tracks `needs: test:coverage` exactly: tag pipelines
    # stay unconditional (fail-safe-full), branch pipelines gate on the same
    # code-changed path list test:coverage uses. Without this, a doc-only
    # branch pipeline would skip test:coverage but still try to run sonar,
    # which needs: test:coverage (not optional) — an unresolvable-needs error
    # at pipeline creation (backlog pitfall #3).
    - if: '$SONAR_TOKEN && $CI_COMMIT_TAG'
    - if: '$SONAR_TOKEN && $CI_COMMIT_BRANCH'
      changes: *code-changed-paths
  needs:
    - job: test:coverage
      artifacts: true
    - job: security:cargo-audit
      artifacts: true
      optional: true
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - |
      # Static analysis config (sources, tests, exclusions, coverage report
      # paths, and the test-key issue-ignores) lives in
      # sonar-project.properties at the repo root and is auto-read by
      # sonar-scanner. Only dynamic / secret args are passed here. This job runs
      # on branch pipelines only (see rules), so there is no pull-request mode.
      sonar-scanner \
        -Dsonar.host.url=${SONAR_HOST_URL} \
        -Dsonar.token=${SONAR_TOKEN} \
        ${SONAR_PROJECT_KEY:+-Dsonar.projectKey=$SONAR_PROJECT_KEY}

# Lint pin-sync between Cargo.toml MSRV / the hort-server Dockerfile rust
# toolchain; between the Helm chart values.yaml top-level keys / their
# per-section comment blocks; and between the worker container's
# OSV_SCANNER_VERSION / the native hort_systemd osv-scanner pin. The scripts are
# pure bash and finish in well under a second; they run on every pipeline (no
# rules / no needs:). Alpine has bash, grep, and yq is not required — the
# scripts use only POSIX awk/sed.
quality:chart-and-rust-pin-sync:
  stage: quality
  image: alpine:3.24
  needs: []
  <<: *rules-code-changed
  before_script:
    - apk add --no-cache bash grep
  script:
    - bash scripts/check-rust-version.sh
    - bash scripts/check-values-comments.sh
    - bash scripts/check-osv-scanner-version.sh

# Machine-readable G1 release-predicate gate. Fails unless the
# event-chain-verify and advisory-ingest telemetry rows are catalogued in
# docs/metrics-catalog.md, the named regression tests are present, and any
# published docs/compliance/ attestation stays at the tamper-EVIDENT bar.
# Pure bash + grep, sub-second, runs on every pipeline (no rules /
# no needs:) — same weight class as the pin-sync gate above.
quality:g1-attestation-gate:
  stage: quality
  image: alpine:3.24
  needs: []
  <<: *rules-code-changed
  before_script:
    - apk add --no-cache bash grep findutils sed
  script:
    - bash scripts/check-g1-attestation-gate.sh

# Chart-template render test. Mirrors .github/workflows/ci.yml's
# chart-template-tests job so the canonical GitLab pipeline gates chart
# regressions too (the harness previously ran only on the GitHub mirror
# path). It renders every deploy/helm/hort-server/test-values-*.yaml
# fixture via `helm template` and asserts the expected presence/absence of
# feature-gated lines — including the strict-schema / coupling fixtures
# that MUST fail to render. No chart dependencies, no registry, no image
# build (needs: []) → fast feedback before the build stages, on every
# pipeline (no rules — same scope as the pin-sync + g1 gates above). The
# alpine/helm image (shared with helm:lint-and-publish) carries helm; the
# harness needs bash + GNU grep/find (bash arrays + associative arrays,
# `grep -E \b`, `find -print0`) which busybox lacks.
quality:helm-template-test:
  stage: quality
  # entrypoint: [""] overrides the alpine/helm image's ENTRYPOINT ["helm"] so
  # the executor runs the job's shell directly. Without it, a podman-executor
  # runner launches the script as `helm sh …` → `unknown command "sh"`; only
  # the docker executor overrides the entrypoint implicitly. Matches quality:sonar.
  image:
    name: alpine/helm:3.21.3
    entrypoint: [""]
  needs: []
  <<: *rules-code-changed
  before_script:
    - apk add --no-cache bash grep findutils sed
  script:
    - bash scripts/test-helm-templates.sh

# Fail2ban regex regression test. Mirrors quality:helm-template-test: plain
# bash, lightweight image, needs: [], runs on every pipeline (no rules).
# Installs fail2ban (provides fail2ban-regex) then runs the fixture script
# that asserts 401/403 lines match and 200 lines do not.
quality:fail2ban-regex-test:
  stage: quality
  image: debian:13-slim
  needs: []
  <<: *rules-code-changed
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends fail2ban
  script:
    - bash scripts/test-fail2ban-regex.sh

# project-hort.de static site (issue #78): builds site/dist/ and runs the
# link-check that fails the build on any broken internal link or heading
# anchor. Output is an artifact for manual review only — never committed
# (site/dist/ is gitignored) and never deployed from here; deployment is the
# ansible `website` role (deploy/ansible/roles/website/), run by the
# operator. python3 is the ONLY tool this needs — see
# scripts/site/generate.py's module docstring for why (no pandoc, no pip,
# no npm-ecosystem SSG).
quality:site-build:
  stage: quality
  image: debian:13-slim
  needs: []
  <<: *rules-site-changed
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3
  script:
    - ./scripts/build-site.sh
    # populate-dl-archive.sh (issue #77) is not exercised by the site build
    # itself (it runs host-side, at ansible-deploy time, against live
    # GitHub releases — see its own header comment) — a syntax check here
    # is the cheap CI-side guard against a change to it breaking the gate
    # this path list also triggers on.
    - bash -n scripts/populate-dl-archive.sh
  artifacts:
    paths:
      - site/dist/
    expire_in: 3 days

# ===========================================================================
# Stage 4: build-images — buildah + cosign sign for hort-server
# ===========================================================================
#
# Reusable buildah/cosign template. Each image-build job extends `.docker` and
# inherits the buildah env, the OIDC id_tokens, the conditional platform-CA
# trust step, the registry login (creds resolved via .resolve-registry-creds),
# and the SIGNING_MODE-gated cosign-setup.sh sourcing. `after_script` always
# wipes /tmp/cosign.key even if the build failed mid-step.

.docker:
  # build-images push to the mirror registry (hort.kdp.kloni.cloud) with
  # credentials mounted only on the in-cluster Platform Runner at /secrets/zot;
  # off-cluster runners fall back to CI_REGISTRY_* (GitLab's own registry) and
  # fail `buildah login` with "invalid username/password". The `platform` tag
  # pins these jobs to the runner that holds the mirror secret.
  tags:
    - platform
  image: quay.io/buildah/stable:v1.43
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    BUILDAH_ISOLATION: chroot
    BUILDAH_LAYERS: "true"
  id_tokens:
    # vault-key signing uses VAULT_ID_TOKEN (aud the Vault/OpenBao JWT backend
    # accepts); keyless signing uses SIGSTORE_ID_TOKEN (Sigstore reads this env
    # var GitLab injects). Both are minted; each mode uses only the one it
    # needs. VAULT_ADDR is empty on keyless/none installs — that token is then
    # simply unused.
    VAULT_ID_TOKEN:
      aud: "${VAULT_ADDR}"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
    # hort registry.hort.rs federation token — audience must match
    # OidcIssuer.audiences on the server ("hort-server"). Only used when
    # HORT_PROXY_ENABLED == "true"; minted unconditionally because id_tokens are
    # job-level declarations, not conditional on runtime variables.
    HORT_OIDC_TOKEN:
      aud: hort-server
  before_script:
    - *hort-auth-steps
    - *platform-ca-rhel
    - mkdir -p ${CI_PROJECT_DIR}/build_info
    - *resolve-registry-creds
    - buildah login --username "$REGISTRY_USER" --password "$REGISTRY_PASSWORD" ${REGISTRY}
    # Set up cosign for image signing: skipped when SIGNING_MODE=none; installs
    # cosign for keyless; additionally fetches the Vault key for vault-key.
    - if [ "${SIGNING_MODE:-keyless}" != "none" ]; then . ${CI_PROJECT_DIR}/.gitlab/ci/cosign-setup.sh; fi
  after_script:
    - rm -f /tmp/cosign.key

# Single hort-server image. Tag policy:
#   - SemVer tag (vX.Y.Z, vX.Y.Z-rc.N, or vX.Y.Z-beta.N): push
#     :${CI_COMMIT_TAG#v} only; stable releases additionally push :latest,
#     pre-release (rc / beta) tags do NOT.
#   - main branch:                        push :${CI_COMMIT_SHORT_SHA} AND :latest.
#   - release/* branch:                   push :${CI_COMMIT_SHORT_SHA} only;
#     no :latest so a maintenance build can't clobber main's :latest.
# OCI labels for source/revision/version/created are filled at build time;
# title/license labels are baked into docker/Dockerfile.hort-server.
build-images:hort-server:
  extends: .docker
  stage: build-images
  variables:
    # Override the global pod memory limits — buildah runs `cargo build
    # --release` inside the Docker build, which is heavier than the
    # debug-profile compiles in stage 1 (LTO + release codegen). The
    # global `CARGO_BUILD_JOBS=2` env var does NOT propagate into the
    # Docker build environment (no ARG/ENV pickup in the Dockerfile),
    # so the inner cargo defaults to num_cpus parallelism. Headroom
    # rather than memory-tuning the Dockerfile is the cheaper path; if
    # this job starts to OOM, propagate CARGO_BUILD_JOBS via a
    # `--build-arg` + `ARG`/`ENV` pair in `docker/Dockerfile.hort-server`.
    KUBERNETES_MEMORY_REQUEST: "6Gi"
    KUBERNETES_MEMORY_LIMIT: "10Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc|beta)\.[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-changed-paths
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes: *code-changed-paths
  script:
    - |
      set -euo pipefail
      IMAGE="${REGISTRY}/${IMAGE_PREFIX}/hort-server"

      # Resolve primary version tag and whether to also push :latest.
      PUSH_LATEST="false"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION_TAG="${CI_COMMIT_TAG#v}"
        case "${VERSION_TAG}" in
          *-rc.*|*-beta.*) PUSH_LATEST="false" ;;
          *)      PUSH_LATEST="true"  ;;
        esac
      elif [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        VERSION_TAG="${CI_COMMIT_SHORT_SHA}"
        PUSH_LATEST="true"
      else
        # release/* branches: SHA tag only.
        VERSION_TAG="${CI_COMMIT_SHORT_SHA}"
        PUSH_LATEST="false"
      fi

      echo "=== build plan ==="
      echo "  IMAGE=${IMAGE}"
      echo "  VERSION_TAG=${VERSION_TAG}"
      echo "  PUSH_LATEST=${PUSH_LATEST}"
      echo "=================="

      BUILDAH_TAGS="--tag ${IMAGE}:${VERSION_TAG}"
      if [ "${PUSH_LATEST}" = "true" ]; then
        BUILDAH_TAGS="${BUILDAH_TAGS} --tag ${IMAGE}:latest"
      fi

      # Dynamic OCI labels (title + license are baked into the Dockerfile).
      buildah bud \
        --storage-driver=$STORAGE_DRIVER \
        --format=$BUILDAH_FORMAT \
        --isolation=$BUILDAH_ISOLATION \
        --cache-ttl=168h \
        --layers \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${VERSION_TAG}" \
        --label "org.opencontainers.image.created=${CI_JOB_STARTED_AT}" \
        ${BUILDAH_TAGS} \
        -f docker/Dockerfile.hort-server \
        .

      buildah push --digestfile /tmp/digest --storage-driver=$STORAGE_DRIVER "${IMAGE}:${VERSION_TAG}"
      DIGEST=$(cat /tmp/digest)

      if [ "${PUSH_LATEST}" = "true" ]; then
        buildah push --storage-driver=$STORAGE_DRIVER "${IMAGE}:latest"
      fi

      sh ${CI_PROJECT_DIR}/.gitlab/ci/cosign-sign.sh "${IMAGE}" "${DIGEST}"

      printf '%s\n' "${VERSION_TAG}" > ${CI_PROJECT_DIR}/build_info/image_tag
      printf '%s\n' "${DIGEST}"      > ${CI_PROJECT_DIR}/build_info/image_digest

      echo ""
      echo "=== Pushed and signed ==="
      echo "  ${IMAGE}:${VERSION_TAG}"
      if [ "${PUSH_LATEST}" = "true" ]; then echo "  ${IMAGE}:latest"; fi
      echo "  digest: ${DIGEST}"
      echo "========================="
  artifacts:
    paths:
      - build_info/
    expire_in: 30 days

# hort-worker image — mirrors the hort-server build job's tag policy, OCI
# labels, and cosign signing. Built from `docker/Dockerfile.worker`,
# pushed to `${REGISTRY}/${IMAGE_PREFIX}/hort-worker`. The worker carries
# Trivy + osv-scanner CLI binaries on top of the standard Rust build stage
# and runs the multi-kind TaskDispatcher (scan, cron-rescan-tick,
# advisory-watch-tick, staging-sweep, noop). The Helm chart's
# `worker.image.repository` default points here.
#
# Build artefact lands in `build_info/worker_image_tag` +
# `build_info/worker_image_digest` — distinct filenames from
# `build-images:hort-server`'s artefact so the Helm publish stage can
# fan-in both digests if it ever needs them. Today the chart pins
# only `Chart.appVersion`, so the digest files are informational.
build-images:hort-worker:
  extends: .docker
  stage: build-images
  variables:
    KUBERNETES_MEMORY_REQUEST: "6Gi"
    KUBERNETES_MEMORY_LIMIT: "10Gi"
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "4"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc|beta)\.[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-changed-paths
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes: *code-changed-paths
  script:
    - |
      set -euo pipefail
      IMAGE="${REGISTRY}/${IMAGE_PREFIX}/hort-worker"

      # Resolve primary version tag and whether to also push :latest.
      PUSH_LATEST="false"
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION_TAG="${CI_COMMIT_TAG#v}"
        case "${VERSION_TAG}" in
          *-rc.*|*-beta.*) PUSH_LATEST="false" ;;
          *)      PUSH_LATEST="true"  ;;
        esac
      elif [ "${CI_COMMIT_BRANCH:-}" = "main" ]; then
        VERSION_TAG="${CI_COMMIT_SHORT_SHA}"
        PUSH_LATEST="true"
      else
        # release/* branches: SHA tag only.
        VERSION_TAG="${CI_COMMIT_SHORT_SHA}"
        PUSH_LATEST="false"
      fi

      echo "=== build plan ==="
      echo "  IMAGE=${IMAGE}"
      echo "  VERSION_TAG=${VERSION_TAG}"
      echo "  PUSH_LATEST=${PUSH_LATEST}"
      echo "=================="

      BUILDAH_TAGS="--tag ${IMAGE}:${VERSION_TAG}"
      if [ "${PUSH_LATEST}" = "true" ]; then
        BUILDAH_TAGS="${BUILDAH_TAGS} --tag ${IMAGE}:latest"
      fi

      buildah bud \
        --storage-driver=$STORAGE_DRIVER \
        --format=$BUILDAH_FORMAT \
        --isolation=$BUILDAH_ISOLATION \
        --cache-ttl=168h \
        --layers \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${VERSION_TAG}" \
        --label "org.opencontainers.image.created=${CI_JOB_STARTED_AT}" \
        ${BUILDAH_TAGS} \
        -f docker/Dockerfile.worker \
        .

      buildah push --digestfile /tmp/digest --storage-driver=$STORAGE_DRIVER "${IMAGE}:${VERSION_TAG}"
      DIGEST=$(cat /tmp/digest)

      if [ "${PUSH_LATEST}" = "true" ]; then
        buildah push --storage-driver=$STORAGE_DRIVER "${IMAGE}:latest"
      fi

      sh ${CI_PROJECT_DIR}/.gitlab/ci/cosign-sign.sh "${IMAGE}" "${DIGEST}"

      printf '%s\n' "${VERSION_TAG}" > ${CI_PROJECT_DIR}/build_info/worker_image_tag
      printf '%s\n' "${DIGEST}"      > ${CI_PROJECT_DIR}/build_info/worker_image_digest

      echo ""
      echo "=== Pushed and signed ==="
      echo "  ${IMAGE}:${VERSION_TAG}"
      if [ "${PUSH_LATEST}" = "true" ]; then echo "  ${IMAGE}:latest"; fi
      echo "  digest: ${DIGEST}"
      echo "========================="
  artifacts:
    paths:
      - build_info/
    expire_in: 30 days

# ===========================================================================
# Stage 5: helm — lint, package, push the hort-server chart
# ===========================================================================
#
# Chart-version and app-version are coupled to the same SemVer string. On a
# SemVer tag the version is the tag with the leading `v` stripped; on main /
# release/* branches a snapshot version
# `0.0.0-snapshot.${CI_PIPELINE_IID}` is used so every pipeline produces a
# uniquely-named chart artefact for smoke testing without colliding with any
# released version. `helm lint` is run with `test-values.yaml` because
# values.yaml's defaults are intentionally invalid (publicBaseUrl empty,
# etc.) so the schema fails on the bare values.

helm:lint-and-publish:
  stage: helm
  # `helm push` targets the same mirror registry as build-images, whose
  # credentials are mounted only on the in-cluster Platform Runner; the
  # `platform` tag pins the job to that runner (see .docker).
  tags:
    - platform
  # entrypoint: [""] — see quality:helm-template-test; the alpine/helm image's
  # ENTRYPOINT ["helm"] must be overridden so a podman-executor runner runs the
  # job shell instead of `helm sh`.
  image:
    name: alpine/helm:3.21.3
    entrypoint: [""]
  needs:
    - job: build-images:hort-server
      artifacts: true
    - job: build-images:hort-worker
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc|beta)\.[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *code-changed-paths
    - if: $CI_COMMIT_BRANCH =~ /^release\//
      changes: *code-changed-paths
  before_script:
    # Trust platform CA for registry (Alpine: install ca-certificates first)
    - apk add --no-cache ca-certificates
    - *platform-ca-deb
    # Login to the chart registry
    - *resolve-registry-creds
    - helm registry login --username "$REGISTRY_USER" --password "$REGISTRY_PASSWORD" ${REGISTRY}
  script:
    - |
      set -eu
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.0.0-snapshot.${CI_PIPELINE_IID}"
      fi
      echo "=== helm publish plan ==="
      echo "  VERSION=${VERSION}"
      echo "  REGISTRY=${REGISTRY}/${IMAGE_PREFIX}/charts"
      echo "========================="

      # §3.4 invariant lint — on a SemVer-tagged pipeline, the in-tree
      # Chart.yaml must already declare the tag's version on both
      # `version` and `appVersion` (chart and binary are versioned
      # together). `helm package --version/--app-version` would override
      # at publish time anyway, but a stale Chart.yaml drifts from §3.4
      # for non-CI consumers (`helm install ./deploy/helm/hort-server`,
      # `helm template`, source-tree docs). Skipped on main / release/*
      # snapshot pipelines where VERSION is a pipeline-IID, not a tag.
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        chart_version=$(grep -E '^version:' deploy/helm/hort-server/Chart.yaml \
          | sed -E 's/^version:[[:space:]]*//;s/^"//;s/"$//')
        chart_app_version=$(grep -E '^appVersion:' deploy/helm/hort-server/Chart.yaml \
          | sed -E 's/^appVersion:[[:space:]]*//;s/^"//;s/"$//')
        if [ "${chart_version}" != "${VERSION}" ] || [ "${chart_app_version}" != "${VERSION}" ]; then
          echo "ERROR: Chart.yaml drifted from tag ${CI_COMMIT_TAG} (§3.4 invariant)."
          echo "  Chart.yaml version    = ${chart_version}"
          echo "  Chart.yaml appVersion = ${chart_app_version}"
          echo "  Expected (tag minus 'v') = ${VERSION}"
          echo "Bump deploy/helm/hort-server/Chart.yaml and re-tag."
          exit 1
        fi
        echo "§3.4 invariant ok: Chart.yaml version + appVersion = ${VERSION}"
      fi

      helm lint deploy/helm/hort-server/ -f deploy/helm/hort-server/test-values.yaml
      helm package deploy/helm/hort-server/ \
        --app-version "${VERSION}" \
        --version "${VERSION}"
      helm push hort-server-*.tgz "oci://${REGISTRY}/${IMAGE_PREFIX}/charts"

# ===========================================================================
# Stage 5b: helm chart signature — first-party keyed cosign (Vault Transit)
# ===========================================================================
#
# Dogfood: hort signs its OWN Helm chart with the first-party Transit key
# (hashivault://first-party-cosign) — the same key the platform's first-party
# apps sign with — so the platform Flux gates the prod hort HelmRepository on a
# valid signature (.spec.verify, cosign public key).
#
# LEGACY .sig-tag mode (deliberately NO --registry-referrers-mode=oci-1-1):
# Flux source-controller (v1.8.0) discovers cosign signatures via the
# sha256-<digest>.sig tag, NOT the OCI 1.1 Referrers API. This is the opposite
# of the IMAGE signing (cosign-sign.sh, oci-1-1) whose verifier is hort's own
# referrer-aware worker — each artefact is signed in the format its verifier
# reads. Isolated from helm:lint-and-publish (needs: it) so a signing hiccup
# never blocks chart publishing; the chart is pushed first, then signed.

helm:sign-chart:
  stage: helm
  tags:
    - platform
  # buildah-cosign tools image: Fedora + cosign v3 + curl + jq (the same image
  # the platform first-party oci component signs with). No helm needed — cosign
  # resolves the chart tag to its digest itself.
  image: ${CI_TOOLS_REGISTRY}/ci/buildah-cosign:latest
  needs:
    - job: helm:lint-and-publish
  rules:
    # `alpha` included for parity with build-images:* / helm:lint-and-publish
    # (the #25 alpha-routing widening). This job landed after that change with
    # only `(rc|beta)`, so an internal `-alpha.N` tag would skip signing
    # SILENTLY (no match, no failure) and publish an unsigned chart. Keep the
    # tag-suffix set identical across every job that acts on a release tag.
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc|beta)\.[0-9]+)?$/
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "${VAULT_ADDR}"
  before_script:
    # Trust the platform CA (Fedora anchors) for TLS to the mirror + OpenBao.
    - |
      CA="${PLATFORM_CA_PATH:-${CI_SERVER_TLS_CA_FILE:-}}"
      if [ -n "$CA" ] && [ -f "$CA" ]; then
        cp "$CA" /etc/pki/ca-trust/source/anchors/kdp-platform-ca.crt && update-ca-trust
      fi
    - *resolve-registry-creds
  script:
    - |
      set -eu
      # Recompute VERSION identically to helm:lint-and-publish (kept self-
      # contained so the publish job stays byte-for-byte untouched).
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="0.0.0-snapshot.${CI_PIPELINE_IID}"
      fi
      CHART_REF="${REGISTRY}/${IMAGE_PREFIX}/charts/hort-server:${VERSION}"
      echo "=== chart sign ==="
      echo "  CHART_REF=${CHART_REF}"
      echo "  key=hashivault://first-party-cosign (role first-party-hort)"
      echo "=================="
      # Vault JWT login -> token carrying the first-party-sign policy (transit
      # sign on first-party-cosign). Role bound to project_path=pub-projects/hort
      # + ref_protected=true, so it authorises only on protected refs.
      VR=$(curl -sS --request POST \
        --data "{\"jwt\":\"${VAULT_ID_TOKEN}\",\"role\":\"first-party-hort\"}" \
        "${VAULT_ADDR}/v1/auth/gitlab/login")
      VAULT_TOKEN="$(echo "$VR" | jq -r '.auth.client_token // empty')"
      [ -n "$VAULT_TOKEN" ] || { echo "Vault auth failed (role first-party-hort): $VR"; exit 1; }
      export VAULT_TOKEN
      export TRANSIT_SECRET_ENGINE_PATH=transit
      # cosign writes the signature as a PUSH -> authenticate to the mirror
      # (anon-read, authenticated-write).
      cosign login "${REGISTRY}" -u "${REGISTRY_USER}" -p "${REGISTRY_PASSWORD}"
      # LEGACY .sig-tag signature (Flux-discoverable). No Rekor (private infra).
      # Pin the output format explicitly: cosign v3 WITHOUT these flags defaults
      # to an OCI-referrer + v0.3-bundle signature (validated on the beta.5 tag
      # pipeline: referrer created, NO .sig tag) which Flux source-controller
      # (v1.8.0, tag-based discovery) cannot see. new-bundle-format=false +
      # referrers-mode=legacy = classic simplesigning payload under the
      # sha256-<digest>.sig tag -- the one format Flux verifies.
      cosign sign --yes --key hashivault://first-party-cosign \
        --use-signing-config=false --tlog-upload=false \
        --new-bundle-format=false --registry-referrers-mode=legacy \
        "${CHART_REF}"
      echo "signed ${CHART_REF} (first-party key, legacy .sig tag)"



# ===========================================================================
# Stage 6: release — CycloneDX SBOM artefact for tagged releases
# ===========================================================================
#
# CRA Annex I §2 mandates a maintained SBOM as part of delivery.
# cargo-cyclonedx writes one `bom.json` per workspace member next to its
# Cargo.toml; we collect them under `sbom/` for upload.
#
# The job runs only on `v*.*.*` tags so feature-branch pipelines stay fast.
# The artefact expires after one year; the GitHub Actions release workflow
# attaches the matching SBOM to the published release directly.

release:sbom:
  stage: release
  # cosign-setup.sh authenticates to Vault at openbao.kdp.kloni.cloud, whose TLS
  # cert is signed by the internal PKI CA that only the in-cluster runners
  # trust; off-cluster the Vault login fails `curl (60) unable to get local
  # issuer certificate`. The `platform` tag pins the job to that runner (see
  # .docker).
  tags:
    - platform
  image: ${RUST_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  # The SBOM bundle is cosign-signed with the existing image-signing key
  # (Vault path
  # `secret/data/platform/cosign/signing-key`, fetched via
  # `cosign-setup.sh`). Mirrors the structure of the GitHub Actions
  # `sbom` job (.github/workflows/release.yml) — both pipelines stay
  # in lockstep on what gets signed; the secret-management surface
  # differs between the two CI systems by necessity (GitHub Actions
  # uses keyless OIDC against Sigstore Fulcio; GitLab pulls the
  # private key from Vault). Verification recipe for downstream
  # consumers: docs/architecture/how-to/release-verification.md.
  id_tokens:
    VAULT_ID_TOKEN:
      aud: "${VAULT_ADDR}"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
    HORT_OIDC_TOKEN:
      aud: hort-server
  before_script:
    # rust-apt-deps installs curl/ca-certificates; platform-ca-deb then trusts
    # the internal PKI CA (PLATFORM_CA_PATH) so hort-auth's OIDC exchange (curl)
    # can verify an internal-CA HORT_URL endpoint. Both precede hort-auth-steps.
    - *rust-apt-deps
    - *platform-ca-deb
    - *hort-auth-steps
    # cosign-setup.sh's `apk add jq` / `dnf install jq` fallback does
    # not cover debian-based images. The rust-apt-deps anchor above
    # already pulls curl + ca-certificates; add jq explicitly so the
    # Vault-token + key fetch in cosign-setup.sh succeeds.
    - apt-get install -y -qq --no-install-recommends jq
    - *install-binstall
    - |
      # Skip when the image already ships the tool; otherwise install and
      # FAIL if it is still missing. A swallowed install failure surfaces much
      # later as "no such command", long after the cause has scrolled away.
      if ! cargo cyclonedx --version >/dev/null 2>&1; then
        cargo binstall --no-confirm --locked cargo-cyclonedx \
          || cargo install --locked cargo-cyclonedx
      fi
      cargo cyclonedx --version >/dev/null 2>&1 || {
        echo "cargo cyclonedx unavailable: binstall and cargo install both failed" >&2
        exit 1
      }
    # Trust the platform CA (internal PKI) BEFORE cosign-setup.sh runs: in
    # vault-key mode its HTTPS call to ${VAULT_ADDR} (OpenBao) must verify
    # against an internal CA not in the public bundle. No-op when
    # PLATFORM_CA_PATH is unset/absent (public-CA / keyless setups).
    - *platform-ca-deb
    # SOURCE cosign-setup.sh (leading `.`, NOT `bash`) so its COSIGN_PASSWORD
    # export survives into THIS shell — a child process would discard it,
    # leaving the `cosign sign-blob` key undecryptable. vault-key fetches the
    # key into /tmp/cosign.key + exports COSIGN_PASSWORD; keyless only installs
    # cosign; none skips signing and is not sourced. The `test -s` then fails
    # closed (vault-key only) if the key was somehow not written.
    - if [ "${SIGNING_MODE:-keyless}" != "none" ]; then . ${CI_PROJECT_DIR}/.gitlab/ci/cosign-setup.sh; fi
    - if [ "${SIGNING_MODE:-keyless}" = "vault-key" ]; then test -s /tmp/cosign.key; fi
  after_script:
    - rm -f /tmp/cosign.key
  script:
    - cargo cyclonedx --format json --override-filename sbom
    - mkdir -p sbom
    - find . -name "sbom.json" -not -path "./target/*" -not -path "./.cargo/*" -exec sh -c '
        rel=$(dirname "$1" | sed "s|^\./||");
        crate=$(echo "$rel" | tr / -);
        cp "$1" "sbom/sbom-${crate:-root}.json"
      ' _ {} \;
    - ls -la sbom/
    # Bundle the SBOMs into a tarball matching the GitHub release
    # workflow shape, so a single signed artefact ships per release
    # and downstream consumers verify the same blob across pipelines.
    - tar -czvf hort-sbom.tar.gz sbom/
    - sha256sum hort-sbom.tar.gz > hort-sbom.tar.gz.sha256
    # Sign the bundled tarball per SIGNING_MODE. vault-key: offline key, no
    # Rekor (--use-signing-config=false selects the legacy key path where
    # --key / --tlog-upload=false / --new-bundle-format=false are honored —
    # cosign v3 otherwise defaults --use-signing-config=true and rejects
    # --tlog-upload=false). keyless: Sigstore/Fulcio with Rekor upload (the
    # public-good verification path). none: skip. Both signing modes still
    # emit hort-sbom.tar.gz.sig so the artefact paths below stay valid.
    - |
      # Explicit arm per mode + fail-closed default, mirroring
      # .gitlab/ci/cosign-sign.sh so an unknown/typo'd SIGNING_MODE errors
      # clearly here too instead of silently falling through to the vault-key
      # path (which would then die deep in `cosign sign-blob` on a key that was
      # never fetched).
      case "${SIGNING_MODE:-keyless}" in
        none)
          echo "SIGNING_MODE=none — skipping SBOM signature" ;;
        keyless)
          cosign sign-blob --yes \
            --output-signature hort-sbom.tar.gz.sig hort-sbom.tar.gz ;;
        vault-key)
          cosign sign-blob --yes --key /tmp/cosign.key \
            --new-bundle-format=false --use-signing-config=false \
            --tlog-upload=false \
            --output-signature hort-sbom.tar.gz.sig hort-sbom.tar.gz ;;
        *)
          echo "ERROR: unknown SIGNING_MODE=${SIGNING_MODE} (expected vault-key|keyless|none)" >&2
          exit 1 ;;
      esac
  artifacts:
    name: "hort-sbom-${CI_COMMIT_TAG}"
    when: on_success
    paths:
      - sbom/
      - hort-sbom.tar.gz
      - hort-sbom.tar.gz.sha256
      - hort-sbom.tar.gz.sig
    expire_in: 1 year